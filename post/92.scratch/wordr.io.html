(function(){
  var list=[
    "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
    "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
  ],i=0;
  function next(){
    if(i>=list.length){window.__peerFailed=true;return;}
    var s=document.createElement("script");s.src=list[i++];
    s.onload=function(){};
    s.onerror=function(){next();};
    document.head.appendChild(s);
  }
  next();
})();
</script>
<style>
:root{--ink:#1E293B;--blue:#3B82F6;--red:#EF4444;--green:#10B981;--purple:#8B5CF6;--orange:#F59E0B;--gold:#FBBF24;--bg:#F8FAFC;--grid:#E2E8F0}
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Nunito','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);overflow:hidden;color:var(--ink)}
canvas{display:block;touch-action:none}
.hide{display:none!important}
.panel{background:#fff;border:2px solid var(--grid);border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}
.btn{font-family:Fredoka,'Nunito',sans-serif;font-weight:700;font-size:17px;color:#fff;border:0;border-radius:999px;
  padding:12px 24px;cursor:pointer;transition:all .1s;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 8px -1px rgba(0,0,0,.15)}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--blue)}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.gray{background:#94A3B8}
.btn.small{font-size:13px;padding:8px 16px}
input{font-family:inherit;font-weight:700;font-size:16px;padding:12px 16px;border:2px solid var(--grid);border-radius:12px;outline:none;width:100%}
input:focus{border-color:var(--blue)}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;z-index:20;background:linear-gradient(160deg,#F8FAFC,#E2E8F0)}
.fshape{position:absolute;opacity:.6;pointer-events:none;animation:float 6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-10px) rotate(-5deg)}to{transform:translateY(10px) rotate(5deg)}}
.logo{text-align:center;z-index:1}
.logo h1{font-family:Fredoka,sans-serif;font-size:clamp(42px,7vw,68px);letter-spacing:2px;color:var(--ink)}
.logo h1 span{color:var(--green)}
.logo .tag{font-weight:800;color:#64748B;margin-top:4px}
#menu .panel{width:min(460px,92vw);padding:28px;z-index:1;display:flex;flex-direction:column;gap:16px}
#menu label{font-weight:800;font-size:14px;color:#64748B}
.lvrow{display:flex;gap:10px}
.lv{flex:1;font-weight:800;padding:10px 0;border:2px solid var(--grid);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;color:#64748B}

#lb h4{font-family:Fredoka,sans-serif;font-size:15px;margin-bottom:10px;color:#64748B;display:flex;align-items:center;gap:6px}

  padding:28px;animation:pop .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#qKind{font-size:12px;font-weight:800;color:#fff;background:var(--ink);display:inline-block;padding:4px 14px;border-radius:999px}

#qPrompt .blank{color:var(--orange);border-bottom:4px solid var(--orange);padding:0 8px}

.opt{background:#F8FAFC;border:2px solid var(--grid);border-radius:16px;padding:16px;font-weight:800;font-size:17px;cursor:pointer;
  text-align:left;display:flex;gap:10px;align-items:center;transition:.1s;color:var(--ink)}
.opt:hover{border-color:var(--blue);transform:translateY(-2px);background:#F1F5F9}
.opt .key{background:#fff;border:2px solid var(--grid);border-radius:8px;width:28px;height:28px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:14px;color:#64748B}
.opt.ok{background:var(--green);border-color:#059669;color:#fff}
.opt.no{background:var(--red);border-color:#DC2626;color:#fff}
#qBar{height:10px;background:#F1F5F9;border-radius:999px;margin-top:20px;overflow:hidden}
#qFill{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));width:100%;border-radius:999px}
#qFb{margin-top:18px;padding:16px;border-radius:16px;background:#F8FAFC;line-height:1.7;border:1px solid var(--grid)}
.fbt{font-family:Fredoka,sans-serif;font-size:20px}.fbt.good{color:var(--green)}.fbt.bad{color:var(--red)}
.fbw{font-family:Fredoka,sans-serif;font-size:26px;color:var(--ink)}.fbp{color:#94A3B8;font-size:16px}
.fbm{font-weight:800;color:#475569}.fbs{color:#64748B;font-weight:600}.fbs b{color:var(--orange)}
.spk{border:0;background:#EFF6FF;color:var(--blue);border-radius:10px;padding:4px 12px;cursor:pointer;font-size:16px;font-weight:800}
#toasts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 24px;border-radius:999px;
  animation:rise .25s ease-out;white-space:nowrap;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@media(max-width:640px){#qOpts{grid-template-columns:1fr}#lb{width:160px;display:none}}
</style>
</head>

<script>
/* ============ 1. 词库 ============ */
const BANK={
junior:[
 {w:"brave",m:"adj. 勇敢的",p:"/breɪv/",s:"The _ firefighter saved the cat."},
 {w:"borrow",m:"v. 借入",p:"/ˈbɒrəʊ/",s:"May I _ your dictionary?"},
 {w:"environment",m:"n. 环境",p:"/ɪnˈvaɪrənmənt/",s:"We must protect the _."},
 {w:"decide",m:"v. 决定",p:"/dɪˈsaɪd/",s:"I can't _ which book to buy."},
 {w:"nervous",m:"adj. 紧张的",p:"/ˈnɜːvəs/",s:"She felt _ before the exam."},
 {w:"achieve",m:"v. 实现;达到",p:"/əˈtʃiːv/",s:"You can _ your dream by working hard."},
 {w:"suggest",m:"v. 建议",p:"/səˈdʒest/",s:"I _ going out for a walk."},
 {w:"patient",m:"adj. 耐心的",p:"/ˈpeɪʃnt/",s:"Be _ with your little brother."},
 {w:"discover",m:"v. 发现",p:"/dɪˈskʌvə/",s:"Scientists _ new things every year."},
 {w:"temperature",m:"n. 温度",p:"/ˈtemprətʃə/",s:"The _ today is 30 degrees."},
 {w:"improve",m:"v. 改善;提高",p:"/ɪmˈpruːv/",s:"Reading helps _ your English."},
 {w:"knowledge",m:"n. 知识",p:"/ˈnɒlɪdʒ/",s:"_ is power."}],
senior:[
 {w:"abandon",m:"v. 放弃;抛弃",p:"/əˈbændən/",s:"They had to _ the car in the snow."},
 {w:"absorb",m:"v. 吸收",p:"/əbˈzɔːb/",s:"Plants _ water through their roots."},
 {w:"academic",m:"adj. 学术的",p:"/ˌækəˈdemɪk/",s:"Her _ performance is excellent."},
 {w:"adapt",m:"v. 适应",p:"/əˈdæpt/",s:"It took him a year to _ to city life."},
 {w:"anxiety",m:"n. 焦虑",p:"/æŋˈzaɪəti/",s:"She hid her _ behind a smile."},
 {w:"appreciate",m:"v. 感激;欣赏",p:"/əˈpriːʃieɪt/",s:"I really _ your help."},
 {w:"consequence",m:"n. 后果;结果",p:"/ˈkɒnsɪkwəns/",s:"Every choice has its _."},
 {w:"controversial",m:"adj. 有争议的",p:"/ˌkɒntrəˈvɜːʃl/",s:"It remains a _ topic."},
 {w:"distinguish",m:"v. 区分",p:"/dɪˈstɪŋɡwɪʃ/",s:"Can you _ the twins?"},
 {w:"guarantee",m:"v./n. 保证",p:"/ˌɡærənˈtiː/",s:"Hard work doesn't _ success."},
 {w:"phenomenon",m:"n. 现象",p:"/fəˈnɒmɪnən/",s:"A rainbow is a natural _."},
 {w:"significant",m:"adj. 重要的;显著的",p:"/sɪɡˈnɪfɪkənt/",s:"This is a _ improvement."}],
college:[
 {w:"ambiguous",m:"adj. 模棱两可的",p:"/æmˈbɪɡjuəs/",s:"His answer was deliberately _."},
 {w:"compensate",m:"v. 补偿",p:"/ˈkɒmpenseɪt/",s:"Nothing can _ for lost time."},
 {w:"deteriorate",m:"v. 恶化",p:"/dɪˈtɪəriəreɪt/",s:"His health began to _."},
 {w:"empirical",m:"adj. 实证的",p:"/ɪmˈpɪrɪkl/",s:"The theory needs _ evidence."},
 {w:"hypothesis",m:"n. 假设",p:"/haɪˈpɒθəsɪs/",s:"The experiment confirmed our _."},
 {w:"implement",m:"v. 实施",p:"/ˈɪmplɪment/",s:"The school will _ the new policy."},
 {w:"inevitable",m:"adj. 不可避免的",p:"/ɪnˈevɪtəbl/",s:"Change is _."},
 {w:"paradox",m:"n. 悖论",p:"/ˈpærədɒks/",s:"It's a _ that the best way to win is not to fear losing."},
 {w:"scrutinize",m:"v. 仔细审查",p:"/ˈskruːtənaɪz/",s:"Auditors _ every expense."},
 {w:"sustainable",m:"adj. 可持续的",p:"/səˈsteɪnəbl/",s:"We need _ sources of energy."},
 {w:"ubiquitous",m:"adj. 无处不在的",p:"/juːˈbɪkwɪtəs/",s:"Smartphones are _ today."},
 {w:"vulnerable",m:"adj. 脆弱的;易受伤的",p:"/ˈvʌlnərəbl/",s:"Children are especially _ to pollution."}]};
const LEVELS={junior:{name:"初中·中考"},senior:{name:"高中·高考"},college:{name:"大学·四六级"}};

/* ============ 2. 间隔重复 ============ */
const INTERVALS=[0,6e4,6e5,864e5,3*864e5,7*864e5];
let sr={}; try { sr=JSON.parse(localStorage.getItem('wr_sr')||'{}'); } catch(e) {}
let stats={day:"",streak:0,today:0}; try { stats=JSON.parse(localStorage.getItem('wr_stats')||'{"day":"","streak":0,"today":0}'); } catch(e) {}
const saveSR=()=>{try{localStorage.setItem('wr_sr',JSON.stringify(sr));}catch(e){}};
const saveStats=()=>{try{localStorage.setItem('wr_stats',JSON.stringify(stats));}catch(e){}};
function srReview(w,ok){let r=sr[w]||{b:0,ok:0,no:0,n:0};if(ok){r.b=Math.min(5,r.b+1);r.ok++;}else{r.b=1;r.no++;}r.n=Date.now()+INTERVALS[r.b]; sr[w]=r; saveSR();}
const isDue=w=>{const r=sr[w];return !r||r.n<=Date.now();};
const pool=()=>BANK[roomLevel];
const dueWords=()=>pool().filter(o=>isDue(o.w));
const newWords=()=>pool().filter(o=>!sr[o.w]);
(()=>{const today=new Date().toDateString();if(stats.day!==today){const y=new Date(Date.now()-864e5).toDateString();stats.streak=(stats.day===y)?stats.streak+1:1;stats.day=today;stats.today=0;saveStats();}})();

/* ============ 3. 工具 ============ */
const rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeQuiz(word){
  const others=shuffle(pool().filter(o=>o.w!==word.w)).slice(0,3);
  const types=['v2c','c2v']; if(word.s)types.push('cloze','cloze');
  const t=types[Math.random()*types.length|0];
  let q,ans,opts;
  if(t==='v2c'){q=word.w;ans=word.m;opts=shuffle([ans,...others.map(o=>o.m)]);}
  else if(t==='c2v'){q=word.m;ans=word.w;opts=shuffle([ans,...others.map(o=>o.w)]);}
  else{q=word.s;ans=word.w;opts=shuffle([ans,...others.map(o=>o.w)]);}
  return {t,q,opts,ans:opts.indexOf(ans),w:word.w,m:word.m,p:word.p,s:word.s};
}
function speak(w){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u);}catch(e){}}

/* ============ 4. 状态 ============ */
const W=2600,H=2600,ORB_N=28,BOMB_N=4;
const COLORS=['#3B82F6','#10B981','#F59E0B','#8B5CF6','#EF4444','#EC4899']; 
const RAR_COLORS=['#CBD5E1','#86EFAC','#93C5FD','#D8B4FE','#FBBF24']; 
const RAR_NAMES=['普通','优秀','稀有','史诗','传说'];
const lvlOf=xp=>1+Math.floor(Math.sqrt(xp/40));
const xpFor=l=>40*(l-1)*(l-1);
const rarIdx=l=>Math.min(4,((l-1)/3)|0);

let players=new Map(),orbs=[],pending={},orbInfo=new Map(),nextId=1,colSeq=0;
let isHost=false,solo=false,inGame=false,myPid=null,roomCode='',roomLevel='junior';
let frame=0;
const view={p:new Map(),o:new Map()};
let cam={x:W/2,y:H/2,z:1};
const FX=[];

function spawnPlayer(id,name,bot=false){
  const c=COLORS[colSeq++%COLORS.length];
  const p={id,name,bot,x:rand(250,W-250),y:rand(250,H-250),tx:W/2,ty:H/2,
    xp:0,streak:0,col:c,hp:112,mhp:112,lvl:1,r:26,quiz:false,deadT:0,inv:1.5,lastHit:0,oa:Math.random()*6,bt:0};
  players.set(id,p); return p;
}
function spawnOrb(x,y,gold){
  const w=pool()[Math.random()*pool().length|0];
  const kinds=['v2c','v2c','c2v']; if(w.s)kinds.push('cloze');
  const kind=gold?'v2c':kinds[Math.random()*kinds.length|0];
  const o={id:nextId++,x:x??rand(100,W-100),y:y??rand(100,H-100),r:gold?22:rand(16,22),
    kind,word:w.w,gold:!!gold,free:true,rs:0,vx:rand(-4,4),vy:rand(-4,4)};
  orbs.push(o);
  const info={i:o.id,k:kind,g:o.gold,tx:kind==='v2c'?w.w:kind==='c2v'?w.m:'✎ 句子'};
  orbInfo.set(o.id,info); broadcast({t:'oa',o:info});
}
function spawnBomb(){
  const o={id:nextId++,x:rand(150,W-150),y:rand(150,H-150),r:18,kind:'bomb',free:true,rs:0,vx:rand(-10,10),vy:rand(-10,10)};
  orbs.push(o); const info={i:o.id,k:'bomb',g:false,tx:''}; orbInfo.set(o.id,info); broadcast({t:'oa',o:info});
}

/* ============ 5. 逻辑 ============ */
function updateLvl(p,was){p.lvl=lvlOf(p.xp);if(p.lvl!==was){p.r=24+p.lvl*2.5;p.mhp=100+p.lvl*12;p.hp=Math.min(p.hp+20,p.mhp);fx('lvl',p.x,p.y,p.lvl);if(p.id===myPid)toast(`⬆ 升到 Lv.${p.lvl}! ${RAR_NAMES[rarIdx(p.lvl)]}花瓣进化`);}}
function consumeOrb(o){orbs.splice(orbs.indexOf(o),1);spawnOrb();}
function kill(p){p.deadT=3;p.quiz=false;p.streak=0;fx('boom',p.x,p.y);for(const oid in pending)if(pending[oid].pid===p.id){const o=orbs.find(o=>o.id==oid);if(o)o.free=true;delete pending[oid];}spawnOrb(p.x+rand(-50,50),p.y+rand(-50,50),true);spawnOrb(p.x+rand(-50,50),p.y+rand(-50,50),true);if(p.id===myPid)toast('💥 被大体型撞倒! 3秒后复活');}
function respawn(p){for(let i=0;i<12;i++){p.x=rand(150,W-150);p.y=rand(150,H-150);let ok=true;for(const q of players.values())if(q!==p&&q.deadT<=0&&(q.x-p.x)**2+(q.y-p.y)**2<9e4){ok=false;break;}if(ok)break;}const was=p.lvl;p.xp=Math.floor(p.xp*.85);p.lvl=lvlOf(p.xp);p.r=24+p.lvl*2.5;p.mhp=100+p.lvl*12;p.hp=p.mhp;p.inv=2.5;p.quiz=false;if(p.id===myPid)toast('已复活! 损失15%经验');}
function botThink(p,dt){p.bt-=dt;if(p.bt>0)return;p.bt=1.5+Math.random()*2.5;const free=orbs.filter(o=>o.free&&o.kind!=='bomb');if(free.length&&Math.random()<.85){let best=null,bd=1e18;for(const o of free){const d=(o.x-p.x)**2+(o.y-p.y)**2;if(d<bd){bd=d;best=o;}}p.tx=best.x;p.ty=best.y;}else{p.tx=rand(150,W-150);p.ty=rand(150,H-150);}}
function tick(dt){const now=performance.now();for(const p of players.values()){if(p.deadT>0){p.deadT-=dt;if(p.deadT<=0)respawn(p);continue;}p.inv=Math.max(0,p.inv-dt);p.hp=Math.min(p.mhp,p.hp+2.2*dt);p.oa+=dt*2.6;if(p.bot)botThink(p,dt);if(!p.quiz){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>4){const sp=Math.min(d,280)*dt;p.x+=dx/d*sp;p.y+=dy/d*sp;}}p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));}for(const o of orbs){if(o.rs>0){o.rs-=dt;if(o.rs<=0){o.x=rand(150,W-150);o.y=rand(150,H-150);o.free=true;}continue;}if(!o.free)continue;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<o.r||o.x>W-o.r)o.vx*=-1;if(o.y<o.r||o.y>H-o.r)o.vy*=-1;}for(const p of players.values()){if(p.deadT>0||p.quiz)continue;for(const o of orbs){if(!o.free)continue;const d=Math.hypot(o.x-p.x,o.y-p.y);if(o.kind==='bomb'){if(d<p.r+o.r&&p.inv<=0){p.hp-=20;p.inv=.7;p.x+=(p.x-o.x)*.6;p.y+=(p.y-o.y)*.6;o.free=false;o.rs=3;fx('boom',o.x,o.y);}}else if(d<p.r+o.r+4){o.free=false;const word=pool().find(x=>x.w===o.word)||pool()[0];const qz=makeQuiz(word);pending[o.id]={pid:p.id,ans:qz.ans,dl:Date.now()+15000};p.quiz=true;sendTo(p.id,{t:'quiz',oid:o.id,q:qz});}}}const arr=[...players.values()];for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j];if(a.deadT>0||b.deadT>0)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=a.r+b.r;if(d<min){const push=(min-d)/2,nx=dx/d,ny=dy/d;if(!a.quiz){a.x-=nx*push;a.y-=ny*push;}if(!b.quiz){b.x+=nx*push;b.y+=ny*push;}const big=a.r>=b.r?a:b,sm=a.r>=b.r?b:a;if(big.r>sm.r*1.12&&!sm.quiz&&sm.inv<=0&&now-sm.lastHit>650){sm.hp-=6+big.lvl;sm.lastHit=now;sm.inv=.35;fx('hit',sm.x,sm.y);}}}for(const p of players.values())if(p.hp<=0&&p.deadT<=0)kill(p);for(const oid in pending)if(Date.now()>pending[oid].dl){const pid=pending[oid].pid;resolveAnswer(+oid,-1,false);sendTo(pid,{t:'res',oid:+oid,to:true});}}
function resolveAnswer(oid,idx,due){const pd=pending[oid];if(!pd)return;delete pending[oid];const p=players.get(pd.pid),o=orbs.find(o=>o.id===oid);if(!p){if(o){o.x=rand(120,W-120);o.y=rand(120,H-120);o.free=true;}return;}p.quiz=false;if(idx===pd.ans){p.streak++;const mult=Math.min(5,1+((p.streak/3)|0));const gain=12*mult*(o&&o.gold?2:1)*(due?2:1);const was=p.lvl;p.xp+=gain;updateLvl(p,was);if(o){fx('pop',o.x,o.y,'+'+gain+(due?' ⭐复习':''));consumeOrb(o);}}else{p.streak=0;p.hp=Math.max(1,p.hp-10);if(o){fx('miss',o.x,o.y);o.x=rand(120,W-120);o.y=rand(120,H-120);o.free=true;}}}

/* ============ 6. 快照 ============ */
function buildSnap(){return {t:'st',ps:[...players.values()].map(p=>({i:p.id,n:p.name,x:p.x|0,y:p.y|0,r:p.r|0,h:p.hp|0,mh:p.mhp,xp:p.xp,c:p.col,l:p.lvl,k:p.streak,q:p.quiz,d:p.deadT>0,tx:p.tx|0,ty:p.ty|0})),os:orbs.map(o=>({i:o.id,x:o.x|0,y:o.y|0,r:o.r|0}))};}
function applySnap(s){const seenP=new Set(),seenO=new Set();for(const sp of s.ps){seenP.add(sp.i);let v=view.p.get(sp.i);if(!v){v={x:sp.x,y:sp.y};view.p.set(sp.i,v);}v.txp=sp.x;v.typ=sp.y;Object.assign(v,{n:sp.n,r:sp.r,h:sp.h,mh:sp.mh,xp:sp.xp,c:sp.c,l:sp.l,k:sp.k,q:sp.q,d:sp.d,tx:sp.tx,ty:sp.ty});}for(const[id]of view.p)if(!seenP.has(id))view.p.delete(id);for(const so of s.os){seenO.add(so.i);let v=view.o.get(so.i);if(!v){v={x:so.x,y:so.y};view.o.set(so.i,v);}v.txp=so.x;v.typ=so.y;v.r=so.r;}for(const[id]of view.o)if(!seenO.has(id))view.o.delete(id);}

/* ============ 7. 渲染 (Florr风格) ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resize);resize();

function label(txt,x,y,size){ctx.font=`800 ${size}px Fredoka,Nunito,sans-serif`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(txt,x,y);ctx.fillStyle='#1E293B';ctx.fillText(txt,x,y);}

function drawHexGrid(){
  const size=45;const w=size*1.5;const h=Math.sqrt(3)*size;
  ctx.strokeStyle='#E2E8F0';ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=W+w;x+=w){for(let y=0;y<=H+h;y+=h){
    const offsetX=(Math.round(x/w)%2!==0)?h/2:0;
    ctx.moveTo(x+size,y+offsetX);
    for(let i=1;i<=6;i++){const angle=i*Math.PI/3;ctx.lineTo(x+size*Math.cos(angle),y+offsetX+size*Math.sin(angle));}
  }}ctx.stroke();
}

function drawFlower(p){
  const {x,y,r,c,l,oa,tx,ty}=p;
  const petalCount=Math.min(8,3+Math.floor(l/2));
  const petalColor=RAR_COLORS[rarIdx(l)];
  ctx.save();ctx.translate(x,y);
  ctx.rotate(oa*0.5);
  for(let i=0;i<petalCount;i++){
    ctx.save();ctx.rotate(i*(Math.PI*2/petalCount));ctx.translate(0,-r*0.9);
    ctx.fillStyle=petalColor;ctx.strokeStyle='rgba(0,0,0,0.05)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,r*0.45,r*0.8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  const angle=Math.atan2(ty-y,tx-x);
  const eyeDist=r*0.35,eyeR=r*0.28,pupilR=r*0.15;
  const ex1=Math.cos(angle-0.5)*eyeDist,ey1=Math.sin(angle-0.5)*eyeDist;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex1,ey1,eyeR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0F172A';ctx.beginPath();ctx.arc(ex1+Math.cos(angle)*pupilR*0.5,ey1+Math.sin(angle)*pupilR*0.5,pupilR,0,Math.PI*2);ctx.fill();
  const ex2=Math.cos(angle+0.5)*eyeDist,ey2=Math.sin(angle+0.5)*eyeDist;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex2,ey2,eyeR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0F172A';ctx.beginPath();ctx.arc(ex2+Math.cos(angle)*pupilR*0.5,ey2+Math.sin(angle)*pupilR*0.5,pupilR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,r*0.4,r*0.15,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawMob(o,inf){
  const {x,y,r}=o;
  ctx.save();ctx.translate(x,y);
  if(inf.k==='bomb'){ 
    ctx.fillStyle='#EF4444';ctx.strokeStyle='#B91C1C';ctx.lineWidth=3;ctx.beginPath();
    const spikes=12;for(let i=0;i<spikes*2;i++){const angle=i*Math.PI/spikes;const rad=i%2===0?r*1.3:r*0.7;ctx.lineTo(Math.cos(angle)*rad,Math.sin(angle)*rad);}
    ctx.closePath();ctx.fill();ctx.stroke();
  } 
  else if(inf.k==='v2c'){ 
    ctx.fillStyle='#92400E';ctx.strokeStyle='#78350F';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-r*0.8,0,r*0.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*0.6,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(r*0.9,0,r*0.8,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*0.4,r*0.5);ctx.lineTo(-r*0.6,r*1.2);ctx.moveTo(0,r*0.6);ctx.lineTo(0,r*1.3);ctx.moveTo(r*0.5,r*0.7);ctx.lineTo(r*0.7,r*1.4);ctx.stroke();
  }
  else if(inf.k==='c2v'){ 
    ctx.fillStyle='#FBBF24';ctx.strokeStyle='#B45309';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,r*1.2,r*0.8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1F2937';ctx.fillRect(-r*0.3,-r*0.8,r*0.2,r*1.6);ctx.fillRect(r*0.2,-r*0.8,r*0.2,r*1.6);
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.ellipse(-r*0.2,-r*0.9,r*0.5,r*0.3,-0.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(r*0.2,-r*0.9,r*0.5,r*0.3,0.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*0.8,-r*0.2,r*0.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(r*0.85,-r*0.2,r*0.1,0,Math.PI*2);ctx.fill();
  }
  else if(inf.k==='cloze'){ 
    ctx.fillStyle='#374151';ctx.strokeStyle='#111827';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*r*1.8,Math.sin(a)*r*1.8);}ctx.stroke();
    ctx.fillStyle='#EF4444';ctx.beginPath();ctx.arc(-r*0.3,-r*0.3,r*0.15,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(r*0.3,-r*0.3,r*0.15,0,Math.PI*2);ctx.fill();
  }
  if(inf.g){ 
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(251,191,36,0.4)';ctx.beginPath();ctx.arc(0,0,r*1.5,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#F59E0B';ctx.beginPath();ctx.moveTo(-r*0.5,-r*1.2);ctx.lineTo(-r*0.3,-r*0.8);ctx.lineTo(0,-r*1.4);ctx.lineTo(r*0.3,-r*0.8);ctx.lineTo(r*0.5,-r*1.2);ctx.lineTo(r*0.4,-r*0.6);ctx.lineTo(-r*0.4,-r*0.6);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function render(dt){
  view.p.forEach(v=>{v.x+=(v.txp-v.x)*Math.min(1,dt*11);v.y+=(v.typ-v.y)*Math.min(1,dt*11);});
  view.o.forEach(v=>{v.x+=(v.txp-v.x)*Math.min(1,dt*9);v.y+=(v.typ-v.y)*Math.min(1,dt*9);});
  const me=view.p.get(myPid);
  if(me){cam.x+=(me.x-cam.x)*Math.min(1,dt*6);cam.y+=(me.y-cam.y)*Math.min(1,dt*6);const tz=Math.max(.72,Math.min(1.08,36/me.r));cam.z+=(tz-cam.z)*dt*3;}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#F8FAFC';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(cam.z,0,0,cam.z,cv.width/2-cam.x*cam.z,cv.height/2-cam.y*cam.z);
  drawHexGrid();
  ctx.strokeStyle='#EF4444';ctx.lineWidth=12;ctx.strokeRect(0,0,W,H);
  for(const[id,o]of view.o){
    const inf=orbInfo.get(id)||{k:'v2c',tx:'',g:false};
    drawMob(o,inf);
    if(inf.tx)label(inf.tx.length>9?inf.tx.slice(0,9)+'…':inf.tx,o.x,o.y+o.r+20,Math.max(13,o.r*.75));
  }
  for(const[id,p]of view.p){
    if(p.d)continue;
    ctx.save();ctx.globalAlpha=(p.inv>0&&!p.q)?.55:1;
    drawFlower(p);
    ctx.restore();
    if(p.q){ctx.strokeStyle='rgba(59,130,246,.8)';ctx.lineWidth=4;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(p.x,p.y,p.r+26,Date.now()/300,Date.now()/300+Math.PI*1.5);ctx.stroke();ctx.setLineDash([]);label('💭 答题中…',p.x,p.y-p.r-36,14);}
    if(p.h<p.mh){const bw=p.r*2.6,pct=Math.max(0,p.h/p.mh);ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(p.x-bw/2,p.y+p.r+12,bw,8);ctx.fillStyle=pct>.35?'#10B981':'#EF4444';ctx.fillRect(p.x-bw/2,p.y+p.r+12,bw*pct,8);}
    label(p.n,p.x,p.y-p.r-16,15);
  }
  for(let i=FX.length-1;i>=0;i--){
    const f=FX[i];f.t+=dt;
    if(f.k==='pop'||f.k==='miss'||f.k==='lvl'){
      const col=f.k==='pop'?'#FBBF24':f.k==='lvl'?'#8B5CF6':'#94A3B8';
      ctx.strokeStyle=col;ctx.globalAlpha=Math.max(0,1-f.t*1.4);ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,10+f.t*95,0,7);ctx.stroke();ctx.globalAlpha=1;
      if(f.v)label(f.v,f.x,f.y-f.t*46,18);
      if(f.k==='lvl')label('LEVEL UP!',f.x,f.y-f.t*46-24,22);
      if(f.t>1.1)FX.splice(i,1);
    }else if(f.k==='boom'||f.k==='hit'){
      ctx.globalAlpha=Math.max(0,1-f.t*2);
      for(let j=0;j<8;j++){const a=j*Math.PI/4,d=f.t*130;ctx.fillStyle=f.k==='boom'?'#EF4444':'#F59E0B';ctx.beginPath();ctx.arc(f.x+Math.cos(a)*d,f.y+Math.sin(a)*d,6-f.t*4,0,7);ctx.fill();}
      ctx.globalAlpha=1;if(f.t>.6)FX.splice(i,1);
    }
  }
}
function addFx(k,x,y,v){FX.push({k,x,y,v,t:0});}
function fx(k,x,y,v){addFx(k,x,y,v);broadcast({t:'fx',k,x,y,v});}

/* ============ 8. 答题卡 (★已修复语法错误) ============ */
let quizState=null;
const $=id=>document.getElementById(id);
function openQuiz(oid,q){quizState={oid,q,done:false,end:Date.now()+15000};const kind=q.t==='v2c'?'看词选义':q.t==='c2v'?'看义选词':'句子填空';$('qKind').textContent=kind+' · 答对进化,答错掉血';$('qPrompt').innerHTML=q.t==='cloze'?q.q.replace('_','<span class="blank">____</span>'):q.q;$('qOpts').innerHTML='';$('qFb').classList.add('hide');$('qOpts').classList.remove('hide');q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="key">${i+1}</span><span>${o}</span>`;b.onclick=()=>choose(i);$('qOpts').appendChild(b);});$('qFill').style.width='100%';$('quizWrap').classList.remove('hide');}

function choose(i){
  const qs=quizState;if(!qs||qs.done)return;qs.done=true;
  const ok=(i===qs.q.ans),wasDue=isDue(qs.q.w);
  srReview(qs.q.w,ok);
  if(ok){stats.today++;saveStats();}
  if(isHost)resolveAnswer(qs.oid,i,ok&&wasDue);
  else s2h({t:'ans',oid:qs.oid,i,due:ok&&wasDue});
  
  const btns=$('qOpts').children;
  btns[qs.q.ans].classList.add('ok');
  if(!ok&&i>=0)btns[i].classList.add('no');
  const s=qs.q.s?qs.q.s.replace('_',`<b>${qs.q.w}</b>`):'';
  
  // ★★★ 修复点：补全了 wasDue 三元表达式的 `:''` ★★★
  $('qFb').innerHTML=`
    <div class="fbt ${ok?'good':'bad'}">
      ${ok ? '✓ 正确!' + (wasDue ? ' ⭐ 复习命中 双倍经验!' : '') : '✗ 正确答案: ' + qs.q.opts[qs.q.ans]}
    </div>
    <div class="fbw">${qs.q.w} <span class="fbp">${qs.q.p||''}</span>
      <button class="spk" onclick="speak('${qs.q.w}')">🔊</button>
    </div>
    <div class="fbm">${qs.q.m}</div>
    ${s ? `<div class="fbs">${s}</div>` : ''}
  `;
  
  $('qOpts').classList.add('hide');$('qFb').classList.remove('hide');
  speak(qs.q.w);
  setTimeout(closeQuiz,ok?2000:3600);
}

function quizTimeout(oid,q){if(!quizState||quizState.oid!==oid||quizState.done)return;quizState.done=true;srReview(q.w,false);const s=q.s?q.s.replace('_',`<b>${q.w}</b>`):'';$('qFb').innerHTML=`<div class="fbt bad">⏰ 超时!正确答案:${q.opts[q.ans]}</div><div class="fbw">${q.w} <span class="fbp">${q.p||''}</span></div><div class="fbm">${q.m}</div>${s?`<div class="fbs">${s}</div>`:''}`;$('qOpts').classList.add('hide');$('qFb').classList.remove('hide');setTimeout(closeQuiz,3200);}
function closeQuiz(){$('quizWrap').classList.add('hide');quizState=null;}
addEventListener('keydown',e=>{if(quizState&&!quizState.done){const n=+e.key;if(n>=1&&n<=4)choose(n-1);}});

/* ============ 9. HUD ============ */
function toast(msg,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('toasts').appendChild(d);setTimeout(()=>d.remove(),ms);}
function updHUD(){const me=view.p.get(myPid);if(!me)return;$('meName').textContent=me.n;const l=lvlOf(me.xp),lo=xpFor(l),hi=xpFor(l+1);$('xpfill').style.width=Math.min(100,(me.xp-lo)/(hi-lo)*100)+'%';$('meInfo').textContent=`Lv.${l} ${RAR_NAMES[rarIdx(l)]}花瓣 · 🔥连击${me.k||0} · 今日${stats.today}词`;$('srChip').textContent=`📌 待复习 ${dueWords().length} · 🆕 新词 ${newWords().length}`;$('roomChip').textContent=`房间 ${roomCode} · ${LEVELS[roomLevel].name} · ${view.p.size}人`;const rows=[...view.p.values()].sort((a,b)=>b.xp-a.xp).slice(0,8);$('lbRows').innerHTML=rows.map(p=>`<div class="lbr ${p.i===myPid?'self':''}"><span class="dot" style="background:${p.c}"></span><span>${p.n}</span><span class="xp">Lv.${p.l} · ${p.xp}</span></div>`).join('');}

/* ============ 10. 网络 ============ */
let peer=null,conn=null;const connMap={};let pidSeq=0;
const broadcast=m=>{for(const pid in connMap)try{connMap[pid].send(m);}catch(e){}};
const s2h=m=>{if(conn&&conn.open)try{conn.send(m);}catch(e){}};
function ensurePeer(ms=8000){return new Promise(res=>{if(window.Peer)return res(true);if(window.__peerFailed)return res(false);const t0=Date.now();const iv=setInterval(()=>{if(window.Peer){clearInterval(iv);res(true);}else if(window.__peerFailed||Date.now()-t0>ms){clearInterval(iv);res(false);}},100);});}
function sendTo(pid,m){if(pid===0){localMsg(m);return;}if(pid<0){if(m.t==='quiz')setTimeout(()=>{const pd=pending[m.oid];if(!pd)return;const ok=Math.random()<.55;resolveAnswer(m.oid,ok?pd.ans:(pd.ans+1+((Math.random()*3)|0))%4,false);},1200+Math.random()*2000);return;}const c=connMap[pid];if(c)try{c.send(m);}catch(e){}}
function localMsg(m){if(m.t==='quiz')openQuiz(m.oid,m.q);else if(m.t==='res'&&m.to&&quizState&&quizState.oid===m.oid)quizTimeout(m.oid,quizState.q);}
function clientMsg(m){if(m.t==='init'){myPid=m.pid;roomLevel=m.lv;enterGame();}else if(m.t==='st')applySnap(m);else if(m.t==='oa')orbInfo.set(m.o.i,m.o);else if(m.t==='quiz')openQuiz(m.oid,m.q);else if(m.t==='res'&&m.to&&quizState&&quizState.oid===m.oid)quizTimeout(m.oid,quizState.q);else if(m.t==='fx')addFx(m.k,m.x,m.y,m.v);}
function hostRecv(c,d){if(d.t==='join'){const pid=++pidSeq;connMap[pid]=c;c.pid=pid;spawnPlayer(pid,(d.n||'词友').slice(0,10));c.send({t:'init',pid,lv:roomLevel});for(const[,info]of orbInfo)c.send({t:'oa',o:info});toast(`👋 ${players.get(pid).name} 加入了房间`);}else if(d.t==='in'){const p=players.get(c.pid);if(p&&!p.quiz){p.tx=d.x;p.ty=d.y;}}else if(d.t==='ans')resolveAnswer(d.oid,d.i,!!d.due);}
async function createRoom(){toast('正在准备联机组件…');const ok=await ensurePeer();if(!ok){toast('PeerJS加载失败:检查网络后刷新,或先玩单人模式',4000);return;}isHost=true;solo=false;roomCode=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');peer=new Peer('wordrio-'+roomCode);peer.on('open',()=>{startHost();toast(`房间已创建!代码 ${roomCode},快分享给同学`);});peer.on('connection',c=>{c.on('data',d=>hostRecv(c,d));c.on('close',()=>{if(c.pid){players.delete(c.pid);delete connMap[c.pid];toast('一位同学离开了');}});});peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});peer.on('error',e=>toast('联机错误:'+e.type));}
function startSolo(){isHost=true;solo=true;roomCode='SOLO';startHost();}
function startHost(){enterGame();myPid=0;spawnPlayer(0,myName);if(solo){spawnPlayer(-1,'小明🤖',true);spawnPlayer(-2,'小红🤖',true);spawnPlayer(-3,'Alex🤖',true);}for(let i=0;i<ORB_N;i++)spawnOrb();for(let i=0;i<BOMB_N;i++)spawnBomb();if(!solo)setInterval(()=>broadcast(buildSnap()),85);}
async function joinRoom(code){toast('正在连接房间…');const ok=await ensurePeer();if(!ok){toast('PeerJS加载失败:检查网络后刷新',4000);return;}roomCode=code.toUpperCase();peer=new Peer();peer.on('open',()=>{conn=peer.connect('wordrio-'+roomCode,{reliable:true});conn.on('open',()=>conn.send({t:'join',n:myName}));conn.on('data',clientMsg);conn.on('close',()=>{toast('与房间断开连接');setTimeout(()=>location.reload(),1500);});});peer.on('error',e=>{if(e.type==='peer-unavailable')toast('找不到房间,请检查房间码');});}
function enterGame(){inGame=true;$('menu').classList.add('hide');$('hud').classList.remove('hide');cam={x:W/2,y:H/2,z:1};}

/* ============ 11. 输入 & 循环 ============ */
let myName=(localStorage.getItem('wr_name')||'');
function setTarget(mx,my){if(!inGame)return;const wx=cam.x+(mx-cv.width/2)/cam.z,wy=cam.y+(my-cv.height/2)/cam.z;if(isHost){const p=players.get(myPid);if(p){p.tx=wx;p.ty=wy;}}else s2h({t:'in',x:wx,y:wy});}
let lastIn=0;
cv.addEventListener('pointermove',e=>{const n=performance.now();if(n-lastIn>50){lastIn=n;setTarget(e.clientX,e.clientY);}});
cv.addEventListener('pointerdown',e=>setTarget(e.clientX,e.clientY));
let last=performance.now(),loopBroken=false;
function loop(t){if(loopBroken)return;try{const dt=Math.min(.05,(t-last)/1000);last=t;if(inGame){if(isHost){tick(dt);applySnap(buildSnap());}if(quizState&&!quizState.done){const rem=Math.max(0,quizState.end-Date.now());$('qFill').style.width=(rem/150)+'%';if(rem<=0)choose(-1);}render(dt);if(++frame%12===0)updHUD();}}catch(e){loopBroken=true;console.error('[词域] 主循环出错:',e);toast('发生错误,请打开F12控制台查看');}requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ============ 12. 菜单 ============ */
$('name').value=myName||('花友'+(1000+Math.random()*9000|0));
$('name').onchange=e=>{myName=e.target.value.trim().slice(0,10);try{localStorage.setItem('wr_name',myName);}catch(e){}};
myName=$('name').value;
function updDue(){$('dueInfo').textContent=`📌 待复习 ${dueWords().length} 词 · 🆕 未学新词 ${newWords().length} 个 · 🔥 连续打卡 ${stats.streak} 天`;}
updDue();
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lv').forEach(x=>x.classList.remove('on'));b.classList.add('on');roomLevel=b.dataset.lv;updDue();});
$('bSolo').onclick=()=>{try{myName=$('name').value.trim()||'花友';startSolo();}catch(e){console.error(e);toast('启动失败:'+e.message);}};
$('bCreate').onclick=()=>{try{myName=$('name').value.trim()||'花友';createRoom();}catch(e){console.error(e);toast('启动失败:'+e.message);}};
$('bJoin').onclick=()=>{try{const c=$('joinCode').value.trim();if(c.length!==4){toast('请输入4位房间码');return;}myName=$('name').value.trim()||'花友';joinRoom(c);}catch(e){console.error(e);toast('启动失败:'+e.message);}};
$('bootStat').textContent='✅ 引擎就绪 · 可以开始';$('bootStat').style.color='#10B981';
</script>
</body>
</html>
