<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>学堂杀 · 九科争鸣</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--gold:#f5c542;--gold-dim:#8a6d3b;--parch:#f7f0dd;--parch2:#e8dcc0;--ink:#2a1f0f;--red:#c0392b;--green:#27ae60;--text:#e8e0d0;--muted:#a89880}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 0%,#4a2218,#2a1210 45%,#120604);background-attachment:fixed;color:var(--text);font-family:"PingFang SC","Microsoft YaHei",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);pointer-events:none;z-index:0}
h1{font-size:22px;color:var(--gold);letter-spacing:8px;text-shadow:0 0 18px rgba(245,197,66,.5),0 2px 0 #000;margin-bottom:2px;position:relative;z-index:1}
.subtitle{font-size:10px;color:var(--gold-dim);letter-spacing:3px;margin-bottom:8px;position:relative;z-index:1}
.screen{display:none;width:100%;max-width:1180px;position:relative;z-index:1}
.screen.active{display:block}
.sound-toggle{position:fixed;top:8px;right:8px;z-index:50;background:linear-gradient(160deg,#2a1a10,#160a06);border:2px solid var(--gold-dim);color:var(--gold);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sound-toggle.muted{opacity:.5;color:var(--muted)}
.panel{background:linear-gradient(160deg,#2a1610,#1a0c08);border:1px solid var(--gold-dim);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.panel h3{font-size:13px;color:var(--gold);margin-bottom:8px;letter-spacing:2px}
.opt-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.opt-btn{flex:1;min-width:60px;background:linear-gradient(160deg,#2a1a10,#160a06);border:2px solid var(--gold-dim);color:var(--muted);padding:8px 4px;border-radius:7px;cursor:pointer;font-size:12px;transition:all .2s;font-family:inherit;text-align:center}
.opt-btn:hover{border-color:var(--gold);color:var(--gold)}
.opt-btn.active{background:linear-gradient(160deg,#5a3a10,#3a1a06);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.4)}
.opt-btn small{display:block;font-size:9px;margin-top:2px;opacity:.7}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.role-card{background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:2px solid #444;border-radius:8px;padding:7px 4px;cursor:pointer;transition:all .2s;text-align:center}
.role-card:hover{transform:translateY(-2px)}
.role-card.selected{box-shadow:0 0 16px currentColor}
.role-card .r-icon{font-size:22px;margin-bottom:1px}
.role-card .r-name{font-size:12px;font-weight:700;letter-spacing:1px}
.faction-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-bottom:8px}
.faction-card{background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:2px solid #444;border-radius:8px;padding:7px 4px;cursor:pointer;transition:all .2s;text-align:center}
.faction-card.selected{box-shadow:0 0 16px currentColor}
.faction-card .f-icon{font-size:22px;margin-bottom:1px}
.faction-card .f-name{font-size:13px;font-weight:700;letter-spacing:1px}
.faction-card .f-desc{font-size:8.5px;opacity:.7;line-height:1.2;margin-top:1px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;max-height:340px;overflow-y:auto;padding-right:4px}
.char-card{background:linear-gradient(160deg,#2a1a10,#120804);border:2px solid var(--gold-dim);border-radius:8px;padding:6px;cursor:pointer;transition:all .2s;position:relative}
.char-card .faction-badge{position:absolute;top:4px;right:4px;font-size:11px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid currentColor}
.char-card .ctop{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.char-card .cavatar{font-size:22px}
.char-card .cname{font-size:12px;font-weight:600}
.char-card .ctitle{font-size:9px;color:var(--muted)}
.char-card .csubject{font-size:9px;margin-bottom:3px}
.char-card .cskill{font-size:8px;color:#a89880;line-height:1.4;border-top:1px solid #3a2a1a;padding-top:3px}
.char-card .cskill b{color:var(--gold);font-size:9px}
.input-row{display:flex;gap:6px;margin-bottom:6px}
.input-row input{flex:1;background:#0a0402;border:1px solid var(--gold-dim);color:var(--text);border-radius:5px;padding:7px 10px;font-size:12px;font-family:inherit;min-width:0}
.lobby-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn-lg{font-size:14px;padding:10px 24px}
.btn{background:linear-gradient(160deg,#2a1a10,#160a06);color:#d8c8a8;border:1px solid var(--gold-dim);border-radius:5px;padding:6px 11px;font-size:11.5px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-accent{background:linear-gradient(160deg,#8a2018,#5a1008);border-color:#e74c3c;color:#ffe0d0}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-skill{background:linear-gradient(160deg,#3a2a50,#1a0a30);border-color:#9b59b6;color:#d8c8ff}
.btn-lord{background:linear-gradient(160deg,#5a3a10,#3a1a06);border-color:#f5c542;color:#f5e0a0}
.btn-rules{background:linear-gradient(160deg,#1a3a50,#0a1a30);border-color:#2980b9;color:#8fd0ff}
.room-member-list{background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;line-height:1.8}
.room-member-list .rm-item{display:flex;align-items:center;gap:6px;padding:2px 0}
.room-member-list .rm-item .rm-avatar{font-size:14px}
.room-member-list .rm-item .rm-name{flex:1;color:#e0d4bc}
.room-member-list .rm-item.host .rm-name{color:var(--gold);font-weight:600}
.room-member-list .rm-item .rm-tag{font-size:9px;background:rgba(245,197,66,.15);border:1px solid rgba(245,197,66,.4);color:var(--gold);border-radius:3px;padding:0 4px}
.room-member-list .rm-item .rm-tag.guest{background:rgba(68,170,255,.1);border-color:rgba(68,170,255,.4);color:#8fd0ff}

/* 游戏主界面 */
#screenGame{max-width:1180px}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#2a1610,#160a06);border:1px solid var(--gold-dim);border-radius:7px;padding:5px 10px;font-size:11px;margin-bottom:6px;position:relative;z-index:2;flex-wrap:wrap;gap:6px}
.top-bar .turn-name{color:var(--gold);font-weight:600}
.self-role-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-weight:700;font-size:12px;border:2px solid;background:rgba(0,0,0,.4);letter-spacing:1px}
.self-role-badge.lord{border-color:#f5c542;color:#f5c542;box-shadow:0 0 10px rgba(245,197,66,.4)}
.self-role-badge.loyal{border-color:#27ae60;color:#27ae60}
.self-role-badge.rebel{border-color:#e74c3c;color:#e74c3c}
.self-role-badge.spy{border-color:#9b59b6;color:#9b59b6}

.game-main{display:flex;gap:8px;margin-bottom:6px;position:relative;z-index:2}
.table-area{flex:1;position:relative;height:540px;background:radial-gradient(ellipse at 50% 50%,rgba(60,90,45,.55),rgba(15,25,12,.85) 70%),repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.15) 0 2px,transparent 2px 6px),linear-gradient(160deg,#2a3a1c,#0f1a0c);border:2px solid #4a5a30;border-radius:50% / 34%;box-shadow:inset 0 0 50px rgba(0,0,0,.75),0 4px 20px rgba(0,0,0,.6);overflow:hidden}
.table-area::before{content:'';position:absolute;inset:8px;border:1px solid rgba(245,197,66,.12);border-radius:50% / 34%;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);transition:left .4s,top .4s;z-index:3}
.seat-targetable{cursor:pointer;z-index:5}
.seat-targetable .p-card{border-color:#e74c3c !important;animation:targetPulse 1.2s infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 10px rgba(231,76,60,.5)}50%{box-shadow:0 0 25px rgba(231,76,60,.9)}}
.p-card{width:118px;border-radius:9px;padding:5px;position:relative;transition:all .25s;border:2px solid var(--faction-color,#8a6d3b);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%),linear-gradient(160deg,#2a1a10,#0e0603);box-shadow:inset 0 0 20px rgba(0,0,0,.6),0 3px 12px rgba(0,0,0,.5)}
.p-card.turn{border-width:3px;box-shadow:0 0 24px var(--faction-color),0 0 46px var(--faction-color),inset 0 0 20px rgba(0,0,0,.6);transform:scale(1.06)}
.p-card.dead{opacity:.28;filter:grayscale(1)}
.p-card.is-self::before{content:'你';position:absolute;top:-8px;right:-6px;background:var(--gold);color:#1a0c08;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;z-index:5}
.p-card .faction-icon{position:absolute;top:-10px;left:-8px;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;border-radius:50%;background:#0a0402;border:2px solid var(--faction-color);z-index:6}
.p-card .p-mark-btn{position:absolute;top:-10px;right:-6px;width:22px;height:22px;background:rgba(0,0,0,.75);border:1.5px solid var(--gold-dim);color:var(--gold);border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:7;font-family:inherit;padding:0;line-height:1}
.p-card .p-mark-btn:hover{background:#1a0a08;border-color:var(--gold);box-shadow:0 0 8px rgba(245,197,66,.6)}
.p-card .p-mark-label{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:#0a0402;border:1.5px solid currentColor;white-space:nowrap;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none}
.p-card .p-mark-label::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.p-card .pheader{display:flex;align-items:center;gap:4px;margin-bottom:3px;margin-left:4px}
.p-card .pavatar{font-size:17px;width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--faction-color),transparent 70%);border-radius:50%;border:1px solid var(--faction-color)}
.p-card .pname-block{flex:1;min-width:0}
.p-card .pname{font-size:10.5px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-card .prole{font-size:8px;font-weight:600;margin-top:1px}
.p-card .pknow{font-size:8px;color:var(--gold);position:absolute;top:4px;right:4px;background:rgba(245,197,66,.15);border:1px solid rgba(245,197,66,.4);border-radius:3px;padding:0 3px}
.p-card .php-bar{display:flex;justify-content:center;gap:2px;padding:2px 0 3px;background:rgba(0,0,0,.4);border-radius:4px;margin-bottom:3px;flex-wrap:wrap}
.hp-gem{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#ff6a5a,#c0392b 50%,#8a1a10);border:1px solid #ff9a88;box-shadow:0 0 5px rgba(255,90,74,.6),inset 0 1px 1px rgba(255,255,255,.5);transition:all .3s}
.hp-gem.empty{background:linear-gradient(135deg,#1a0a08,#0a0402);border-color:#3a1a14;box-shadow:inset 0 1px 2px rgba(0,0,0,.9);opacity:.7}
.hp-gem.low{animation:hpPulse 1s infinite}
@keyframes hpPulse{0%,100%{box-shadow:0 0 5px rgba(255,90,74,.6)}50%{box-shadow:0 0 14px rgba(255,150,90,.95)}}
.p-card .pequip-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:2px}
.equip-slot{aspect-ratio:1;border-radius:3px;background:rgba(0,0,0,.45);border:1px dashed #3a2a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:0}
.equip-slot.filled{border-style:solid;border-color:var(--gold-dim);background:linear-gradient(160deg,#4a2a10,#1a0e04);box-shadow:0 0 4px rgba(245,197,66,.35)}
.equip-slot .eq-icon{font-size:9px;line-height:1;opacity:.3}
.equip-slot.filled .eq-icon{opacity:1}
.equip-slot .eq-short{font-size:7px;line-height:1;color:var(--gold);font-weight:700;margin-top:1px}
.p-card .pequip-names{font-size:8px;color:#c8b088;text-align:center;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:10px;line-height:1.25}
.p-card .pequip-names:empty{display:none}
.p-card .pfooter{display:flex;justify-content:space-between;align-items:center;padding-top:2px;border-top:1px solid rgba(138,109,59,.3)}
.hand-pile{position:relative;height:16px;width:26px}
.hand-pile .mini-card{position:absolute;top:0;left:0;width:11px;height:16px;border-radius:2px;background:radial-gradient(circle at 50% 50%,rgba(245,197,66,.3) 0 25%,transparent 30%),linear-gradient(135deg,#2a1810,#4a2a18 50%,#2a1810);border:1px solid var(--gold-dim)}
.hand-pile .mini-card:nth-child(2){left:4px}
.hand-pile .mini-card:nth-child(3){left:8px}
.hand-pile .mini-card:nth-child(4){left:12px}
.hand-pile .hand-count{position:absolute;right:-3px;bottom:-2px;background:var(--gold);color:#1a0c08;font-size:8px;font-weight:700;min-width:12px;height:12px;line-height:12px;text-align:center;border-radius:6px;padding:0 2px}
.p-card .pjudge-row{display:flex;gap:1px;margin-top:2px;flex-wrap:wrap}
.judge-tag{font-size:7px;background:rgba(155,89,182,.25);border:1px solid #9b59b6;color:#d8b8ff;padding:0 3px;border-radius:2px}
.p-badges{display:flex;gap:2px;justify-content:center;margin-bottom:2px;flex-wrap:wrap;min-height:12px}
.badge{font-size:8px;padding:0 4px;border-radius:3px;font-weight:700;line-height:12px;height:12px}
.badge-shield{color:#4af;background:rgba(68,170,255,.15);border:1px solid rgba(68,170,255,.55)}
.badge-combo{color:var(--gold);background:rgba(245,197,66,.18);border:1px solid rgba(245,197,66,.55)}
.badge-master{color:#b57fff;background:rgba(181,127,255,.18);border:1px solid rgba(181,127,255,.55)}
.table-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;height:140px;display:flex;align-items:center;justify-content:space-around;z-index:1;border-radius:50%}
.pile{display:flex;flex-direction:column;align-items:center;gap:2px}
.pile-label{font-size:8.5px;color:var(--gold-dim);letter-spacing:1px}
.pile-stack{position:relative;width:36px;height:50px}
.pile-stack .card-back-pile{position:absolute;left:0;top:0;width:32px;height:46px;border-radius:4px;background:radial-gradient(circle at 50% 50%,rgba(245,197,66,.25) 0 30%,transparent 32%),linear-gradient(135deg,#2a1810,#4a2a18 50%,#2a1810);border:1.5px solid var(--gold-dim)}
.pile-stack .card-back-pile::after{content:'学';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(245,197,66,.5);font-size:11px;font-family:"STKaiti","KaiTi",serif}
.pile-stack .card-back-pile:nth-child(2){left:2px;top:2px}
.pile-stack .card-back-pile:nth-child(3){left:4px;top:4px}
.pile-count{font-size:10.5px;color:var(--gold);font-weight:600}
.play-zone{flex:1;height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:4px;position:relative}
.play-zone-label{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:2px;color:var(--gold-dim);background:rgba(15,26,12,.8);padding:0 6px;border-radius:3px}
.play-zone-empty{font-size:9px;color:#5a5a40;letter-spacing:1px;font-style:italic}
.play-card{width:38px;height:54px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold-dim);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600;font-size:10px;position:relative;animation:playCardIn .4s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 10px rgba(245,197,66,.5),0 2px 6px rgba(0,0,0,.7);flex-shrink:0}
.play-card .pcsuit{position:absolute;top:1px;left:2px;font-size:7px}
.play-card .pcnum{position:absolute;top:1px;right:2px;font-size:6px;color:#7a6a50}
.play-card .pcname{font-family:"STKaiti","KaiTi",serif;color:#8a1a10;font-size:10px;text-align:center;line-height:1.1}
.play-card .pcowner{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:5.5px;color:#7a6a50;background:rgba(255,255,255,.35);border-radius:0 0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-card.red .pcsuit{color:#c0392b}
@keyframes playCardIn{from{opacity:0;transform:translateY(30px) scale(.4) rotate(-20deg)}60%{opacity:1;transform:translateY(-3px) scale(1.08)}to{opacity:1;transform:none}}
.play-card.fade-out{animation:playCardOut .4s ease-in forwards}
@keyframes playCardOut{to{opacity:0;transform:translateY(-20px) scale(.5) rotate(10deg)}}
.side-panel{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;height:540px}
.play-log-panel,.chat-panel{background:linear-gradient(160deg,#2a1610,#160a06);border:1px solid var(--gold-dim);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.play-log-panel{flex:1;min-height:0}
.chat-panel{flex:1.15;min-height:0}
.panel-title{font-size:10.5px;color:var(--gold);padding:5px 10px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(138,109,59,.4);letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title .badge{font-size:9px;color:var(--muted);letter-spacing:0}
.panel-toggle{background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:0 6px;font-family:inherit;min-width:24px;height:20px;line-height:20px}
.play-log-list{flex:1;overflow-y:auto;padding:5px 7px;font-size:10px;line-height:1.55}
.play-log-item{margin-bottom:3px;padding:2px 5px;background:rgba(0,0,0,.3);border-left:2px solid var(--gold-dim);border-radius:0 4px 4px 0;animation:logIn .35s ease-out;color:#c8b8a0}
@keyframes logIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.play-log-item .pl-from{font-weight:600;color:#e8a0a0}
.play-log-item .pl-card{color:var(--gold);font-weight:600}
.play-log-item .pl-to{color:#a0c8e8;font-weight:600}
.play-log-item.dmg{border-left-color:#e74c3c}
.play-log-item.heal{border-left-color:#27ae60}
.play-log-item.skill{border-left-color:#9b59b6}
.play-log-item.reward{border-left-color:#f5c542;background:rgba(245,197,66,.12)}
.play-log-item.hl{border-left-color:var(--gold);color:var(--gold);font-weight:600}
.play-log-item.faction{border-left-color:#4af;background:rgba(68,170,255,.1);color:#a0d8ff}
.play-log-item.kp{border-left-color:#4af;background:rgba(68,170,255,.08);color:#a0d8ff;font-size:9.5px}
.play-log-item.sys{border-left-color:var(--gold);background:rgba(245,197,66,.08);color:var(--gold);font-size:9.5px}
.chat-body{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-list{flex:1;overflow-y:auto;padding:5px 7px;font-size:10.5px;line-height:1.5}
.chat-msg{margin-bottom:4px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.3);max-width:92%;animation:chatIn .3s ease-out;word-break:break-word}
@keyframes chatIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-msg.self{margin-left:auto;background:linear-gradient(160deg,rgba(41,128,185,.35),rgba(41,128,185,.15));border:1px solid rgba(41,128,185,.4);text-align:right}
.chat-msg.ai{margin-right:auto;border:1px solid rgba(138,109,59,.35)}
.chat-msg.sys{margin-left:auto;margin-right:auto;text-align:center;background:rgba(245,197,66,.1);border:1px dashed var(--gold-dim);color:var(--gold)}
.chat-msg .chat-name{font-size:8.5px;font-weight:600;color:var(--gold);display:block;margin-bottom:1px}
.chat-msg.self .chat-name{color:#4af;text-align:right}
.chat-msg .chat-text{color:#e0d4bc}
.chat-input-row{display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.35);border-top:1px solid rgba(138,109,59,.4);flex-shrink:0}
.chat-input-row input{flex:1;background:#0a0402;border:1px solid var(--gold-dim);color:var(--text);border-radius:4px;padding:4px 8px;font-size:10.5px;font-family:inherit;min-width:0}
.chat-input-row button{background:linear-gradient(160deg,#3a2a10,#1a0e04);border:1px solid var(--gold-dim);color:var(--gold);border-radius:4px;padding:0 10px;font-size:10.5px;cursor:pointer;font-family:inherit;flex-shrink:0}
.center-area{background:rgba(0,0,0,.35);border:1px solid #3a2a1a;border-radius:7px;padding:5px 8px;margin-bottom:5px;min-height:50px;position:relative;z-index:2}
.action-hint{font-size:11px;color:var(--muted);margin-bottom:4px;min-height:14px;line-height:1.4}
.action-hint.hint-play{color:var(--gold);font-weight:600}
.action-hint.hint-target{color:#e74c3c;font-weight:600}
.action-hint.hint-urgent{color:#ff9a5a;font-weight:600;animation:hintPulse 1s infinite}
@keyframes hintPulse{0%,100%{opacity:1}50%{opacity:.65}}
.action-btns{display:flex;gap:4px;flex-wrap:wrap}
.hand-row{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;min-height:98px;align-items:flex-end;position:relative;z-index:2;justify-content:center}
.card{width:58px;height:84px;flex-shrink:0;border-radius:5px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 60%),linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold-dim);box-shadow:0 3px 9px rgba(0,0,0,.65);position:relative;cursor:default;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 10px 22px rgba(245,197,66,.55);border-color:var(--gold);z-index:3}
.card.clickable.card-discard-hint{border-color:#e74c3c;animation:cardDiscardPulse 1s infinite}
@keyframes cardDiscardPulse{0%,100%{box-shadow:0 3px 9px rgba(231,76,60,.4)}50%{box-shadow:0 0 18px rgba(231,76,60,.9),0 3px 9px rgba(0,0,0,.65)}}
.card.clickable.card-rescue-hint{border-color:#27ae60;animation:cardRescuePulse 1s infinite}
@keyframes cardRescuePulse{0%,100%{box-shadow:0 3px 9px rgba(39,174,96,.4)}50%{box-shadow:0 0 18px rgba(39,174,96,.9),0 3px 9px rgba(0,0,0,.65)}}
.card.clickable.card-shan-hint{border-color:#4af;animation:cardShanPulse 1s infinite}
@keyframes cardShanPulse{0%,100%{box-shadow:0 3px 9px rgba(68,170,255,.4)}50%{box-shadow:0 0 18px rgba(68,170,255,.9),0 3px 9px rgba(0,0,0,.65)}}
.card.disabled{opacity:.4;cursor:not-allowed}
.card .suit{position:absolute;top:2px;left:3px;font-size:10px;font-weight:700}
.card .num{position:absolute;top:2px;right:3px;font-size:8px;color:#7a6a50}
.card .cname{font-size:13px;font-family:"STKaiti","KaiTi",serif;color:#8a1a10;text-align:center;line-height:1.1;padding:0 2px}
.card .ctype{font-size:7px;color:#7a6a50;margin-top:1px}
.card.red .suit{color:#c0392b}
.card.black .suit{color:#1a1a1a}

/* 弹窗 */
#quizModal,#markModal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
#quizModal.show,#markModal.show{display:flex}
.quiz-box{width:100%;max-width:460px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--gold-dim);box-shadow:0 0 0 2px var(--gold),0 20px 60px rgba(0,0,0,.9);border-radius:10px;padding:16px;color:var(--ink);animation:cardIn .3s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.quiz-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.quiz-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:radial-gradient(circle,rgba(139,101,40,.25),transparent 70%);border:2px solid #8a6d3b}
.quiz-meta{flex:1}
.quiz-subject{font-size:11px;letter-spacing:2px;color:#8a6d3b;font-weight:700}
.quiz-progress{font-size:9px;color:#7a6a50;margin-top:1px}
.quiz-kp{display:inline-block;background:#8a6d3b;color:var(--parch);font-size:9.5px;padding:2px 8px;border-radius:3px;margin-bottom:8px;letter-spacing:1px}
.quiz-question{font-size:13.5px;line-height:1.7;margin-bottom:10px;font-weight:600;color:var(--ink)}
.quiz-option{display:block;width:100%;text-align:left;background:rgba(255,255,255,.45);border:1.5px solid rgba(139,101,40,.4);color:var(--ink);border-radius:5px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12.5px;transition:all .15s;font-family:inherit}
.quiz-option:hover{background:rgba(255,255,255,.75)}
.quiz-option.correct{background:rgba(46,204,113,.4);border-color:#27ae60;font-weight:700}
.quiz-option.wrong{background:rgba(231,76,60,.35);border-color:#c0392b}
.quiz-option .tag{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;border-radius:50%;background:#8a6d3b;color:var(--parch);font-size:10px;margin-right:6px;font-weight:700}
#quizFeedback{font-size:12px;margin-top:6px;min-height:18px;font-weight:700;text-align:center}

/* 标记弹窗 */
.mark-box{width:100%;max-width:320px;background:linear-gradient(160deg,#2a1610,#160a06);border:2px solid var(--gold-dim);border-radius:10px;padding:16px;color:var(--text);animation:cardIn .25s ease-out}
.mark-title{font-size:13px;color:var(--gold);text-align:center;margin-bottom:12px;letter-spacing:1px}
.mark-options{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.mark-btn{padding:10px 6px;background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:2px solid #444;border-radius:6px;color:var(--text);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.mark-btn:hover{transform:translateY(-1px)}
.mark-btn.lord{border-color:#f5c542;color:#f5c542}
.mark-btn.loyal{border-color:#27ae60;color:#27ae60}
.mark-btn.rebel{border-color:#e74c3c;color:#e74c3c}
.mark-btn.spy{border-color:#9b59b6;color:#9b59b6}
.mark-btn.clear{grid-column:span 2;border-color:#666;color:#a89880}

/* 规则弹窗 */
.rules-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}
.rules-modal.show{display:flex}
.rules-box{width:100%;max-width:640px;max-height:85vh;background:linear-gradient(160deg,#2a1610,#1a0c08);border:2px solid var(--gold-dim);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.rules-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(138,109,59,.4);color:var(--gold);font-size:14px;letter-spacing:2px}
.rules-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px}
.rules-tabs{display:flex;background:rgba(0,0,0,.3);border-bottom:1px solid rgba(138,109,59,.3);overflow-x:auto}
.rule-tab{flex:1;padding:8px 4px;background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;min-width:70px}
.rule-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(245,197,66,.08)}
.rules-content{flex:1;overflow-y:auto;padding:12px 16px;font-size:12px;line-height:1.7;color:#c8b8a0}
.rule-section{margin-bottom:14px}
.rule-section h4{color:var(--gold);font-size:13px;margin-bottom:6px}
.rule-section ul,.rule-section ol{padding-left:20px}
.rule-section li{margin-bottom:4px}
.rule-section b{color:#f5e0a0}
.bank-info{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:6px}
.bank-info b{color:var(--gold)}
.file-input{display:none}

/* 特效层 */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.p-card.attacking{animation:attackLunge .42s cubic-bezier(.3,1.4,.5,1)}
@keyframes attackLunge{0%,100%{transform:translateY(0) scale(1.06)}30%{transform:translateY(-12px) scale(1.13)}60%{transform:translateY(5px) scale(1.03)}}
.p-card.hit-shake{animation:hitShake .5s}
@keyframes hitShake{0%,100%{transform:translate(0,0) scale(1.06)}15%{transform:translate(-8px,-3px) scale(1.06);filter:brightness(2.2)}35%{transform:translate(8px,4px) scale(1.06);filter:brightness(1.6)}55%{transform:translate(-6px,0) scale(1.06);filter:brightness(1.3)}}
.fly-card{position:fixed;width:44px;height:62px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:"STKaiti","KaiTi",serif;font-size:20px;font-weight:900;pointer-events:none;box-shadow:0 0 20px currentColor;color:#e74c3c;z-index:1000}
.slash-fx{position:fixed;font-size:70px;font-family:"STKaiti","KaiTi",serif;font-weight:900;color:#ff2020;text-shadow:0 0 20px #f00,0 0 40px #f00;pointer-events:none;z-index:1001;animation:slashAnim .85s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes slashAnim{0%{opacity:0;transform:scale(.2) rotate(-30deg)}25%{opacity:1;transform:scale(1.6) rotate(-30deg)}45%{transform:scale(1.2) rotate(-30deg)}70%{opacity:1;transform:scale(1.35) rotate(-30deg) translateY(-20px)}100%{opacity:0;transform:scale(1.9) rotate(-30deg) translateY(-60px)}}
.float-text{position:fixed;font-size:28px;font-weight:900;pointer-events:none;z-index:1001;animation:floatUp 1.1s cubic-bezier(.2,1,.5,1) forwards;text-shadow:2px 2px 6px #000}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.3)}15%{opacity:1;transform:translateY(-15px) scale(1.3)}35%{transform:translateY(-25px) scale(1.1)}100%{opacity:0;transform:translateY(-80px) scale(.9)}}
.shield-fx{position:fixed;width:120px;height:120px;border-radius:50%;border:4px solid #4af;box-shadow:0 0 30px #4af;pointer-events:none;z-index:1000;animation:shieldAnim .7s ease-out forwards}
@keyframes shieldAnim{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.7)}}
.heal-fx{position:fixed;width:85px;height:85px;border-radius:50%;background:radial-gradient(circle,rgba(46,204,113,.75) 0%,transparent 70%);pointer-events:none;z-index:1000;animation:healAnim .9s ease-out forwards}
@keyframes healAnim{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) translateY(-30px)}}
.skill-ripple{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid #b57fff;box-shadow:0 0 40px #b57fff;pointer-events:none;z-index:1000;animation:rippleAnim .9s ease-out forwards}
@keyframes rippleAnim{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.85)}}
.judge-fx{position:fixed;width:60px;height:88px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--gold);border-radius:5px;pointer-events:none;z-index:1001;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600;animation:judgeFlip .95s cubic-bezier(.3,1.4,.5,1) forwards;box-shadow:0 0 24px rgba(245,197,66,.9)}
@keyframes judgeFlip{0%{opacity:0;transform:translateY(30px) rotateY(0) scale(.5)}30%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.1)}70%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.1)}100%{opacity:0;transform:translateY(-50px) rotateY(180deg) scale(.9)}}
.judge-fx .jsuit{font-size:20px}
.judge-fx .jnum{font-size:11px;color:#7a6a50}
.judge-fx .jname{font-size:8px;margin-top:3px;color:#8a1a10;border-top:1px solid #c0b090;padding-top:2px;width:80%;text-align:center}
.judge-fx.red{color:#c0392b}
.judge-fx.black{color:#1a1a1a}
.death-fx{position:fixed;font-size:46px;font-weight:900;color:#888;text-shadow:0 0 20px #000,0 0 40px #f00;pointer-events:none;z-index:1002;animation:deathAnim 1.25s ease-out forwards;font-family:"STKaiti","KaiTi",serif}
@keyframes deathAnim{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.4) rotate(-8deg)}100%{opacity:0;transform:scale(.8) rotate(-15deg) translateY(-80px)}}

/* 移动端 dock */
.mobile-dock,.mobile-drawer{display:none}

@media(max-width:900px){
  .game-main{flex-direction:column;gap:6px}
  .table-area{height:460px;border-radius:48% / 36%}
  .side-panel{width:100%;height:auto;flex-direction:row;gap:6px}
  .play-log-panel,.chat-panel{flex:1;min-height:0;max-height:160px}
  .p-card{width:100px}
  .card{width:50px;height:72px}
  .card .cname{font-size:11px}
}

  .pile-label,.pile-count{font-size:8px}
  .pile-stack{width:28px;height:40px}

  .play-card{width:32px;height:46px;font-size:9px}

  .play-card .pcnum{font-size:5px}
  .play-card .pcowner{font-size:5px}
  .play-zone{gap:3px}
  .play-zone-label{font-size:7px;padding:0 4px}
  .seat-ring{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 4px;width:100%;-webkit-overflow-scrolling:touch}
  .seat{position:static !important;transform:none !important;left:auto !important;top:auto !important;transition:none !important;flex-shrink:0}
  .p-card{width:92px;padding:4px;border-radius:8px;transition:none}
  .p-card .faction-icon{width:18px;height:18px;line-height:18px;font-size:11px;top:-8px;left:-6px}
  .p-card .p-mark-btn{width:18px;height:18px;font-size:10px;top:-8px;right:-4px}
  .p-card .p-mark-label{font-size:8px;padding:1px 6px;bottom:calc(100% + 4px)}
  .p-card .pheader{gap:2px;margin-bottom:2px;margin-left:2px}
  .p-card .pavatar{width:18px;height:18px;font-size:13px}
  .p-card .pname{font-size:9px}
  .p-card .prole{font-size:7px}
  .p-card .pknow{font-size:7px;padding:0 2px;top:2px;right:2px}
  .p-card .php-bar{gap:1px;padding:1px 0 2px;margin-bottom:2px}
  .hp-gem{width:7px;height:7px}
  .p-card .pequip-slots{gap:1px;margin-bottom:2px}
  .equip-slot{font-size:8px;border-radius:2px}
  .equip-slot .eq-icon{font-size:8px}
  .equip-slot .eq-short{font-size:6px;margin-top:0}
  .p-card .pequip-names{font-size:7px;min-height:8px;padding:0 1px}
  .p-card .pfooter{padding-top:1px}
  .hand-pile{height:12px;width:22px}
  .hand-pile .mini-card{width:9px;height:12px}

  .hand-pile .mini-card:nth-child(3){left:6px}

  .hand-pile .hand-count{font-size:7px;min-width:10px;height:10px;line-height:10px;padding:0 1px}

  .card .num{font-size:7px;top:1px;right:2px}
  .card .cname{font-size:10px}
  .card .ctype{font-size:6px}
  
  .quiz-box{max-width:100%;padding:12px}
  .quiz-question{font-size:12.5px}
  .quiz-option{font-size:12px;padding:7px 9px}
  .faction-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px}

  @keyframes dockPulse{0%,100%{box-shadow:0 0 12px rgba(245,197,66,.5)}50%{box-shadow:0 0 18px rgba(245,197,66,.9)}}

<script>
/* ==================== 工具 ==================== */
function togglePanel(id){const el=document.getElementById(id);if(!el)return;el.classList.toggle('collapsed');const btn=el.querySelector('.panel-toggle');if(btn)btn.textContent=el.classList.contains('collapsed')?'▸':'▾';}
function exitGame(){
  document.querySelectorAll('.rules-modal,#quizModal,#markModal').forEach(el=>el.classList.remove('show'));
  try{
    if(typeof G!=='undefined')G.gameOver=true;
    if(typeof NET!=='undefined'&&NET.isHost)NET.broadcast({type:'host_closed'});
    if(typeof NET!=='undefined'&&!NET.isHost&&NET.myConn){try{NET.myConn.send({type:'leave_room',name:NET_PLAYER_NAMES[NET.myPeerId]||'玩家'})}catch(e){}}
    if(typeof NET!=='undefined'&&NET.peer){try{NET.peer.destroy()}catch(e){}}
  }catch(e){}
  setTimeout(()=>{window.location.href=window.location.pathname+'?t='+Date.now();},150);
}

/* ==================== 移动端 Dock ==================== */
let mobileDockOpen=null;
let unreadLog=0,unreadChat=0;

function updateDockBadge(){
  const logB=document.getElementById('logDockBadge');
  const chatB=document.getElementById('chatDockBadge');
  const logBtn=document.getElementById('dockLogBtn');
  const chatBtn=document.getElementById('dockChatBtn');
  if(logB){logB.textContent=unreadLog>99?'99+':unreadLog;logB.classList.toggle('show',unreadLog>0);}
  if(chatB){chatB.textContent=unreadChat>99?'99+':unreadChat;chatB.classList.toggle('show',unreadChat>0);}
  if(logBtn)logBtn.classList.toggle('has-unread',unreadLog>0);
  if(chatBtn)chatBtn.classList.toggle('has-unread',unreadChat>0);
}
function openDock(tab){
  mobileDockOpen=tab;
  const drawer=document.getElementById('mobileDrawer');
  const title=document.getElementById('mobileDrawerTitle');
  const body=document.getElementById('mobileDrawerBody');
  document.getElementById('mobileDock').style.display='none';
  drawer.classList.add('show');
  if(tab==='log'){
    title.textContent='📋 战 报';
    unreadLog=0;
    body.innerHTML=`<div class="play-log-list">${document.getElementById('playLogList').innerHTML}</div>`;
    setTimeout(()=>{const pl=body.querySelector('.play-log-list');if(pl)pl.scrollTop=pl.scrollHeight;},50);
  } else {
    title.textContent='💬 聊 天';
    unreadChat=0;
    body.innerHTML=`
      <div class="chat-list" id="mobileChatList">${document.getElementById('chatList').innerHTML}</div>
      <div class="chat-input-row">
        <input id="mobileChatInput" placeholder="说点什么…" maxlength="40" onkeydown="if(event.key==='Enter')sendChatFromMobile()">
        <button onclick="sendChatFromMobile()">发送</button>
      </div>
    `;
    setTimeout(()=>{const cl=document.getElementById('mobileChatList');if(cl)cl.scrollTop=cl.scrollHeight;},50);
  }
  updateDockBadge();
}
function closeDock(){
  mobileDockOpen=null;
  document.getElementById('mobileDrawer').classList.remove('show');
  document.getElementById('mobileDock').style.display='flex';
}
function sendChatFromMobile(){
  const input=document.getElementById('mobileChatInput');
  const text=(input.value||'').trim();
  if(!text)return;
  input.value='';
  const me=G.players[G.myPlayerIdx];
  if(!me)return;
  addChat(me.name,text,'self');
  if(NET.isHost){NET.broadcast({type:'chat',name:me.name,text});}
  else if(NET.myConn){NET.myConn.send({type:'chat',name:me.name,text});}
}
// 同步移动端抽屉内容
function refreshMobileDrawer(){
  if(!mobileDockOpen)return;
  const body=document.getElementById('mobileDrawerBody');
  if(!body)return;
  if(mobileDockOpen==='log'){
    const old=body.querySelector('.play-log-list');
    const scrollPos=old?old.scrollTop:0;
    const wasBottom=old?Math.abs(old.scrollHeight-old.scrollTop-old.clientHeight)<30:true;
    body.innerHTML=`<div class="play-log-list">${document.getElementById('playLogList').innerHTML}</div>`;
    const nw=body.querySelector('.play-log-list');
    if(nw){ nw.scrollTop = wasBottom ? nw.scrollHeight : scrollPos; }
  } else {
    const old=body.querySelector('.chat-list');
    const scrollPos=old?old.scrollTop:0;
    const wasBottom=old?Math.abs(old.scrollHeight-old.scrollTop-old.clientHeight)<30:true;
    const oldInput=document.getElementById('mobileChatInput');
    const inputVal=oldInput?oldInput.value:'';
    body.innerHTML=`
      <div class="chat-list" id="mobileChatList">${document.getElementById('chatList').innerHTML}</div>
      <div class="chat-input-row">
        <input id="mobileChatInput" placeholder="说点什么…" maxlength="40" onkeydown="if(event.key==='Enter')sendChatFromMobile()" value="${inputVal.replace(/"/g,'&quot;')}">
        <button onclick="sendChatFromMobile()">发送</button>
      </div>
    `;
    const nw=document.getElementById('mobileChatList');
    if(nw){ nw.scrollTop = wasBottom ? nw.scrollHeight : scrollPos; }
  }
}

/* ==================== 题库运行态 ==================== */
const QUESTION_BANK=JSON.parse(JSON.stringify(BUILTIN_QUESTION_BANK));
let EXTERNAL_STATS={total:0};

function gradeSortKey(g){
  const i=GRADE_ORDER.indexOf(g);
  return i<0?999:i;
}
function sortedGrades(){
  return Object.keys(QUESTION_BANK).sort((a,b)=>{
    const d=gradeSortKey(a)-gradeSortKey(b);
    if(d!==0)return d;
    return a.localeCompare(b,'zh');
  });
}
function updateBankInfo(){
  const bi=document.getElementById('bankInfo');if(!bi)return;
  const grades=sortedGrades();
  if(!grades.length){bi.textContent='暂无题库';return;}
  let tb=0,te=0;
  const parts=[];
  grades.forEach(g=>{
    const ext=EXTERNAL_STATS[g]||0;
    const total=(QUESTION_BANK[g]||[]).length;
    const builtin=Math.max(0,total-ext);
    tb+=builtin;te+=ext;
    parts.push(`${g}:${builtin}${ext?'+'+ext:''}`);
  });
  bi.innerHTML=`年级：<b>${grades.length}</b> 个 ｜ 内置 <b>${tb}</b> 题 ｜ 外部 <b style="color:#8fd0ff">${te}</b> 题<br>
    <span style="font-size:10px;line-height:1.6">${parts.join('　')}</span>`;
}
function ensureGrade(grade){
  if(!QUESTION_BANK[grade])QUESTION_BANK[grade]=[];
  return QUESTION_BANK[grade];
}
function addQuestionsToBank(qs,grade){
  if(!Array.isArray(qs))return{added:0,dup:0,invalid:0};
  let added=0,dup=0,invalid=0;
  const bank=ensureGrade(grade);
  const ex=new Set(bank.map(q=>q.q));
  for(const it of qs){
    if(!it||typeof it!=='object'||!it.q||!Array.isArray(it.o)||it.o.length<2){invalid++;continue;}
    if(typeof it.a!=='number'||it.a<0||it.a>=it.o.length){invalid++;continue;}
    if(ex.has(it.q)){dup++;continue;}
    bank.push({s:it.s||'语文',kp:it.kp||it.knowledge||'综合',q:it.q,o:it.o.slice(),a:it.a});
    ex.add(it.q);added++;
  }
  return{added,dup,invalid};
}
function mergeBankData(data){
  let added=0,dup=0,invalid=0;
  const reps=[];
  const put=(grade,arr)=>{
    const r=addQuestionsToBank(arr,grade);
    added+=r.added;dup+=r.dup;invalid+=r.invalid;
    if(r.added>0){
      EXTERNAL_STATS[grade]=(EXTERNAL_STATS[grade]||0)+r.added;
      EXTERNAL_STATS.total+=r.added;
    }
    reps.push(`${grade}：新增 ${r.added}，重复 ${r.dup}，无效 ${r.invalid}`);
  };
  if(Array.isArray(data)){put(SELECTED_GRADE,data);}
  else if(data&&typeof data==='object'){
    let any=false;
    for(const g of Object.keys(data)){
      if(Array.isArray(data[g])){put(g,data[g]);any=true;}
    }
    if(!any)throw new Error('未找到任何有效的年级数组');
  } else throw new Error('题库格式无法识别');
  return{added,dup,invalid,reps};
}

/* 解析文本形式的题库（json 或 var EXTERNAL_BANK = {...} 的 js） */
function parseBankText(text){
  try{return JSON.parse(text);}catch(_){}
  const code=text+'\n;return (typeof EXTERNAL_BANK!=="undefined")?EXTERNAL_BANK:(typeof window!=="undefined"&&window.EXTERNAL_BANK?window.EXTERNAL_BANK:null);';
  return new Function(code)();
}

/* 从 URL 异步加载题库 */
async function loadBankFromUrl(url,silent){
  if(!url)return null;
  try{
    const res=await fetch(url,{cache:'no-cache'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    const data=parseBankText(text);
    if(!data)throw new Error('未解析出题库数据');
    const r=mergeBankData(data);
    updateBankInfo();
    renderGradePicker();
    if(!silent){
      alert(`✅ URL 题库加载完成\n\n${r.reps.join('\n')}\n\n总计：新增 ${r.added}，重复 ${r.dup}，无效 ${r.invalid}`);
    }else{
      console.log('[学堂杀] URL 题库已加载：',url,'新增',r.added);
    }
    return r;
  }catch(e){
    console.warn('[学堂杀] URL 题库加载失败：',url,e);
    if(!silent)alert('❌ 加载失败：'+e.message);
    return null;
  }
}

/* 本地文件导入 */
function importQuestionBank(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=parseBankText(e.target.result);
      if(!data)throw new Error('未找到题库数据');
      const r=mergeBankData(data);
      updateBankInfo();renderGradePicker();
      alert(`✅ 题库导入完成\n\n${r.reps.join('\n')}\n\n总计：新增 ${r.added}，重复 ${r.dup}，无效 ${r.invalid}`);
      event.target.value='';
    }catch(err){alert('❌ 导入失败：'+err.message);event.target.value='';}
  };
  reader.readAsText(file);
}

/* 清空外部题库，恢复内置 */
function clearExternalBank(){
  if(!confirm('确认清空所有外部题库（URL / 本地导入）？'))return;
  for(const g of Object.keys(QUESTION_BANK)){
    const builtin=BUILTIN_QUESTION_BANK[g]||[];
    if(!builtin.length){delete QUESTION_BANK[g];continue;}
    const set=new Set(builtin.map(q=>q.q));
    QUESTION_BANK[g]=QUESTION_BANK[g].filter(q=>set.has(q.q));
  }
  EXTERNAL_STATS={total:0};
  updateBankInfo();renderGradePicker();
}

/* ==================== 音效 ==================== */
const Sound={ctx:null,enabled:true,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.enabled=false;return null;}}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  play(t){if(!this.enabled)return;const c=this.init();if(!c)return;const n=c.currentTime;
    const tone=(f,d,tp='sine',v=0.1)=>{const o=c.createOscillator(),g=c.createGain();o.type=tp;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d);};
    switch(t){
      case 'click':tone(880,.06,'triangle',.06);break;
      case 'draw':tone(1200,.1,'sine',.07);break;
      case 'play':tone(520,.14,'triangle',.12);break;
      case 'sha':tone(130,.32,'sine',.3);break;
      case 'shan':[1500,2250,3000].forEach(f=>tone(f,.4,'sine',.06));break;
      case 'tao':[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.1),i*80));break;
      case 'hit':tone(180,.28,'square',.2);break;
      case 'skill':tone(280,.45,'sawtooth',.09);break;
      case 'correct':[659,880,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.08),i*70));break;
      case 'wrong':tone(200,.42,'square',.11);break;
      case 'win':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.5,'triangle',.1),i*120));break;
    }
  }
};
function toggleSound(){Sound.enabled=!Sound.enabled;const b=document.getElementById('soundToggle');b.textContent=Sound.enabled?'🔊':'🔇';b.classList.toggle('muted',!Sound.enabled);if(Sound.enabled){Sound.init();Sound.play('click');}}

function showPlayCard(card,ownerName,ownerColor){
  const z=document.getElementById('playZoneCards');if(!z)return;
  const em=z.querySelector('.play-zone-empty');if(em)em.remove();
  const isRed=card.suit==='♥'||card.suit==='♦';
  const cls=card.type==='trick'?'trick':(card.type==='equip'?'equip':(isRed?'red':''));
  const e=document.createElement('div');e.className='play-card '+cls;
  if(ownerColor)e.style.borderColor=ownerColor;
  e.innerHTML=`<span class="pcsuit">${card.suit}</span><span class="pcnum">${card.num}</span><span class="pcname">${card.name}</span><span class="pcowner">${ownerName||''}</span>`;
  while(z.querySelectorAll('.play-card').length>=4){const f=z.querySelector('.play-card');if(f)f.remove();}
  z.appendChild(e);
  setTimeout(()=>{e.classList.add('fade-out');setTimeout(()=>{if(e.parentNode)e.parentNode.removeChild(e);if(z.querySelectorAll('.play-card').length===0)z.innerHTML='<div class="play-zone-label">出 牌 区</div><span class="play-zone-empty">— 牌桌中央 —</span>';},420);},2200);
}

let playLog=[];
function addLog(t,cls=''){
  playLog.push({action:'log',text:t,cls});if(playLog.length>100)playLog.shift();
  renderPlayLog();
  if(NET.isHost)NET.broadcast({type:'play_log',entry:{action:'log',text:t,cls}});
  if(mobileDockOpen!=='log'){unreadLog++;updateDockBadge();}
}
function addPlayLog(fromName,action,cardName,toName,cls=''){
  const entry={action,fromName,cardName,toName,cls};
  playLog.push(entry);if(playLog.length>100)playLog.shift();
  renderPlayLog();
  if(NET.isHost)NET.broadcast({type:'play_log',entry});
  if(mobileDockOpen!=='log'){unreadLog++;updateDockBadge();}
}
function renderPlayLog(){
  const el=document.getElementById('playLogList');if(!el)return;
  el.innerHTML=playLog.slice(-60).map(l=>{
    if(l.action==='log')return `<div class="play-log-item ${l.cls||''}">${l.text}</div>`;
    if(l.action==='use')return `<div class="play-log-item ${l.cls||''}"><span class="pl-from">${l.fromName}</span> 使用 <span class="pl-card">【${l.cardName}】</span>${l.toName?' → <span class="pl-to">'+l.toName+'</span>':''}</div>`;
    if(l.action==='damage')return `<div class="play-log-item dmg"><span class="pl-to">${l.toName}</span> 受到 <span class="pl-card">${l.cardName}</span> 点伤害</div>`;
    if(l.action==='heal')return `<div class="play-log-item heal"><span class="pl-to">${l.toName}</span> 回复 <span class="pl-card">${l.cardName}</span> 点体力</div>`;
    if(l.action==='skill')return `<div class="play-log-item skill"><span class="pl-from">${l.fromName}</span> 发动 <span class="pl-card">【${l.cardName}】</span></div>`;
    if(l.action==='reward')return `<div class="play-log-item reward"><span class="pl-from">${l.fromName}</span> 获得 <span class="pl-card">${l.cardName}</span></div>`;
    if(l.action==='faction')return `<div class="play-log-item faction">${l.fromName} ${l.cardName}</div>`;
    if(l.action==='kp')return `<div class="play-log-item kp">📖 ${l.fromName} 答对【${l.cardName}】</div>`;
    if(l.action==='sys')return `<div class="play-log-item sys">${l.text||''}</div>`;
    return '';
  }).join('');
  document.getElementById('playLogBadge').textContent=playLog.length;
  el.scrollTop=el.scrollHeight;
  refreshMobileDrawer();
}

/* ==================== 聊天 ==================== */
let chatMessages=[];
function addChat(name,text,kind='ai'){
  chatMessages.push({name,text,kind});if(chatMessages.length>100)chatMessages.shift();
  renderChat();
  if(mobileDockOpen!=='chat'){unreadChat++;updateDockBadge();}
}
function renderChat(){
  const el=document.getElementById('chatList');if(!el)return;
  el.innerHTML=chatMessages.map(m=>`<div class="chat-msg ${m.kind}"><span class="chat-name">${m.name}</span><span class="chat-text">${escapeHtml(m.text)}</span></div>`).join('');
  el.scrollTop=el.scrollHeight;
  refreshMobileDrawer();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sendChat(){
  const input=document.getElementById('chatInput');const text=(input.value||'').trim();if(!text)return;
  const me=G.players[G.myPlayerIdx];if(!me)return;
  addChat(me.name,text,'self');input.value='';
  if(NET.isHost)NET.broadcast({type:'chat',name:me.name,text});
  else if(NET.myConn)NET.myConn.send({type:'chat',name:me.name,text});
}

const SUITS=['♠','♥','♣','♦'];let cid=0;
function C(name,type,sub,suit,num,extra={}){return{id:++cid,name,type,sub,suit,num,...extra};}
function buildDeck(){
  const d=[];
  for(let i=0;i<30;i++)d.push(C('杀','basic','sha',SUITS[i%4],i%13+1));
  for(let i=0;i<15;i++)d.push(C('闪','basic','shan',SUITS[i%4],i%13+1));
  for(let i=0;i<8;i++)d.push(C('桃','basic','tao',SUITS[i%4],i%13+1));
  for(let i=0;i<5;i++)d.push(C('酒','basic','jiu',SUITS[i%4],i%13+1));
  const tr=[['无中生有','wuzhong',4],['过河拆桥','guohe',6],['顺手牵羊','shunshou',5],['决斗','juedou',3],['南蛮入侵','nanman',3],['万箭齐发','wanjian',1],['桃园结义','taoyuan',1],['无懈可击','wuxie',4],['乐不思蜀','lebu',3],['闪电','shandian',2]];
  tr.forEach(([n,s,c])=>{for(let i=0;i<c;i++)d.push(C(n,'trick',s,SUITS[i%4],i%13+1));});
  const eq=[['诸葛连弩','weapon',{range:1,skill:'liannu'},1],['青龙偃月刀','weapon',{range:3,skill:'qinglong'},1],['丈八蛇矛','weapon',{range:3,skill:'zhangba'},1],['八卦阵','armor',{skill:'bagua'},2],['仁王盾','armor',{skill:'renwang'},1],['+1马','horse+',{dist:1},3],['-1马','horse-',{dist:1},3]];
  eq.forEach(([n,s,e,c])=>{for(let i=0;i<c;i++)d.push(C(n,'equip',s,SUITS[i%4],i%13+1,e));});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

  pendingOptions:null,pendingType:'list',pendingResolve:null,pendingPlayer:null,gameOver:false,winnerText:'',playerCount:4};

function currentBank(){
  const b=QUESTION_BANK[G.grade];
  if(b&&b.length)return b;
  const gs=sortedGrades();
  for(const g of gs){if(QUESTION_BANK[g]&&QUESTION_BANK[g].length)return QUESTION_BANK[g];}
  return [];
}
function pickQ(p){
  const bank=currentBank();
  if(!bank.length)return{s:'综合',kp:'综合',q:'（题库为空，请先导入题库）',o:['继续','跳过'],a:0};
  if(p){
    const f=FACTIONS[p.faction];
    if(f&&Math.random()<0.5){const sub=bank.filter(q=>q.s===f.subject);if(sub.length)return sub[Math.floor(Math.random()*sub.length)];}
    if(p.subject&&Math.random()<0.7){const sub=bank.filter(q=>q.s===p.subject);if(sub.length)return sub[Math.floor(Math.random()*sub.length)];}
  }
  return bank[Math.floor(Math.random()*bank.length)];
}
function hasSkill(p,id){return p.skills&&p.skills.some(s=>s.id===id);}
function seatDist(a,b){const n=G.players.length;return Math.min(Math.abs(a-b),n-Math.abs(a-b));}
function distBetween(fi,ti){let d=seatDist(fi,ti);const from=G.players[fi],to=G.players[ti];if(to.equip.horsePlus)d+=1;if(from.equip.horseMinus)d-=1;if(hasSkill(from,'wanyou')||hasSkill(from,'tanxian'))d-=1;return Math.max(1,d);}
function attackRange(p){return p.equip.weapon?(p.equip.weapon.range||1):1;}
function inRange(fi,ti){return distBetween(fi,ti)<=attackRange(G.players[fi]);}
function drawCards(p,n){for(let i=0;i<n;i++){if(G.deck.length===0){if(G.discard.length===0)break;G.deck=G.discard;G.discard=[];shuffle(G.deck);}const c=G.deck.pop();if(c)p.hand.push(c);}if(n>0)Sound.play('draw');}
function discardCard(p,card,toDiscard=true){const i=p.hand.findIndex(c=>c.id===card.id);if(i>=0){p.hand.splice(i,1);if(toDiscard)G.discard.push(card);}}
function handLimit(p){let l=Math.max(p.hp,0);if(hasSkill(p,'zhuishu'))l+=2;if(hasSkill(p,'yuansu'))l+=1;return l;}
function sameFaction(a,b){return a.faction===b.faction;}

/* ==================== 网络层 ==================== */
const NET={
  peer:null,conns:[],myConn:null,isHost:false,mode:'single',roomCode:null,myPeerId:null,playerConns:{},pendingQuiz:null,
  roomMembers:[],
  addRoomMember(peerId,name,isHost){if(this.roomMembers.some(m=>m.peerId===peerId))return;this.roomMembers.push({peerId,name,isHost:!!isHost});},
  removeRoomMember(peerId){this.roomMembers=this.roomMembers.filter(m=>m.peerId!==peerId);},
  broadcastRoomState(){
    if(!this.isHost)return;
    const hm=this.roomMembers.find(m=>m.isHost);
    const state={type:'room_state',roomCode:this.roomCode,hostName:hm?hm.name:'房主',members:this.roomMembers.map(m=>({name:m.name,isHost:m.isHost})),currentCount:this.roomMembers.length,targetCount:SELECTED_COUNT};
    this.broadcast(state);
    updateHostRoomInfo(state);
  },
  async createRoom(code,hostName){
    return new Promise((resolve,reject)=>{
      this.roomCode=code;this.isHost=true;this.mode='host';
      this.peer=new Peer('xts-'+code,{debug:1});
      this.peer.on('open',id=>{this.myPeerId=id;resolve(id);});
      this.peer.on('error',e=>reject(e));
      this.peer.on('connection',conn=>{
        this.conns.push(conn);
        conn.on('open',()=>{this.playerConns[conn.peer]=conn;onPeerConnected(conn);});
        conn.on('data',d=>onPeerData(conn,d));
        conn.on('close',()=>{
          this.conns=this.conns.filter(c=>c!==conn);
          delete this.playerConns[conn.peer];
          const leavingName=NET_PLAYER_NAMES[conn.peer]||'玩家';
          this.removeRoomMember(conn.peer);delete NET_PLAYER_NAMES[conn.peer];
          addChat('系统',`📤 ${leavingName} 断开了连接。`,'sys');
          this.broadcast({type:'chat',name:'系统',text:`📤 ${leavingName} 断开了连接。`});
          this.broadcastRoomState();
          const p=G.players.find(pl=>pl.peerId===conn.peer);
          if(p&&p.alive){addLog(`${p.name} 断线，转为AI`);p.isAI=true;p.peerId=null;render();}
        });
      });
    });
  },
  async joinRoom(code,myName){
    return new Promise((resolve,reject)=>{
      this.roomCode=code;this.isHost=false;this.mode='join';
      this.peer=new Peer({debug:1});
      this.peer.on('open',id=>{
        this.myPeerId=id;
        const conn=this.peer.connect('xts-'+code,{metadata:{name:myName}});
        this.myConn=conn;this.conns=[conn];
        conn.on('open',()=>resolve(id));
        conn.on('data',d=>onClientData(d));
        conn.on('error',e=>reject(e));
      });
      this.peer.on('error',e=>reject(e));
    });
  },
  broadcast(msg){if(!this.isHost)return;this.conns.forEach(c=>{try{c.send(msg);}catch(e){}});},
  sendToHost(msg){if(this.isHost)return;if(this.myConn){try{this.myConn.send(msg);}catch(e){}};},
  sendToPlayer(pid,msg){if(!this.isHost)return;const c=this.playerConns[pid];if(c){try{c.send(msg);}catch(e){}};}
};
let NET_PLAYER_NAMES={};

function onPeerConnected(conn){
  const name=conn.metadata?.name||'玩家';
  NET.addRoomMember(conn.peer,name,false);
  NET_PLAYER_NAMES[conn.peer]=name;
  addChat('系统',`📥 ${name} 加入了房间。`,'sys');
  NET.broadcast({type:'chat',name:'系统',text:`📥 ${name} 加入了房间。`});
  NET.broadcastRoomState();
}
function onPeerData(conn,data){
  if(!NET.isHost)return;
  if(data.type==='choose_response'){
    if(G.pendingPlayer!=null&&G.pendingResolve){
      const r=G.pendingResolve;G.pendingResolve=null;G.pendingOptions=null;G.pendingPlayer=null;r(data.value);
    }
  } else if(data.type==='quiz_response'){
    if(NET.pendingQuiz){const r=NET.pendingQuiz.resolve;NET.pendingQuiz=null;r(data.correct);}
  } else if(data.type==='chat'){
    addChat(data.name,data.text,'ai');NET.broadcast(data);
  } else if(data.type==='leave_room'){
    const ln=data.name||NET_PLAYER_NAMES[conn.peer]||'玩家';
    NET.removeRoomMember(conn.peer);delete NET_PLAYER_NAMES[conn.peer];
    addChat('系统',`📤 ${ln} 离开了房间。`,'sys');
    NET.broadcast({type:'chat',name:'系统',text:`📤 ${ln} 离开了房间。`});
    NET.broadcastRoomState();
    try{conn.close();}catch(e){}
  }
}
function onClientData(data){
  if(data.type==='start_game'){
    G.players=data.players;G.myPlayerIdx=data.myPlayerIdx;G.grade=data.grade;G.playerCount=data.playerCount;
    G.started=true;G.deck=[];G.discard=[];
    document.getElementById('screenLobby').classList.remove('active');
    document.getElementById('screenGame').classList.add('active');
    clearPlayZone();render();
  } else if(data.type==='state_sync'){
    G.players=data.players;G.current=data.current;G.deck=data.deck;G.discard=data.discard;
    G.gameOver=data.gameOver;G.winnerText=data.winnerText;
    G.pendingOptions=data.pendingOptions;G.pendingPlayer=data.pendingPlayer;G.pendingType=data.pendingType||'list';
    if(data.playLog){playLog=data.playLog.slice(-60);renderPlayLog();}
    render();
  } else if(data.type==='choose_request'){
    G.pendingOptions=data.options;G.pendingPlayer=data.myPlayerIdx;G.pendingType=data.choiceType||'list';render();
  } else if(data.type==='ask_quiz_request'){
    onAskQuizRequest(data.question,data.isSkill);
  } else if(data.type==='chat'){
    addChat(data.name,data.text,'ai');
  } else if(data.type==='play_log'){
    if(data.entry){playLog.push(data.entry);if(playLog.length>100)playLog.shift();renderPlayLog();if(mobileDockOpen!=='log'){unreadLog++;updateDockBadge();}}
  } else if(data.type==='room_state'){
    updateGuestRoomInfo(data);
  } else if(data.type==='host_closed'){
    alert('⚠️ 房主已关闭房间，游戏结束');
    try{if(NET.peer)NET.peer.destroy();}catch(e){}
    setTimeout(()=>{location.reload();},400);
  }
}
function syncStateToClients(){
  if(!NET.isHost)return;
  NET.broadcast({type:'state_sync',players:G.players,current:G.current,deck:G.deck,discard:G.discard,gameOver:G.gameOver,winnerText:G.winnerText,pendingOptions:G.pendingOptions,pendingType:G.pendingType,pendingPlayer:G.pendingPlayer,playLog:playLog.slice(-60)});
}
let _syncTimer=null;
function scheduleSync(){
  if(!NET.isHost)return;
  if(_syncTimer)return;
  _syncTimer=setTimeout(()=>{_syncTimer=null;try{syncStateToClients();}catch(e){}},80);
}
async function onAskQuizRequest(question,isSkill){

/* ==================== 选择等待 ==================== */
function waitChoice(playerIdx,options,type='list'){
  return new Promise(resolve=>{
    const p=G.players[playerIdx];
    if(!p){resolve(options[options.length-1].value);return;}
    G.pendingOptions=options;G.pendingType=type;G.pendingPlayer=playerIdx;G.pendingResolve=resolve;
    if(isLocalPlayer(playerIdx)){render();}
    else if(NET.isHost){
      NET.sendToPlayer(p.peerId,{type:'choose_request',options,myPlayerIdx:G.players.indexOf(p),choiceType:type});
      render();syncStateToClients();
    } else render();
  });
}
function resolveChoice(v){
  Sound.play('click');
  if(!G.pendingResolve)return;
  const r=G.pendingResolve;G.pendingResolve=null;G.pendingOptions=null;G.pendingPlayer=null;r(v);
  if(NET.isHost)syncStateToClients();
  render();
}
function clientResolveChoice(v){
  Sound.play('click');
  if(!G.pendingOptions)return;
  G.pendingOptions=null;G.pendingPlayer=null;
  NET.sendToHost({type:'choose_response',value:v});
  render();
}
function handleLocalChoice(v){if(NET.mode==='join')clientResolveChoice(v);else resolveChoice(v);}

/* ==================== 卡牌点击 ==================== */
function isCardClickable(card){
  if(!G.pendingOptions||G.pendingPlayer!==G.myPlayerIdx)return false;
  const type=G.pendingType;
  if(type==='play')return G.pendingOptions.some(o=>o.value===`sha_${card.id}`||o.value===`tao_${card.id}`||o.value===`jiu_${card.id}`||o.value===`trick_${card.id}`||o.value===`equip_${card.id}`);
  if(type==='discard')return G.pendingOptions.some(o=>o.value===card.id||String(o.value)===String(card.id));
  if(type==='rescue'||type==='shan')return G.pendingOptions.some(o=>o.value===`card_${card.id}`);
  return false;
}
function cardClickHint(card){
  if(!G.pendingOptions||G.pendingPlayer!==G.myPlayerIdx)return '';
  const type=G.pendingType;
  if(type==='discard'&&isCardClickable(card))return 'card-discard-hint';
  if(type==='rescue'&&isCardClickable(card))return 'card-rescue-hint';
  if(type==='shan'&&isCardClickable(card))return 'card-shan-hint';
  return '';
}
function clickHandCard(cardId){
  if(!G.pendingOptions)return;
  const type=G.pendingType;
  let matched=null;
  if(type==='play'){
    const vals=[`sha_${cardId}`,`tao_${cardId}`,`jiu_${cardId}`,`trick_${cardId}`,`equip_${cardId}`];
    matched=G.pendingOptions.find(o=>vals.includes(o.value));
  } else if(type==='discard'){
    matched=G.pendingOptions.find(o=>o.value===cardId||String(o.value)===String(cardId));
  } else if(type==='rescue'||type==='shan'){
    matched=G.pendingOptions.find(o=>o.value===`card_${cardId}`);
  }
  if(matched){Sound.play('click');handleLocalChoice(matched.value);}
}
function clickTargetSeat(idx){
  if(!G.pendingOptions||G.pendingType!=='target')return;
  const opt=G.pendingOptions.find(o=>o.value===idx);
  if(opt){Sound.play('click');handleLocalChoice(idx);}
}

/* ==================== 学习奖励 ==================== */
function grantLearningReward(player,isSkillQuiz,question){
  if(!player)return [];
  const rewards=[];
  player.subjectMastery=player.subjectMastery||{};
  const sub=question?question.s:null;
  if(sub)player.subjectMastery[sub]=(player.subjectMastery[sub]||0)+1;
  player.combo=(player.combo||0)+1;
  if(player.combo>(player.maxCombo||0))player.maxCombo=player.combo;
  const faction=FACTIONS[player.faction];
  if(faction&&sub&&faction.subject===sub){
    player.knowledge+=1;drawCards(player,1);
    rewards.push(`🏛️【${faction.name}】+1学识+摸1牌`);
    addPlayLog(player.name,'faction',faction.name+'加成','','faction');
  }
  const roll=Math.random();
  if(roll<0.30){player.shield=(player.shield||0)+1;rewards.push('🛡️+1护盾');}
  else if(roll<0.55){drawCards(player,1);rewards.push('🎴摸1张');}
  else if(roll<0.72){if(player.hp<player.maxHp){player.hp++;rewards.push('💚回复1点');}else{drawCards(player,1);rewards.push('🎴满血改摸1张');}}
  else if(roll<0.88){player.flags.extraDamage=(player.flags.extraDamage||0)+1;rewards.push('⚔️下张杀+1');}
  else{player.knowledge+=1;rewards.push('🔮额外+1学识');}
  if(isSkillQuiz){player.shield=(player.shield||0)+1;rewards.push('✨技能+1护盾');}
  if(player.combo===3){drawCards(player,1);rewards.push('🔥连击3摸1张');}
  else if(player.combo===5){player.hp=Math.min(player.maxHp,player.hp+1);player.shield=(player.shield||0)+1;rewards.push('🔥连击5回1血+1护盾');}
  else if(player.combo>=7){player.knowledge+=2;rewards.push('🔥连击'+player.combo+'学识+2');}
  if(sub&&player.subjectMastery[sub]===5){player.flags.extraDamage=(player.flags.extraDamage||0)+1;rewards.push(`🎓【${sub}精通】下张杀+1`);}
  if(rewards.length>0)rewards.forEach(r=>addPlayLog(player.name,'reward',r.replace(/^[^\s]+\s*/,''),'','reward'));
  return rewards;
}

/* ==================== 答题 ==================== */
function displayQuiz(q,player,isSkill){
  return new Promise(resolve=>{
    quizResolve=resolve;
    document.getElementById('quizIcon').textContent=SUBJECT_ICON[q.s]||'📖';
    document.getElementById('quizSubject').textContent=q.s+(isSkill?' · 技能挑战':' · 知识挑战');
    document.getElementById('quizProgress').textContent=`${G.grade} · 已答 ${quizStats.total} 题 · 正确 ${quizStats.correct} 题`;
    document.getElementById('quizKP').textContent='知识点：'+(q.kp||'综合');
    document.getElementById('quizQuestion').textContent=q.q;
    const opts=document.getElementById('quizOptions');
    opts.innerHTML=q.o.map((o,i)=>`<button class="quiz-option" data-i="${i}"><span class="tag">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</button>`).join('');
    document.getElementById('quizFeedback').textContent='';
    opts.querySelectorAll('.quiz-option').forEach(btn=>{
      btn.onclick=()=>{
        const i=Number(btn.dataset.i);const correct=i===q.a;
        opts.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(Number(b.dataset.i)===q.a)b.classList.add('correct');});
        if(!correct)btn.classList.add('wrong');
        const fb=document.getElementById('quizFeedback');
        quizStats.total++;
        if(correct){
          quizStats.correct++;
          if(player)player.knowledge+=1;
          const rewards=grantLearningReward(player,isSkill,q);
          fb.innerHTML=`✓ 答对！知识点【${q.kp||'综合'}】+1学识<br><span style="font-size:10.5px;color:#1e7a3a;">${rewards.join(' · ')}</span>`;
          fb.style.color='#1e7a3a';Sound.play('correct');
          if(player)addPlayLog(player.name,'kp',`${q.s}·${q.kp||'综合'}`,'','kp');
        } else {
          if(player)player.combo=0;
          fb.innerHTML=`✗ 正确答案是 ${String.fromCharCode(65+q.a)}<br><span style="font-size:10.5px;">知识点【${q.kp||'综合'}】</span>`;
          fb.style.color='#a02020';Sound.play('wrong');
        }
        setTimeout(()=>{document.getElementById('quizModal').classList.remove('show');if(quizResolve){const r=quizResolve;quizResolve=null;r(correct);}},1500);
      };
    });
    document.getElementById('quizModal').classList.add('show');
  });
}
function askQuiz(player,isSkill=false){const q=pickQ(player);return displayQuiz(q,player,isSkill);}
function aiQuiz(rate=0.6){return Math.random()<rate;}
function askQuizRemote(player,isSkill){
  return new Promise(resolve=>{
    const conn=NET.playerConns[player.peerId];
    if(!conn){resolve(aiQuiz(0.6));return;}
    const q=pickQ(player);
    NET.pendingQuiz={resolve,player,q};
    conn.send({type:'ask_quiz_request',question:q,isSkill});
    setTimeout(()=>{if(NET.pendingQuiz&&NET.pendingQuiz.player===player){NET.pendingQuiz=null;resolve(false);}},20000);
  });
}
async function askQuizForPlayer(player,isSkill=false){
  if(!player)return false;
  if(player.isAI)return aiQuiz(isSkill?0.62:0.6);
  const idx=G.players.indexOf(player);
  if(isLocalPlayer(idx))return await askQuiz(player,isSkill);
  if(NET.isHost&&player.peerId)return await askQuizRemote(player,isSkill);
  return aiQuiz(0.6);
}

/* ==================== 伤害 & 濒死 ==================== */
async function dealDamage(srcIdx,tgtIdx,amount,type='normal'){
  const tgt=G.players[tgtIdx];if(!tgt||!tgt.alive)return;
  let dmg=amount;
  if(hasSkill(tgt,'fuli')&&srcIdx>=0){const src=G.players[srcIdx];if(src.equip.weapon||src.equip.armor||src.equip.horsePlus||src.equip.horseMinus){dmg=Math.max(0,dmg-1);addLog(`【浮力】${tgt.name} 减免1点`,'heal');}}
  while(dmg>0&&(tgt.shield||0)>0){tgt.shield--;dmg--;addLog(`${tgt.name} 消耗1护盾抵挡1点`,'heal');floatTextFx(tgtIdx,'护盾','#4af');}
  while(dmg>0&&tgt.knowledge>=2){tgt.knowledge-=2;dmg--;addLog(`${tgt.name} 消耗2学识抵挡1点`,'heal');}
  if(dmg>0){
    await FX.slash(tgtIdx);floatTextFx(tgtIdx,'-'+dmg,'#ff3b30');Sound.play('hit');
    tgt.hp-=dmg;addPlayLog('','damage',dmg,tgt.name,'dmg');aiSpeak(tgt,'hurt');render();
    if(tgt.alive){
      if(hasSkill(tgt,'hengmei')||hasSkill(tgt,'moxuyou')){drawCards(tgt,1);addLog(`${tgt.name} 受伤摸一张牌`,'hl');}
      if(hasSkill(tgt,'hamuleite')&&srcIdx>=0){const src=G.players[srcIdx];if(src.hand.length>0){const c=src.hand[Math.floor(Math.random()*src.hand.length)];discardCard(src,c);addLog(`【哈姆雷特】${src.name} 弃一张牌`,'dmg');}}
    }
    if(tgt.hp<=0)await dyingPhase(tgtIdx,srcIdx);
  }
  render();checkWin();
}
async function dyingPhase(idx,srcIdx){
  const p=G.players[idx];if(!p.alive)return;
  while(p.hp<=0){
    if(p.isAI){
      const tao=p.hand.find(c=>c.sub==='tao');
      if(tao){discardCard(p,tao);p.hp++;addLog(`${p.name} 使用【桃】自救`,'heal');FX.healGlow(idx);continue;}
      let saved=false;
      const sorted=[...G.players].map((q,i)=>({q,i})).filter(x=>x.i!==idx&&x.q.alive&&x.q.isAI);
      sorted.sort((a,b)=>(sameFaction(b.q,p)?1:0)-(sameFaction(a.q,p)?1:0));
      for(const {q,i} of sorted){
        if(shouldSave(q,p)){const t2=q.hand.find(c=>c.sub==='tao');if(t2){discardCard(q,t2);p.hp++;addLog(`${q.name} 使用【桃】救 ${p.name}`,'heal');FX.healGlow(idx);saved=true;break;}}
      }
      if(!saved){p.alive=false;p.roleRevealed=true;addLog(`${p.name} 阵亡，身份【${ROLES[p.role].name}】`,'dmg');await FX.death(idx);break;}
    } else {
      const opts=[];
      p.hand.filter(c=>c.sub==='tao'||c.sub==='jiu').forEach(c=>opts.push({label:`【${c.name}】`,value:'card_'+c.id}));
      if(p.knowledge>=1)opts.push({label:'消耗1学识自救',value:'know'});
      if((p.shield||0)>=1)opts.push({label:'消耗1护盾自救',value:'shield'});
      opts.push({label:'放弃',value:'giveup'});
      const ch=await waitChoice(idx,opts,'rescue');
      if(ch==='giveup'){p.alive=false;p.roleRevealed=true;addLog(`${p.name} 阵亡`,'dmg');await FX.death(idx);break;}
      if(ch==='know'){p.knowledge--;p.hp++;addLog(`${p.name} 消耗学识自救`,'heal');FX.healGlow(idx);continue;}
      if(ch==='shield'){p.shield--;p.hp++;addLog(`${p.name} 消耗护盾自救`,'heal');FX.healGlow(idx);continue;}
      if(String(ch).startsWith('card_')){const id=Number(String(ch).slice(5));const c=p.hand.find(x=>x.id===id);if(c){discardCard(p,c);p.hp++;addLog(`${p.name} 使用【${c.name}】自救`,'heal');FX.healGlow(idx);continue;}}
    }
  }
  render();
}
function shouldSave(healer,target){
  const h=healer.role,t=target.role;
  if(h==='lord'||h==='loyal')return t==='lord'||t==='loyal';
  if(h==='rebel')return t==='rebel';
  return false;
}
function checkWin(){
  if(G.gameOver)return;
  const alive=G.players.filter(p=>p.alive);
  const lord=G.players.find(p=>p.role==='lord');
  const rebelsAlive=alive.some(p=>p.role==='rebel');
  const spiesAlive=alive.some(p=>p.role==='spy');
  if(!lord.alive){
    if(!rebelsAlive&&spiesAlive&&alive.length===1&&alive[0].role==='spy'){G.gameOver=true;G.winnerText='内奸获胜';}
    else{G.gameOver=true;G.winnerText='反贼获胜';}
    addLog('⚑ '+G.winnerText,'hl');Sound.play('win');return;
  }
  if(!rebelsAlive&&!spiesAlive){G.gameOver=true;G.winnerText='主公与忠臣获胜';addLog('⚑ '+G.winnerText,'hl');Sound.play('win');}
}

/* ==================== 出闪 ==================== */
async function requestShan(targetIdx,srcIdx){
  const t=G.players[targetIdx];
  if(t.isAI){
    const shan=t.hand.find(c=>c.sub==='shan');
    if(shan){discardCard(t,shan);addLog(`${t.name} 打出【闪】`);await FX.shield(targetIdx);return true;}
    if(t.knowledge>=1&&aiQuiz()){t.knowledge--;addLog(`${t.name} 消耗学识当闪`);await FX.shield(targetIdx);return true;}
    return false;
  }
  const opts=[];
  t.hand.filter(c=>c.sub==='shan').forEach(c=>opts.push({label:`【闪】${c.suit}${c.num}`,value:'card_'+c.id}));
  if(t.knowledge>=1)opts.push({label:'1学识当闪',value:'know'});
  if((t.shield||0)>=1)opts.push({label:'1护盾当闪',value:'shield'});
  opts.push({label:'答题免伤',value:'quiz'});
  opts.push({label:'承受伤害',value:'none'});
  const ch=await waitChoice(targetIdx,opts,'shan');
  if(ch==='none')return false;
  if(ch==='know'){t.knowledge--;addLog(`${t.name} 消耗学识当闪`);await FX.shield(targetIdx);return true;}
  if(ch==='shield'){t.shield--;addLog(`${t.name} 消耗护盾当闪`);await FX.shield(targetIdx);return true;}
  if(ch==='quiz'){const ok=await askQuizForPlayer(t,false);if(ok){addLog(`${t.name} 答对视为闪`,'hl');await FX.shield(targetIdx);return true;}addLog(`${t.name} 答错`,'dmg');return false;}
  if(String(ch).startsWith('card_')){const id=Number(String(ch).slice(5));const c=t.hand.find(x=>x.id===id);if(c){discardCard(t,c);addLog(`${t.name} 打出【闪】`);await FX.shield(targetIdx);return true;}}
  return false;
}

/* ==================== 出牌 ==================== */
async function useSha(attackerIdx,targetIdx){
  const a=G.players[attackerIdx],t=G.players[targetIdx];
  const hasLiannu=a.equip.weapon&&a.equip.weapon.skill==='liannu';
  if(!hasLiannu&&a.flags.shaUsed>=1){addLog('本回合已使用过【杀】');return;}
  a.flags.shaUsed=(a.flags.shaUsed||0)+1;
  addPlayLog(a.name,'use','杀',t.name);aiSpeak(a,'attack');
  FX.attackLunge(attackerIdx);Sound.play('sha');
  showPlayCard({name:'杀',suit:'♠',num:'?',type:'basic'},a.name,FACTIONS[a.faction].color);
  await FX.flyCard(attackerIdx,targetIdx,'杀','basic');
  const dodged=await requestShan(targetIdx,attackerIdx);
  if(dodged)return;
  let dmg=1;
  if(hasSkill(a,'jingzhong'))dmg+=1;
  if(a.flags.extraDamage){dmg+=a.flags.extraDamage;a.flags.extraDamage=0;}
  await dealDamage(attackerIdx,targetIdx,dmg);
}
async function useTao(idx){

}
async function useJiu(idx){
  const p=G.players[idx];p.flags.extraDamage=(p.flags.extraDamage||0)+1;
  addPlayLog(p.name,'use','酒','');
  showPlayCard({name:'酒',suit:'♠',num:'?',type:'basic'},p.name,FACTIONS[p.faction].color);

}
async function useTrick(attackerIdx,card,targetIdx){
  const a=G.players[attackerIdx];
  const tn=targetIdx!=null?G.players[targetIdx].name:'';
  addPlayLog(a.name,'use',card.name,tn);
  showPlayCard(card,a.name,FACTIONS[a.faction].color);
  if(hasSkill(a,'shicheng')||hasSkill(a,'jiaohua')){drawCards(a,1);}
  render();
  switch(card.sub){
    case 'wuzhong':{drawCards(a,2);addLog(`${a.name} 摸2张牌`);break;}
    case 'guohe':{if(targetIdx!=null)await discardTargetCard(targetIdx,attackerIdx,'弃置');break;}
    case 'shunshou':{if(targetIdx!=null)await discardTargetCard(targetIdx,attackerIdx,'获得');break;}
    case 'juedou':{
      if(targetIdx==null)break;
      let def=G.players[targetIdx],ai=attackerIdx,di=targetIdx;
      while(true){const sha=def.hand.find(c=>c.sub==='sha');if(sha){discardCard(def,sha);addLog(`${def.name} 打出【杀】`);FX.attackLunge(di);await FX.flyCard(di,ai,'杀','basic',420);[ai,di]=[di,ai];def=G.players[di];}else{await dealDamage(ai,di,1);break;}}
      break;
    }
    case 'nanman':{for(let i=0;i<G.players.length;i++){if(i===attackerIdx||!G.players[i].alive)continue;const t=G.players[i];if(hasSkill(t,'fenshu'))continue;const sha=t.hand.find(c=>c.sub==='sha');if(sha){discardCard(t,sha);addLog(`${t.name} 出杀抵挡`);}else await dealDamage(attackerIdx,i,1);}break;}
    case 'wanjian':{for(let i=0;i<G.players.length;i++){if(i===attackerIdx||!G.players[i].alive)continue;const t=G.players[i];if(hasSkill(t,'fenshu'))continue;const shan=t.hand.find(c=>c.sub==='shan');if(shan){discardCard(t,shan);addLog(`${t.name} 出闪抵挡`);await FX.shield(i);}else await dealDamage(attackerIdx,i,1);}break;}
    case 'taoyuan':{for(const p of G.players){if(p.alive&&p.hp<p.maxHp){p.hp++;addLog(`${p.name} 回复1点`,'heal');FX.healGlow(G.players.indexOf(p));}}break;}
    case 'lebu':{if(targetIdx!=null&&!hasSkill(G.players[targetIdx],'fenshu')){G.players[targetIdx].judge.push({...card,judgeType:'lebu'});addLog(`【乐不思蜀】置于 ${G.players[targetIdx].name} 判定区`);}break;}
    case 'shandian':{a.judge.push({...card,judgeType:'shandian'});addLog(`【闪电】置于 ${a.name} 判定区`);break;}
  }
  render();
}
async function discardTargetCard(targetIdx,srcIdx,mode){
  const t=G.players[targetIdx];
  if(hasSkill(t,'fenshu'))return;
  const opts=[];
  if(t.hand.length>0)opts.push({label:`手牌（${t.hand.length}张）`,value:'hand'});
  if(t.equip.weapon)opts.push({label:`武器：${t.equip.weapon.name}`,value:'weapon'});
  if(t.equip.armor)opts.push({label:`防具：${t.equip.armor.name}`,value:'armor'});
  if(t.equip.horsePlus)opts.push({label:'+1马',value:'horsePlus'});
  if(t.equip.horseMinus)opts.push({label:'-1马',value:'horseMinus'});
  if(!opts.length)return;
  const src=G.players[srcIdx];
  let ch;
  if(src.isAI)ch=opts[Math.floor(Math.random()*opts.length)].value;
  else ch=await waitChoice(srcIdx,opts,'list');
  if(ch==='hand'){
    const c=t.hand[Math.floor(Math.random()*t.hand.length)];
    discardCard(t,c,mode!=='获得');
    addLog(`${src.name} ${mode}了 ${t.name} 一张手牌`);
    if(mode==='获得')src.hand.push(c);
  } else {
    const c=t.equip[ch];
    if(c){t.equip[ch]=null;if(mode==='获得')src.hand.push(c);else G.discard.push(c);addLog(`${src.name} ${mode}了 ${t.name} 的【${c.name}】`);}
  }
  render();
  if(NET.isHost)scheduleSync();
}

/* ==================== 主动技能 ==================== */
async function useActiveSkill(idx,skillId){
  const p=G.players[idx];
  if(p.flags.skillUsed){addLog('本回合已使用过主动技能');return;}
  p.flags.skillUsed=true;
  const sk=p.skills.find(s=>s.id===skillId);if(!sk)return;
  const isLord=Object.values(FACTIONS).some(f=>f.lordSkill.id===skillId);
  addLog(isLord?`【主公技·${sk.name}】${p.name} 发起挑战…`:`【${sk.name}】${p.name} 发起挑战…`,'hl');
  render();
  const ok=await askQuizForPlayer(p,true);
  if(!ok){addLog(`${p.name} 知识不足，【${sk.name}】失败`,'dmg');floatTextFx(idx,'技能失败','#8a8070');render();if(NET.isHost)syncStateToClients();return;}
  addPlayLog(p.name,'skill',sk.name,'');aiSpeak(p,'skill');FX.skillWave(idx);
  showPlayCard({name:sk.name,suit:'✦',num:'',type:'trick'},p.name,FACTIONS[p.faction].color);
  
  // 简化技能实现
  switch(skillId){
