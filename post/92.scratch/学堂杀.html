/* ==================== 回合流程 ==================== */
async function runTurn(idx){
  const p=G.players[idx];if(!p.alive)return;
  p.flags.shaUsed=0;p.flags.skillUsed=false;p.flags.noSha=false;G.current=idx;
  addLog(`—— ${p.name}（${FACTIONS[p.faction].name}）的回合 ——`,'hl');
  if(p.isAI)aiSpeak(p,'idle');
  render();
  await judgePhase(p);
  let drawN=2;
  if(hasSkill(p,'youxuan'))drawN+=1;
  drawCards(p,drawN);
  addLog(`${p.name} 摸 ${drawN} 张牌`);
  if(hasSkill(p,'youxuan')&&p.hand.length>0){discardCard(p,p.hand[0]);}
  render();
  if(p.isAI){
    if(aiQuiz(0.6)){const ok=await askQuizForPlayer(p,false);if(ok){drawCards(p,1);addLog(`${p.name} 参悟成功`,'hl');}}
  } else {
    const ch=await waitChoice(idx,[{label:'参悟答题（答对多摸1张+奖励）',value:'quiz'},{label:'跳过',value:'skip'}],'list');
    if(ch==='quiz'){
      const ok=await askQuizForPlayer(p,false);
      if(ok){drawCards(p,1);addLog(`${p.name} 参悟成功`,'hl');}else addLog(`${p.name} 参悟失败`,'dmg');
    }
  }
  render();
  if(p.alive&&!p.flags.skipPlay)await playPhase(idx);
  if(p.alive)await discardPhase(p);
  render();
}
async function judgePhase(p){
  if(!p.judge.length)return;
  for(let i=p.judge.length-1;i>=0;i--){
    const j=p.judge[i];if(!j.judgeType)continue;
    p.judge.splice(i,1);
    const card=G.deck.pop()||C('判定','basic','none','♠',1);
    addLog(`${p.name} 判定：${card.suit}${card.num}`,'hl');
    await FX.judge(G.players.indexOf(p),card);
    if(j.judgeType==='lebu'){
      if(card.suit!=='♥'){p.flags.skipPlay=true;addLog('【乐不思蜀】生效','dmg');}
      else addLog('乐不思蜀失效');
      G.discard.push(card);
    } else if(j.judgeType==='shandian'){
      if(card.suit==='♠'&&card.num>=2&&card.num<=9){addLog('【闪电】命中！','dmg');G.discard.push(card);await dealDamage(-1,G.players.indexOf(p),3,'thunder');}
      else{addLog('闪电未命中');const next=(G.players.indexOf(p)+1)%G.players.length;G.players[next].judge.push({...j});G.discard.push(card);}
    }
    if(!p.alive)break;
  }
  render();
}
async function playPhase(idx){
  const p=G.players[idx];
  if(p.isAI){await aiPlayPhase(idx);return;}
  while(p.alive&&!G.gameOver){
    const opts=[];
    for(const c of p.hand){
      if(c.sub==='sha')opts.push({label:`【杀】${c.suit}${c.num}`,value:'sha_'+c.id});
      else if(c.sub==='tao'&&p.hp<p.maxHp)opts.push({label:`【桃】`,value:'tao_'+c.id});
      else if(c.sub==='jiu')opts.push({label:`【酒】`,value:'jiu_'+c.id});
      else if(c.type==='trick')opts.push({label:`【${c.name}】`,value:'trick_'+c.id});
      else if(c.type==='equip')opts.push({label:`【${c.name}】`,value:'equip_'+c.id});
    }
    if(!p.flags.skillUsed){
      p.skills.forEach(s=>{if(s.type==='active'){
        const isLord=Object.values(FACTIONS).some(f=>f.lordSkill.id===s.id);
        opts.push({label:`▶${isLord?'主公技·':''}${s.name}（需答题）`,value:'skill_'+s.id,skill:true,lord:isLord});
      }});
    }
    opts.push({label:'结束出牌',value:'end'});
    const ch=await waitChoice(idx,opts,'play');
    if(ch==='end'||!ch)break;
    if(!p.alive||G.gameOver)break;
    if(String(ch).startsWith('skill_')){await useActiveSkill(idx,String(ch).slice(6));continue;}
    const [kind,idStr]=String(ch).split('_');const id=Number(idStr);
    const card=p.hand.find(c=>c.id===id);if(!card)continue;
    if(kind==='sha'){
      if(p.flags.noSha){addLog('本回合不能使用【杀】');continue;}
      const targets=[];
      for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(inRange(idx,i))targets.push({label:`攻击 ${G.players[i].name}`,value:i});}
      if(!targets.length){addLog('攻击范围内无目标');continue;}
      targets.push({label:'取消',value:-1});
      const t=await waitChoice(idx,targets,'target');
      if(t<0)continue;
      discardCard(p,card);await useSha(idx,t);
    } else if(kind==='tao'){discardCard(p,card);await useTao(idx);}
    else if(kind==='jiu'){discardCard(p,card);await useJiu(idx);}
    else if(kind==='trick'){
      let tgt=null;
      if(['guohe','shunshou','juedou','lebu'].includes(card.sub)){
        const targets=[];
        for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(card.sub==='shunshou'&&distBetween(idx,i)>1)continue;if(hasSkill(G.players[i],'fenshu'))continue;targets.push({label:G.players[i].name,value:i});}
        if(!targets.length){addLog('无合法目标');continue;}
        targets.push({label:'取消',value:-1});
        const t=await waitChoice(idx,targets,'target');if(t<0)continue;tgt=t;
      }
      discardCard(p,card);await useTrick(idx,card,tgt);
    } else if(kind==='equip'){
      discardCard(p,card,false);
      showPlayCard(card,p.name,FACTIONS[p.faction].color);addPlayLog(p.name,'use',card.name,'');
      if(card.sub==='weapon'){if(p.equip.weapon)G.discard.push(p.equip.weapon);p.equip.weapon=card;}
      else if(card.sub==='armor'){if(p.equip.armor)G.discard.push(p.equip.armor);p.equip.armor=card;}
      else if(card.sub==='horse+'){if(p.equip.horsePlus)G.discard.push(p.equip.horsePlus);p.equip.horsePlus=card;}
      else if(card.sub==='horse-'){if(p.equip.horseMinus)G.discard.push(p.equip.horseMinus);p.equip.horseMinus=card;}
      addLog(`${p.name} 装备【${card.name}】`);render();
      if(NET.isHost)scheduleSync();
    }
    if(!p.alive||G.gameOver)break;
  }
}
async function discardPhase(p){
  const limit=handLimit(p);
  while(p.hand.length>limit&&p.hand.length>0){
    if(p.isAI){const c=p.hand.pop();G.discard.push(c);}
    else {
      const opts=p.hand.map(c=>({label:c.name,value:c.id}));
      if(!opts.length)break;
      const ch=await waitChoice(G.players.indexOf(p),opts,'discard');
      const cid=typeof ch==='number'?ch:Number(ch);
      const c=p.hand.find(x=>x.id===cid);
      if(c){discardCard(p,c);addLog(`${p.name} 弃置【${c.name}】`);}
      else break;
    }
  }
  render();
}

/* ==================== AI ==================== */
async function aiPlayPhase(idx){
  const p=G.players[idx];
  if(!p.flags.skillUsed&&p.skills.some(s=>s.type==='active')&&Math.random()<0.5){
    const act=p.skills.find(s=>s.type==='active');
    await useActiveSkill(idx,act.id);await sleep(400);
  }
  let equipChanged=false;
  for(const c of [...p.hand]){
    if(c.type==='equip'&&p.alive){
      discardCard(p,c,false);showPlayCard(c,p.name,FACTIONS[p.faction].color);addPlayLog(p.name,'use',c.name,'');
      if(c.sub==='weapon'){if(p.equip.weapon)G.discard.push(p.equip.weapon);p.equip.weapon=c;}
      else if(c.sub==='armor'){if(p.equip.armor)G.discard.push(p.equip.armor);p.equip.armor=c;}
      else if(c.sub==='horse+'){if(p.equip.horsePlus)G.discard.push(p.equip.horsePlus);p.equip.horsePlus=c;}
      else if(c.sub==='horse-'){if(p.equip.horseMinus)G.discard.push(p.equip.horseMinus);p.equip.horseMinus=c;}
      addLog(`${p.name} 装备【${c.name}】`);equipChanged=true;await sleep(300);
    }
  }
  if(equipChanged&&NET.isHost)syncStateToClients();
  while(p.hp<p.maxHp&&p.alive){const tao=p.hand.find(c=>c.sub==='tao');if(!tao)break;discardCard(p,tao);await useTao(idx);await sleep(300);}
  const wz=p.hand.find(c=>c.sub==='wuzhong');if(wz){discardCard(p,wz);await useTrick(idx,wz,null);await sleep(300);}
  if(p.alive&&!p.flags.noSha&&p.flags.shaUsed<1){
    const sha=p.hand.find(c=>c.sub==='sha');
    if(sha){const ts=[];for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(inRange(idx,i)&&isEnemy(p,G.players[i]))ts.push(i);}if(ts.length>0){discardCard(p,sha);await useSha(idx,ts[0]);await sleep(300);}}
  }
  render();
}
function isEnemy(a,b){
  if(a.role==='lord'||a.role==='loyal')return b.role==='rebel'||b.role==='spy';
  if(a.role==='rebel')return b.role==='lord'||b.role==='loyal';
  if(a.role==='spy'){const ra=G.players.filter(p=>p.alive&&p.role==='rebel').length;if(ra>0)return b.role==='rebel';return b.role==='lord'||b.role==='loyal';}
  return false;
}

/* ==================== 主循环 ==================== */
async function gameLoop(){
  while(!G.gameOver){
    const p=G.players[G.current];
    if(p.alive)await runTurn(G.current);
    if(G.gameOver)break;
    let next=G.current;
    for(let k=1;k<=G.players.length;k++){const idx=(G.current+k)%G.players.length;if(G.players[idx].alive){next=idx;break;}}
    G.current=next;await sleep(200);
  }
  render();
}

/* ==================== 启动 ==================== */
function setupPlayers(playerCount,localChar,localName){
  const roleDeck=[...ROLE_CONFIG[playerCount]];
  const available=[...new Set(roleDeck)];
  let myRole;
  if(SELECTED_ROLE!=='random'&&available.includes(SELECTED_ROLE))myRole=SELECTED_ROLE;
  else myRole=roleDeck[Math.floor(Math.random()*roleDeck.length)];
  const rem=[...roleDeck];rem.splice(rem.indexOf(myRole),1);shuffle(rem);
  const roles=[myRole,...rem];
  const aiChars=CHARACTERS.filter(c=>c.id!==localChar.id);shuffle(aiChars);
  G.players=[];G.grade=SELECTED_GRADE;G.playerCount=playerCount;G.gameOver=false;G.winnerText='';
  G.deck=buildDeck();G.discard=[];quizStats={total:0,correct:0};playLog=[];chatMessages=[];
  Object.keys(ROLE_MARKS).forEach(k=>delete ROLE_MARKS[k]);
  
  const newPlayer=(id,name,char,role,isAI,peerId)=>{
    let skills=[...char.skills];
    if(role==='lord'){const ls=FACTIONS[char.faction].lordSkill;if(!skills.some(s=>s.id===ls.id))skills.push({...ls});}
    return{id,name,avatar:char.avatar,subject:char.subject,charId:char.id,faction:char.faction,role,roleRevealed:role==='lord',
      hp:role==='lord'?char.hp+1:char.hp,maxHp:role==='lord'?char.hp+1:char.hp,
      hand:[],equip:{weapon:null,armor:null,horsePlus:null,horseMinus:null},judge:[],
      knowledge:0,shield:0,combo:0,maxCombo:0,subjectMastery:{},alive:true,isAI,skills,peerId:peerId||null,
      flags:{shaUsed:0,skillUsed:false,extraDamage:0,skipPlay:false,noSha:false}};
  };
  G.players.push(newPlayer(0,localName,localChar,roles[0],false,NET.isHost?NET.myPeerId:null));
  const remoteIds=NET.isHost?Object.keys(NET.playerConns):[];
  for(let i=1;i<playerCount;i++){
    let name,char,isAI,peerId;
    if(i-1<remoteIds.length){const conn=NET.playerConns[remoteIds[i-1]];name=conn?.metadata?.name||'玩家'+i;peerId=remoteIds[i-1];char=aiChars[(i-1)%aiChars.length];isAI=false;}
    else{name='AI·'+aiChars[(i-1)%aiChars.length].name;char=aiChars[(i-1)%aiChars.length];isAI=true;peerId=null;}
    G.players.push(newPlayer(i,name,char,roles[i],isAI,peerId));
  }
  G.players.forEach(p=>drawCards(p,4));
  G.current=G.players.findIndex(p=>p.role==='lord');
  if(G.current<0)G.current=0;
  G.myPlayerIdx=0;G.started=true;
}

async function createRoom(){
  const nick=(document.getElementById('nicknameInput').value||'房主').trim().slice(0,12);
  const code=String(Math.floor(100000+Math.random()*900000));
  document.getElementById('roomInfo').innerHTML='正在连接…';
  try{
    await NET.createRoom(code,nick);
    NET.addRoomMember(NET.myPeerId,nick,true);
    updateHostRoomInfo({roomCode:code,hostName:nick,members:[{name:nick,isHost:true}],currentCount:1,targetCount:SELECTED_COUNT});
  }catch(e){document.getElementById('roomInfo').innerHTML='<span style="color:#e74c3c;">连接失败：'+e.type+'</span>';}
}
async function hostStartGame(){
  Sound.init();pickRandomCharIfNotChosen();
  const localChar=SELECTED_CHAR;
  const nick=(document.getElementById('nicknameInput').value||'房主').trim().slice(0,12);
  const rc=Object.keys(NET.playerConns).length;
  if(rc+1>SELECTED_COUNT){alert('已连接玩家超过目标人数');return;}
  NET.mode='host';NET.isHost=true;
  setupPlayers(SELECTED_COUNT,localChar,nick);
  const remotePlayers=G.players.filter(p=>!p.isAI&&p.peerId!==NET.myPeerId);
  remotePlayers.forEach(p=>{const idx=G.players.indexOf(p);NET.sendToPlayer(p.peerId,{type:'start_game',players:G.players,myPlayerIdx:idx,grade:G.grade,playerCount:SELECTED_COUNT});});
  document.getElementById('screenLobby').classList.remove('active');
  document.getElementById('screenGame').classList.add('active');
  clearPlayZone();
  document.getElementById('chatPanel').style.display='flex';
  addLog(`游戏开始（${G.grade}）。你是 ${FACTIONS[localChar.faction].name} 阵营 ${ROLES[G.players[0].role].name}。`,'hl');
  addChat('系统','欢迎来到学堂杀联机房！','sys');render();
  if(G.players[1])setTimeout(()=>aiSpeak(G.players[1],'greet'),1500);
  gameLoop();
}
async function joinRoom(){
  const nick=(document.getElementById('joinNick').value||'玩家').trim().slice(0,12);
  const code=(document.getElementById('joinCode').value||'').trim();
  if(!/^\d{6}$/.test(code)){alert('请输入6位数字房间号');return;}
  document.getElementById('joinStatus').textContent='正在连接房间…';
  try{
    await NET.joinRoom(code,nick);
    document.getElementById('chatPanel').style.display='flex';
  }catch(e){document.getElementById('joinStatus').innerHTML='<span style="color:#e74c3c;">连接失败：'+e.type+'</span>';}
}
function leaveRoom(){
  if(NET.mode!=='join')return;
  if(!confirm('确认退出房间？'))return;
  try{if(NET.myConn)NET.myConn.send({type:'leave_room',name:NET_PLAYER_NAMES[NET.myPeerId]||'玩家'});}catch(e){}
  setTimeout(()=>{try{if(NET.myConn)NET.myConn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}location.reload();},150);
}
function closeRoom(){
  if(!NET.isHost)return;
  if(!confirm('确认关闭房间？所有玩家会被通知。'))return;
  try{NET.broadcast({type:'host_closed'});}catch(e){}
  setTimeout(()=>{try{if(NET.peer)NET.peer.destroy();}catch(e){}location.reload();},400);
}

/* ==================== 大厅 UI ==================== */
let SELECTED_GRADE='初二上';
let SELECTED_COUNT=4;
let SELECTED_CHAR=null;
let SELECTED_FACTION='chinese';
let SELECTED_MODE='single';
let USER_CHOSEN=false;
let SELECTED_ROLE='random';

function renderGradePicker(){
  const grid=document.getElementById('gradePicker');if(!grid)return;
  const grades=sortedGrades();
  if(!grades.length){grid.innerHTML='<span style="color:var(--muted);font-size:11px;">题库为空，请先导入题库</span>';return;}
  if(!grades.includes(SELECTED_GRADE))SELECTED_GRADE=grades[0];
  grid.innerHTML=grades.map(g=>{
    const n=(QUESTION_BANK[g]||[]).length;
    return `<button class="opt-btn ${g===SELECTED_GRADE?'active':''}" data-grade="${g}">${g}<small>${n}题</small></button>`;
  }).join('');
}

function getAvailableRoles(count){
  const deck=ROLE_CONFIG[count]||ROLE_CONFIG[4];
  return [...new Set(deck)];
}
function renderRolePicker(){
  const grid=document.getElementById('rolePicker');if(!grid)return;
  const roles=getAvailableRoles(SELECTED_COUNT);
  let html=`<div class="role-card ${SELECTED_ROLE==='random'?'selected':''}" style="border-color:#8a6d3b;color:#8a6d3b;" onclick="selectRole('random')"><div class="r-icon">🎲</div><div class="r-name">随机</div></div>`;
  roles.forEach(r=>{
    const info=ROLES[r];const tip=r==='lord'?'（身份公开+1体力+主公技）':'';
    html+=`<div class="role-card ${SELECTED_ROLE===r?'selected':''}" style="border-color:${info.color};color:${info.color};" title="${info.name}${tip}" onclick="selectRole('${r}')"><div class="r-icon">${ROLE_ICON[r]||'❓'}</div><div class="r-name">${info.name}</div></div>`;
  });
  grid.innerHTML=html;
}
function selectRole(r){Sound.play('click');SELECTED_ROLE=r;renderRolePicker();}

document.getElementById('gradePicker').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');
  document.querySelectorAll('#gradePicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  SELECTED_GRADE=b.dataset.grade;
});
document.getElementById('playerCountPicker').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');
  document.querySelectorAll('#playerCountPicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  SELECTED_COUNT=Number(b.dataset.count);updateAIHint();renderRolePicker();
});
document.getElementById('modePicker').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');
  document.querySelectorAll('#modePicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  SELECTED_MODE=b.dataset.mode;updateLobbyMode();
});
function updateLobbyMode(){
  const hc=document.getElementById('hostConfig');
  const jc=document.getElementById('joinConfig');
  const sb=document.getElementById('startBtn');
  const rc=document.getElementById('roomConfig');
  if(SELECTED_MODE==='single'){hc.style.display='block';jc.style.display='none';if(rc)rc.style.display='none';sb.textContent='开始单机对局';sb.onclick=startSingle;sb.style.display='block';}
  else if(SELECTED_MODE==='host'){hc.style.display='block';jc.style.display='none';if(rc)rc.style.display='block';sb.style.display='none';}
  else{hc.style.display='none';jc.style.display='block';sb.style.display='none';}
}
function updateAIHint(){const h=document.getElementById('aiCountHint');if(h)h.textContent=`将补充 ${SELECTED_COUNT-1} 名 AI`;}
function renderFactionPicker(){
  const grid=document.getElementById('factionPicker');
  grid.innerHTML=Object.entries(FACTIONS).map(([k,f])=>`
    <div class="faction-card ${k===SELECTED_FACTION?'selected':''}" style="border-color:${f.color};color:${f.color};${k===SELECTED_FACTION?'box-shadow:0 0 16px '+f.color:''}" data-faction="${k}" onclick="selectFaction('${k}')">
      <div class="f-icon">${f.icon}</div>
      <div class="f-name" style="color:${f.color};">${f.name}</div>
      <div class="f-desc">主公技：${f.lordSkill.name}</div>
    </div>`).join('');
}
function selectFaction(k){
  Sound.play('click');USER_CHOSEN=true;SELECTED_FACTION=k;renderFactionPicker();
  const chars=CHARACTERS.filter(c=>c.faction===k);
  if(chars.length>0&&(!SELECTED_CHAR||SELECTED_CHAR.faction!==k))SELECTED_CHAR=chars[0];
  renderCharPicker();
}
function renderCharPicker(){
  const grid=document.getElementById('charGrid');
  const chars=CHARACTERS.filter(c=>c.faction===SELECTED_FACTION);
  if(!chars.length){grid.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;">该阵营暂无角色</div>';return;}
  if(!SELECTED_CHAR||SELECTED_CHAR.faction!==SELECTED_FACTION)SELECTED_CHAR=chars[0];
  grid.innerHTML=chars.map(c=>{
    const f=FACTIONS[c.faction];const sel=SELECTED_CHAR&&SELECTED_CHAR.id===c.id;
    return `<div class="char-card ${sel?'selected':''}" style="border-color:${f.color};color:${f.color};${sel?'box-shadow:0 0 16px '+f.color:''}" data-id="${c.id}" onclick="selectChar('${c.id}')">
      <div class="faction-badge" style="color:${f.color};">${f.icon}</div>
      <div class="ctop"><span class="cavatar">${c.avatar}</span><div><div class="cname" style="color:${f.color};">${c.name}</div><div class="ctitle">${c.title}</div></div></div>
      <div class="csubject" style="color:${f.color};">${f.name} · 体力${c.hp}</div>
      <div class="cskill">${c.skills.map(s=>`<b>${s.name}</b>：${s.desc}`).join('<br>')}</div>
    </div>`;
  }).join('');
}
function selectChar(id){Sound.play('click');USER_CHOSEN=true;SELECTED_CHAR=CHARACTERS.find(c=>c.id===id);renderCharPicker();}

/* ==================== 渲染 ==================== */
const EQUIP_ICON={weapon:'⚔️',armor:'🛡️',horsePlus:'🐎',horseMinus:'🐎'};
const EQUIP_LABEL={weapon:'武器',armor:'防具',horsePlus:'+1马',horseMinus:'-1马'};
const JUDGE_ICON={lebu:'🎋',shandian:'⚡'};

function buildPlayerCard(p,i){
  const isTurn=i===G.current;
  const roleColor=p.roleRevealed?ROLES[p.role].color:'#5a4a3a';
  const faction=FACTIONS[p.faction];const fColor=faction.color;
  const hpGems=Array.from({length:p.maxHp},(_,k)=>{const f=k<p.hp;const low=p.hp<=1&&f;return `<span class="hp-gem ${f?'':'empty'} ${low?'low':''}"></span>`;}).join('');
  const equipSlots=['weapon','armor','horsePlus','horseMinus'].map(k=>{
    const eq=p.equip[k];const f=!!eq;const tip=f?eq.name:EQUIP_LABEL[k]+'（空）';const short=f?(EQUIP_SHORT[eq.name]||eq.name.slice(0,1)):'';
    return `<div class="equip-slot ${f?'filled':''}" title="${tip}"><span class="eq-icon">${EQUIP_ICON[k]}</span>${f?`<span class="eq-short">${short}</span>`:''}</div>`;
  }).join('');
  const equipNames=[];['weapon','armor','horsePlus','horseMinus'].forEach(k=>{if(p.equip[k])equipNames.push(p.equip[k].name);});
  const equipNamesHtml=equipNames.length?`<div class="pequip-names" title="${equipNames.join(' · ')}">${equipNames.join(' · ')}</div>`:'<div class="pequip-names"></div>';
  const handCount=p.hand.length;const dispCount=Math.min(handCount,4);
  const miniCards=Array.from({length:dispCount},()=>'<div class="mini-card"></div>').join('');
  const judgeTags=p.judge.map(j=>`<span class="judge-tag">${JUDGE_ICON[j.judgeType]||'❓'}${j.name}</span>`).join('');
  const isSelf=(i===G.myPlayerIdx);
  const aiTag=p.isAI?'<span style="font-size:8px;color:#8a8070;">[AI]</span>':'';
  let badges='';
  if((p.shield||0)>0)badges+=`<span class="badge badge-shield">🛡️${p.shield}</span>`;
  if((p.combo||0)>=2)badges+=`<span class="badge badge-combo">⚡${p.combo}</span>`;
  // 身份标记
  const mark=ROLE_MARKS[i];
  const markHtml=mark?`<div class="p-mark-label" style="color:${ROLES[mark].color}">${ROLE_ICON[mark]} ${ROLES[mark].name}</div>`:'';
  const markBtn=isSelf?'':`<button class="p-mark-btn" title="标记身份" onclick="event.stopPropagation();openMarkMenu(${i})">🏷️</button>`;
  return `<div class="p-card ${!p.alive?'dead':''} ${isTurn?'turn':''} ${isSelf?'is-self':''}" style="--faction-color:${fColor};">
    <div class="faction-icon" style="border-color:${fColor};color:${fColor};">${faction.icon}</div>
    ${markBtn}
    ${markHtml}
    <div class="pheader"><div class="pavatar" style="border-color:${fColor};">${p.avatar}</div><div class="pname-block"><div class="pname">${p.name} ${aiTag}</div><div class="prole" style="color:${roleColor}">${p.roleRevealed?'【'+ROLES[p.role].name+'】':'身份未知'} · <span style="color:${fColor};">${faction.name}</span></div></div></div>
    <div class="pknow">🔮${p.knowledge}</div>
    <div class="php-bar">${hpGems}</div>
    <div class="pequip-slots">${equipSlots}</div>
    ${equipNamesHtml}
    <div class="pfooter"><div class="hand-pile">${miniCards}<span class="hand-count">${handCount}</span></div></div>
    <div class="p-badges">${badges}</div>
    ${judgeTags?`<div class="pjudge-row">${judgeTags}</div>`:''}
  </div>`;
}
function seatPos(rel,total){const angle=90-(rel*360/total);const rad=angle*Math.PI/180;return{x:50+38*Math.cos(rad),y:50+36*Math.sin(rad)};}
function renderSeats(){
  const ring=document.getElementById('seatRing');if(!ring)return;
  const total=G.players.length;
  const isMobile=window.innerWidth<=600;
  const targetValues=new Set();
  if(G.targetSelectable&&G.pendingOptions){G.pendingOptions.forEach(o=>{if(typeof o.value==='number'&&o.value>=0&&o.value<total)targetValues.add(o.value);});}
  let html='';
  G.players.forEach((p,i)=>{
    const isTarget=targetValues.has(i);
    const clickAttr=isTarget?`onclick="clickTargetSeat(${i})"`:'';
    const cls=isTarget?'seat seat-targetable':'seat';
    if(isMobile){html+=`<div class="${cls}" data-idx="${i}" ${clickAttr}>${buildPlayerCard(p,i)}</div>`;}
    else{const rel=(i-G.myPlayerIdx+total)%total;const pos=seatPos(rel,total);html+=`<div class="${cls}" data-idx="${i}" ${clickAttr} style="left:${pos.x}%;top:${pos.y}%;">${buildPlayerCard(p,i)}</div>`;}
  });
  ring.innerHTML=html;
}
function render(){
  if(!G.started)return;
  const me=G.players[G.myPlayerIdx];if(!me)return;
  let hintText='';let btnHtml='';let hintClass='';
  G.pendingOptions&&(G.pendingPlayer===G.myPlayerIdx)?(G.handClickable=true):(G.handClickable=false);
  G.targetSelectable=false;
  
  if(G.gameOver){
    hintText=`<span style="color:var(--gold);font-size:15px">${G.winnerText}</span>`;
    G.handClickable=false;
  } else if(G.pendingOptions&&G.pendingPlayer===G.myPlayerIdx){
    const type=G.pendingType;
    if(type==='play'){
      hintText='💡 点击手牌出牌 · 点击技能（需答题） · 或结束出牌';hintClass='hint-play';
      const skillBtns=G.pendingOptions.filter(o=>typeof o.value==='string'&&o.value.startsWith('skill_'));
      skillBtns.forEach(o=>{btnHtml+=`<button class="btn btn-sm ${o.lord?'btn-lord':'btn-skill'}" onclick="handleLocalChoice('${o.value}')">${o.label}</button>`;});
      if(G.pendingOptions.some(o=>o.value==='end'))btnHtml+=`<button class="btn btn-sm" onclick="handleLocalChoice('end')">结束出牌</button>`;
    } else if(type==='discard'){
      const need=Math.max(0,me.hand.length-handLimit(me));
      hintText=`🗑️ 点击手牌弃置（还需弃 ${need} 张）`;hintClass='hint-play';
    } else if(type==='rescue'){
      hintText='💔 濒死！点击手牌【桃】/【酒】自救';hintClass='hint-urgent';
      const others=G.pendingOptions.filter(o=>!String(o.value).startsWith('card_'));
      btnHtml=others.map(o=>`<button class="btn btn-sm" onclick="handleLocalChoice('${o.value}')">${o.label}</button>`).join('');
    } else if(type==='shan'){
      hintText='🛡️ 需要出【闪】！点击手牌中的【闪】';hintClass='hint-urgent';
      const others=G.pendingOptions.filter(o=>!String(o.value).startsWith('card_'));
      btnHtml=others.map(o=>`<button class="btn btn-sm" onclick="handleLocalChoice('${o.value}')">${o.label}</button>`).join('');
    } else if(type==='target'){
      hintText='🎯 点击座位卡选择目标';hintClass='hint-target';
      if(G.pendingOptions.some(o=>o.value===-1))btnHtml+=`<button class="btn btn-sm" onclick="handleLocalChoice(-1)">取消</button>`;
      G.targetSelectable=true;G.handClickable=false;
    } else {
      hintText='请选择：';
      btnHtml=G.pendingOptions.map(o=>{const v=typeof o.value==='number'?o.value:`'${o.value}'`;return `<button class="btn btn-sm ${o.skill?'btn-skill':''}" onclick="handleLocalChoice(${v})">${o.label}</button>`;}).join('');
      G.handClickable=false;
    }
  } else if(G.pendingOptions&&G.pendingPlayer!==G.myPlayerIdx){
    const other=G.players[G.pendingPlayer];
    hintText=`等待 ${other?.name||'?'} 选择中…`;
  } else if(G.players[G.current]&&G.players[G.current].isAI){
    hintText=`等待 ${G.players[G.current].name} 行动…`;
  } else if(G.players[G.current]===me){hintText='请稍候…';}
  else{hintText=`等待 ${G.players[G.current].name} 行动…`;}
  
  document.getElementById('turnName').textContent=G.players[G.current]?.name||'—';
  // 更新身份徽章
  const roleBadge=document.getElementById('selfRoleBadge');
  if(roleBadge&&me){
    const roleInfo=ROLES[me.role];
    roleBadge.textContent=`${ROLE_ICON[me.role]} ${roleInfo.name}`;
    roleBadge.className='self-role-badge '+me.role;
  }
  document.getElementById('connInfo').innerHTML=NET.mode==='host'?`房间 ${NET.roomCode}`:NET.mode==='join'?'已连接':'';
  
  renderSeats();
  
  const hand=document.getElementById('handRow');
  hand.innerHTML=me.hand.map(c=>{
    const color=(c.suit==='♥'||c.suit==='♦')?'red':'black';
    let cardCls='';let onclick='';
    if(G.handClickable&&isCardClickable(c)){cardCls='clickable '+cardClickHint(c);onclick=`onclick="clickHandCard(${c.id})"`;}
    else if(G.handClickable)cardCls='disabled';
    return `<div class="card ${color} ${cardCls}" ${onclick}><span class="suit">${c.suit}</span><span class="num">${c.num}</span><span class="cname">${c.name}</span><span class="ctype">${c.type==='basic'?'基本':c.type==='trick'?'锦囊':'装备'}</span></div>`;
  }).join('')||'<div style="color:var(--muted);font-size:12px;padding:20px">无手牌</div>';
  
  const hintEl=document.getElementById('actionHint');
  hintEl.innerHTML=hintText;
  hintEl.className='action-hint '+(hintClass||'');
  document.getElementById('actionBtns').innerHTML=btnHtml;
  document.getElementById('deckCount').textContent=G.deck.length||0;
  document.getElementById('discardCount').textContent=G.discard.length||0;
  
  const chatPanel=document.getElementById('chatPanel');
  if(chatPanel)chatPanel.style.display=(NET.mode==='single')?'none':'flex';
  
  if(NET.isHost&&NET.mode==='host'&&G.started)scheduleSync();
}

SELECTED_CHAR=CHARACTERS.find(c=>c.faction===SELECTED_FACTION);
