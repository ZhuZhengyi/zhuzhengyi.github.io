<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学堂杀 · 圆桌联机版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--gold:#f5c542;--gold-dim:#8a6d3b;--parch:#f7f0dd;--parch2:#e8dcc0;--ink:#2a1f0f;--red:#c0392b;--green:#27ae60;--text:#e8e0d0;--muted:#a89880;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 0%,#4a2218,#2a1210 45%,#120604);background-attachment:fixed;color:var(--text);font-family:"PingFang SC","Microsoft YaHei",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);pointer-events:none;z-index:0}
h1{font-size:22px;color:var(--gold);letter-spacing:8px;text-shadow:0 0 18px rgba(245,197,66,.5),0 2px 0 #000;margin-bottom:2px;position:relative;z-index:1}
.subtitle{font-size:10px;color:var(--gold-dim);letter-spacing:3px;margin-bottom:8px;position:relative;z-index:1}
.screen{display:none;width:100%;max-width:1180px;position:relative;z-index:1}
.screen.active{display:block}
.sound-toggle{position:fixed;top:8px;right:8px;z-index:50;background:linear-gradient(160deg,#2a1a10,#160a06);border:2px solid var(--gold-dim);color:var(--gold);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sound-toggle.muted{opacity:.5;color:var(--muted)}
.panel{background:linear-gradient(160deg,#2a1610,#1a0c08);border:1px solid var(--gold-dim);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.panel h3{font-size:13px;color:var(--gold);margin-bottom:8px;letter-spacing:2px}
.opt-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.opt-btn{flex:1;min-width:70px;background:linear-gradient(160deg,#2a1a10,#160a06);border:2px solid var(--gold-dim);color:var(--muted);padding:8px 4px;border-radius:7px;cursor:pointer;font-size:12px;transition:all .2s;font-family:inherit;text-align:center}
.opt-btn:hover{border-color:var(--gold);color:var(--gold)}
.opt-btn.active{background:linear-gradient(160deg,#5a3a10,#3a1a06);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.4)}
.opt-btn small{display:block;font-size:9px;margin-top:2px;opacity:.7}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:340px;overflow-y:auto;padding-right:4px}
.char-card{background:linear-gradient(160deg,#2a1a10,#120804);border:2px solid var(--gold-dim);border-radius:8px;padding:6px;cursor:pointer;transition:all .2s}
.char-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.char-card.selected{border-color:var(--gold);box-shadow:0 0 16px rgba(245,197,66,.6)}
.char-card .ctop{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.char-card .cavatar{font-size:22px}
.char-card .cname{font-size:12px;color:var(--gold);font-weight:600}
.char-card .ctitle{font-size:9px;color:var(--muted)}
.char-card .csubject{font-size:9px;color:#c8b088;margin-bottom:3px}
.char-card .cskill{font-size:8px;color:#a89880;line-height:1.4;border-top:1px solid #3a2a1a;padding-top:3px}
.char-card .cskill b{color:var(--gold);font-size:9px}
.input-row{display:flex;gap:6px;margin-bottom:6px}
.input-row input{flex:1;background:#0a0402;border:1px solid var(--gold-dim);color:var(--text);border-radius:5px;padding:7px 10px;font-size:12px;font-family:inherit}
.input-row input:focus{outline:none;border-color:var(--gold)}
.lobby-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn-lg{font-size:14px;padding:10px 24px}
.btn{background:linear-gradient(160deg,#2a1a10,#160a06);color:#d8c8a8;border:1px solid var(--gold-dim);border-radius:5px;padding:6px 11px;font-size:11.5px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-accent{background:linear-gradient(160deg,#8a2018,#5a1008);border-color:#e74c3c;color:#ffe0d0}
.btn-accent:hover{border-color:var(--gold);color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-skill{background:linear-gradient(160deg,#3a2a50,#1a0a30);border-color:#9b59b6;color:#d8c8ff}
.btn-rules{background:linear-gradient(160deg,#1a3a50,#0a1a30);border-color:#2980b9;color:#8fd0ff}
#screenGame{max-width:1180px}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#2a1610,#160a06);border:1px solid var(--gold-dim);border-radius:7px;padding:5px 10px;font-size:11px;margin-bottom:6px;position:relative;z-index:2;flex-wrap:wrap;gap:4px}
.top-bar .turn-name{color:var(--gold);font-weight:600}
.game-main{display:flex;gap:8px;margin-bottom:6px;position:relative;z-index:2}
.table-area{flex:1;position:relative;height:540px;background:radial-gradient(ellipse at 50% 50%,rgba(60,90,45,.55),rgba(15,25,12,.85) 70%),repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.15) 0 2px,transparent 2px 6px),linear-gradient(160deg,#2a3a1c,#0f1a0c);border:2px solid #4a5a30;border-radius:50% / 34%;box-shadow:inset 0 0 50px rgba(0,0,0,.75),0 4px 20px rgba(0,0,0,.6);overflow:hidden}
.table-area::before{content:'';position:absolute;inset:8px;border:1px solid rgba(245,197,66,.12);border-radius:50% / 34%;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);transition:left .4s,top .4s;z-index:3}
.seat-targetable{cursor:pointer;z-index:5}
.seat-targetable .p-card{border-color:#e74c3c !important;animation:targetPulse 1.2s infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 10px rgba(231,76,60,.5),inset 0 0 20px rgba(0,0,0,.6)}50%{box-shadow:0 0 25px rgba(231,76,60,.9),0 0 40px rgba(231,76,60,.4),inset 0 0 20px rgba(0,0,0,.6)}}
.seat-targetable:hover .p-card{transform:scale(1.05)}
.p-card{width:112px;background:linear-gradient(180deg,rgba(245,197,66,.1),transparent 30%),linear-gradient(160deg,#2a1a10,#0e0603);border:2px solid var(--gold-dim);border-radius:9px;padding:5px;position:relative;transition:all .25s;box-shadow:inset 0 0 20px rgba(0,0,0,.6),0 3px 12px rgba(0,0,0,.5)}
.p-card.turn{border-color:var(--gold);box-shadow:0 0 24px rgba(245,197,66,.85),0 0 46px rgba(245,197,66,.35),inset 0 0 20px rgba(0,0,0,.6);transform:scale(1.06)}
.p-card.dead{opacity:.28;filter:grayscale(1)}
.p-card.is-self{border-color:var(--gold)}
.p-card.is-self::before{content:'你';position:absolute;top:-8px;right:-6px;background:var(--gold);color:#1a0c08;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;z-index:5}
.p-card .pheader{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.p-card .pavatar{font-size:17px;width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(245,197,66,.22),transparent 70%);border-radius:50%;border:1px solid var(--gold-dim)}
.p-card .pname-block{flex:1;min-width:0}
.p-card .pname{font-size:10.5px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-card .prole{font-size:8px;font-weight:600;margin-top:1px}
.p-card .pknow{font-size:8px;color:var(--gold);position:absolute;top:4px;right:4px;background:rgba(245,197,66,.15);border:1px solid rgba(245,197,66,.4);border-radius:3px;padding:0 3px}
.p-card .php-bar{display:flex;justify-content:center;gap:2px;padding:2px 0 3px;background:rgba(0,0,0,.4);border-radius:4px;margin-bottom:3px;flex-wrap:wrap}
.hp-gem{width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#ff6a5a,#c0392b 50%,#8a1a10);border:1px solid #ff9a88;box-shadow:0 0 5px rgba(255,90,74,.6),inset 0 1px 1px rgba(255,255,255,.5);transition:all .3s}
.hp-gem.empty{background:linear-gradient(135deg,#1a0a08,#0a0402);border-color:#3a1a14;box-shadow:inset 0 1px 2px rgba(0,0,0,.9);opacity:.7}
.hp-gem.low{animation:hpPulse 1s infinite}
@keyframes hpPulse{0%,100%{box-shadow:0 0 5px rgba(255,90,74,.6)}50%{box-shadow:0 0 14px rgba(255,150,90,.95)}}
.p-card .pequip-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:3px}
.equip-slot{aspect-ratio:1;border-radius:3px;background:rgba(0,0,0,.45);border:1px dashed #3a2a1a;display:flex;align-items:center;justify-content:center;font-size:10px;position:relative}
.equip-slot.filled{border-style:solid;border-color:var(--gold-dim);background:linear-gradient(160deg,#4a2a10,#1a0e04);box-shadow:0 0 4px rgba(245,197,66,.3)}
.equip-slot .eq-icon{line-height:1;opacity:.3}
.equip-slot.filled .eq-icon{opacity:1}
.equip-slot::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);background:#1a0c08;color:var(--gold);border:1px solid var(--gold-dim);padding:1px 5px;border-radius:3px;font-size:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.equip-slot:hover::after{opacity:1}
.p-card .pfooter{display:flex;justify-content:space-between;align-items:center;padding-top:2px;border-top:1px solid rgba(138,109,59,.3)}
.hand-pile{position:relative;height:16px;width:26px}
.hand-pile .mini-card{position:absolute;top:0;left:0;width:11px;height:16px;border-radius:2px;background:radial-gradient(circle at 50% 50%,rgba(245,197,66,.3) 0 25%,transparent 30%),linear-gradient(135deg,#2a1810,#4a2a18 50%,#2a1810);border:1px solid var(--gold-dim)}
.hand-pile .mini-card:nth-child(2){left:4px}.hand-pile .mini-card:nth-child(3){left:8px}.hand-pile .mini-card:nth-child(4){left:12px}
.hand-pile .hand-count{position:absolute;right:-3px;bottom:-2px;background:var(--gold);color:#1a0c08;font-size:8px;font-weight:700;min-width:12px;height:12px;line-height:12px;text-align:center;border-radius:6px;padding:0 2px}
.p-card .pjudge-row{display:flex;gap:1px;margin-top:2px;flex-wrap:wrap}
.judge-tag{font-size:7px;background:rgba(155,89,182,.25);border:1px solid #9b59b6;color:#d8b8ff;padding:0 3px;border-radius:2px}
.p-badges{display:flex;gap:2px;justify-content:center;margin-bottom:2px;flex-wrap:wrap;min-height:12px}
.badge{font-size:8px;padding:0 4px;border-radius:3px;font-weight:700;line-height:12px;height:12px}
.badge-shield{color:#4af;background:rgba(68,170,255,.15);border:1px solid rgba(68,170,255,.55)}
.badge-combo{color:var(--gold);background:rgba(245,197,66,.18);border:1px solid rgba(245,197,66,.55);animation:comboPulse 1s infinite}
.badge-master{color:#b57fff;background:rgba(181,127,255,.18);border:1px solid rgba(181,127,255,.55)}
@keyframes comboPulse{0%,100%{box-shadow:0 0 4px rgba(245,197,66,.4)}50%{box-shadow:0 0 10px rgba(245,197,66,.9)}}
.table-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;height:140px;display:flex;align-items:center;justify-content:space-around;z-index:1;background:radial-gradient(ellipse at 50% 50%,rgba(245,197,66,.08),transparent 70%);border-radius:50%}
.pile{display:flex;flex-direction:column;align-items:center;gap:2px}
.pile-label{font-size:8.5px;color:var(--gold-dim);letter-spacing:1px}
.pile-stack{position:relative;width:36px;height:50px}
.pile-stack .card-back-pile{position:absolute;left:0;top:0;width:32px;height:46px;border-radius:4px;background:radial-gradient(circle at 50% 50%,rgba(245,197,66,.25) 0 30%,transparent 32%),linear-gradient(135deg,#2a1810,#4a2a18 50%,#2a1810);border:1.5px solid var(--gold-dim)}
.pile-stack .card-back-pile::after{content:'学';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(245,197,66,.5);font-size:11px;font-family:"STKaiti","KaiTi",serif}
.pile-stack .card-back-pile:nth-child(2){left:2px;top:2px}.pile-stack .card-back-pile:nth-child(3){left:4px;top:4px}
.pile-count{font-size:10.5px;color:var(--gold);font-weight:600}
.play-zone{flex:1;height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:4px;position:relative}
.play-zone-label{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:2px;color:var(--gold-dim);background:rgba(15,26,12,.8);padding:0 6px;border-radius:3px;border:1px solid rgba(245,197,66,.2)}
.play-zone-empty{font-size:9px;color:#5a5a40;letter-spacing:1px;font-style:italic}
.play-card{width:38px;height:54px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold-dim);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600;font-size:10px;position:relative;animation:playCardIn .4s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 10px rgba(245,197,66,.5),0 2px 6px rgba(0,0,0,.7);flex-shrink:0}
.play-card .pcsuit{position:absolute;top:1px;left:2px;font-size:7px}
.play-card .pcnum{position:absolute;top:1px;right:2px;font-size:6px;color:#7a6a50}
.play-card .pcname{font-family:"STKaiti","KaiTi",serif;color:#8a1a10;font-size:10px;text-align:center;line-height:1.1}
.play-card .pcowner{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:5.5px;color:#7a6a50;background:rgba(255,255,255,.35);border-radius:0 0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-card.red .pcsuit{color:#c0392b}
.play-card.trick{border-color:#9b59b6;box-shadow:0 0 10px rgba(155,89,182,.55)}
.play-card.trick .pcname{color:#5a1a7a}
.play-card.equip{border-color:#2980b9;box-shadow:0 0 10px rgba(41,128,185,.55)}
.play-card.equip .pcname{color:#1a4a7a}
@keyframes playCardIn{from{opacity:0;transform:translateY(30px) scale(.4) rotate(-20deg)}60%{opacity:1;transform:translateY(-3px) scale(1.08)}to{opacity:1;transform:none}}
.play-card.fade-out{animation:playCardOut .4s ease-in forwards}
@keyframes playCardOut{to{opacity:0;transform:translateY(-20px) scale(.5) rotate(10deg)}}
.side-panel{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;height:540px}
.play-log-panel,.chat-panel{background:linear-gradient(160deg,#2a1610,#160a06);border:1px solid var(--gold-dim);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.play-log-panel{flex:1;min-height:0}
.chat-panel{flex:1.15;min-height:0}
.panel-title{font-size:10.5px;color:var(--gold);padding:5px 10px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(138,109,59,.4);letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title .badge{font-size:9px;color:var(--muted);letter-spacing:0}
.play-log-list{flex:1;overflow-y:auto;padding:5px 7px;font-size:10px;line-height:1.55}
.play-log-item{margin-bottom:3px;padding:2px 5px;background:rgba(0,0,0,.3);border-left:2px solid var(--gold-dim);border-radius:0 4px 4px 0;animation:logIn .35s ease-out;color:#c8b8a0}
@keyframes logIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.play-log-item .pl-from{color:#e8a0a0;font-weight:600}
.play-log-item .pl-card{color:var(--gold);font-weight:600}
.play-log-item .pl-to{color:#a0c8e8;font-weight:600}
.play-log-item.dmg{border-left-color:#e74c3c}
.play-log-item.heal{border-left-color:#27ae60}
.play-log-item.skill{border-left-color:#9b59b6}
.play-log-item.reward{border-left-color:#f5c542;background:rgba(245,197,66,.12)}
.play-log-item.hl{border-left-color:var(--gold);color:var(--gold);font-weight:600}
.chat-list{flex:1;overflow-y:auto;padding:5px 7px;font-size:10.5px;line-height:1.5}
.chat-msg{margin-bottom:4px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.3);max-width:92%;animation:chatIn .3s ease-out}
@keyframes chatIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-msg.self{margin-left:auto;background:linear-gradient(160deg,rgba(41,128,185,.35),rgba(41,128,185,.15));border:1px solid rgba(41,128,185,.4);text-align:right}
.chat-msg.ai{margin-right:auto;border:1px solid rgba(138,109,59,.35)}
.chat-msg.sys{margin-left:auto;margin-right:auto;text-align:center;background:rgba(245,197,66,.1);border:1px dashed var(--gold-dim);color:var(--gold)}
.chat-msg .chat-name{font-size:8.5px;font-weight:600;color:var(--gold);display:block;margin-bottom:1px}
.chat-msg.self .chat-name{color:#4af;text-align:right}
.chat-msg .chat-text{color:#e0d4bc;word-break:break-word}
.chat-input-row{display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.35);border-top:1px solid rgba(138,109,59,.4);flex-shrink:0}
.chat-input-row input{flex:1;background:#0a0402;border:1px solid var(--gold-dim);color:var(--text);border-radius:4px;padding:4px 8px;font-size:10.5px;font-family:inherit}
.chat-input-row input:focus{outline:none;border-color:var(--gold)}
.chat-input-row button{background:linear-gradient(160deg,#3a2a10,#1a0e04);border:1px solid var(--gold-dim);color:var(--gold);border-radius:4px;padding:0 10px;font-size:10.5px;cursor:pointer;font-family:inherit}
.center-area{background:rgba(0,0,0,.35);border:1px solid #3a2a1a;border-radius:7px;padding:5px 8px;margin-bottom:5px;min-height:50px;position:relative;z-index:2}
.action-hint{font-size:11px;color:var(--muted);margin-bottom:4px;min-height:14px;line-height:1.4}
.action-hint.hint-play{color:var(--gold);font-weight:600}
.action-hint.hint-target{color:#e74c3c;font-weight:600;animation:hintPulse 1s infinite}
@keyframes hintPulse{0%,100%{opacity:1}50%{opacity:.65}}
.action-btns{display:flex;gap:4px;flex-wrap:wrap}
.hand-row{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;min-height:98px;align-items:flex-end;position:relative;z-index:2;justify-content:center}
.card{width:58px;height:84px;flex-shrink:0;border-radius:5px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 60%),linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold-dim);box-shadow:0 3px 9px rgba(0,0,0,.65);position:relative;cursor:default;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 10px 22px rgba(245,197,66,.55),0 0 18px rgba(245,197,66,.45);border-color:var(--gold);z-index:3}
.card.disabled{opacity:.4;cursor:not-allowed}
.card.selected{transform:translateY(-12px) scale(1.06);border-color:var(--gold);box-shadow:0 0 22px rgba(245,197,66,.9)}
.card .suit{position:absolute;top:2px;left:3px;font-size:10px;font-weight:700}
.card .num{position:absolute;top:2px;right:3px;font-size:8px;color:#7a6a50}
.card .cname{font-size:13px;font-family:"STKaiti","KaiTi",serif;color:#8a1a10;text-align:center;line-height:1.1;padding:0 2px}
.card .ctype{font-size:7px;color:#7a6a50;margin-top:1px}
.card.red .suit{color:#c0392b}
.card.black .suit{color:#1a1a1a}
#quizModal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;backdrop-filter:blur(3px)}
#quizModal.show{display:flex}
.quiz-box{width:100%;max-width:440px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--gold-dim);box-shadow:0 0 0 2px var(--gold),0 20px 60px rgba(0,0,0,.9);border-radius:10px;padding:16px;color:var(--ink);position:relative;animation:cardIn .3s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.quiz-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}

@keyframes hitShake{0%,100%{transform:translate(0,0) scale(1.06)}15%{transform:translate(-8px,-3px) scale(1.06);filter:brightness(2.2)}35%{transform:translate(8px,4px) scale(1.06);filter:brightness(1.6)}55%{transform:translate(-6px,0) scale(1.06);filter:brightness(1.3)}}
.fly-card{position:fixed;width:44px;height:62px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:"STKaiti","KaiTi",serif;font-size:20px;font-weight:900;pointer-events:none;box-shadow:0 0 20px currentColor;color:#e74c3c;will-change:transform,opacity;z-index:1000}

.slash-fx{position:fixed;font-size:70px;font-family:"STKaiti","KaiTi",serif;font-weight:900;color:#ff2020;text-shadow:0 0 20px #f00,0 0 40px #f00,3px 3px 0 #000;pointer-events:none;z-index:1001;animation:slashAnim .85s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes slashAnim{0%{opacity:0;transform:scale(.2) rotate(-30deg)}25%{opacity:1;transform:scale(1.6) rotate(-30deg)}45%{transform:scale(1.2) rotate(-30deg)}70%{opacity:1;transform:scale(1.35) rotate(-30deg) translateY(-20px)}100%{opacity:0;transform:scale(1.9) rotate(-30deg) translateY(-60px)}}

@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.3)}15%{opacity:1;transform:translateY(-15px) scale(1.3)}35%{transform:translateY(-25px) scale(1.1)}100%{opacity:0;transform:translateY(-80px) scale(.9)}}
.shield-fx{position:fixed;width:120px;height:120px;border-radius:50%;border:4px solid #4af;box-shadow:0 0 30px #4af,inset 0 0 30px rgba(68,170,255,.5);pointer-events:none;z-index:1000;animation:shieldAnim .7s ease-out forwards}
@keyframes shieldAnim{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.15)}60%{transform:scale(1.05);opacity:.85}100%{opacity:0;transform:scale(1.7)}}
.heal-fx{position:fixed;width:85px;height:85px;border-radius:50%;background:radial-gradient(circle,rgba(46,204,113,.75) 0%,transparent 70%);pointer-events:none;z-index:1000;animation:healAnim .9s ease-out forwards}
@keyframes healAnim{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) translateY(-30px)}}
.heal-ball{position:fixed;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#b8ffd0,#27ae60);box-shadow:0 0 20px #4f8;pointer-events:none;z-index:1000}

@keyframes rippleAnim{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.85)}}
#screenGame.screen-shake{animation:screenShake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes screenShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,3px)}30%{transform:translate(7px,-3px)}45%{transform:translate(-5px,-4px)}60%{transform:translate(5px,4px)}75%{transform:translate(-3px,2px)}90%{transform:translate(3px,-2px)}}
.judge-fx{position:fixed;width:60px;height:88px;background:linear-gradient(160deg,var(--parch),var(--parch2));border:3px solid var(--gold);border-radius:5px;pointer-events:none;z-index:1001;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:600;animation:judgeFlip .95s cubic-bezier(.3,1.4,.5,1) forwards;box-shadow:0 0 24px rgba(245,197,66,.9)}
@keyframes judgeFlip{0%{opacity:0;transform:translateY(30px) rotateY(0) scale(.5)}30%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.1)}70%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1.1)}100%{opacity:0;transform:translateY(-50px) rotateY(180deg) scale(.9)}}
.judge-fx .jsuit{font-size:20px}.judge-fx .jnum{font-size:11px;color:#7a6a50}

.judge-fx.red{color:#c0392b}.judge-fx.black{color:#1a1a1a}
.death-fx{position:fixed;font-size:46px;font-weight:900;color:#888;text-shadow:0 0 20px #000,0 0 40px #f00;pointer-events:none;z-index:1002;animation:deathAnim 1.25s ease-out forwards;font-family:"STKaiti","KaiTi",serif}
@keyframes deathAnim{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.4) rotate(-8deg)}60%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{opacity:0;transform:scale(.8) rotate(-15deg) translateY(-80px)}}
@media(max-width:900px){.game-main{flex-direction:column}.table-area{height:460px}.side-panel{width:100%;height:auto;flex-direction:row}.play-log-panel,.chat-panel{flex:1;height:160px}.p-card{width:96px}.card{width:50px;height:72px}.card .cname{font-size:11px}}
</style>

<body>

<button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

<h1>学堂杀</h1>
<div class="subtitle">点 击 出 牌 · 学 识 护 盾 · 规 则 查 询</div>

<div id="screenLobby" class="screen active">
  <div class="panel">
    <h3>◈ 游戏模式 ◈</h3>
    <div class="opt-row" id="modePicker">
      <button class="opt-btn active" data-mode="single">单机对局<small>你 + AI</small></button>
      <button class="opt-btn" data-mode="host">创建房间<small>联机房主</small></button>
      <button class="opt-btn" data-mode="join">加入房间<small>联机玩家</small></button>
    </div>
  </div>
  <div id="hostConfig">
    <div class="panel">
      <h3>◈ 选择年级 ◈</h3>
      <div class="opt-row" id="gradePicker">
        <button class="opt-btn active" data-grade="初一">初一<small>语数英·生地</small></button>
        <button class="opt-btn" data-grade="初二">初二<small>语数英·物生</small></button>
        <button class="opt-btn" data-grade="初三">初三<small>语数英·物化</small></button>
      </div>
    </div>
    <div class="panel">
      <h3>◈ 玩家总数 ◈</h3>
      <div class="opt-row" id="playerCountPicker">
        <button class="opt-btn" data-count="2">2人</button>
        <button class="opt-btn" data-count="3">3人</button>
        <button class="opt-btn active" data-count="4">4人</button>
        <button class="opt-btn" data-count="5">5人</button>
        <button class="opt-btn" data-count="6">6人</button>
        <button class="opt-btn" data-count="7">7人</button>
        <button class="opt-btn" data-count="8">8人</button>
      </div>
      <div id="aiCountHint" style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;"></div>
    </div>
    <div class="panel" id="roomConfig" style="display:none;">
      <h3>◈ 联机配置 ◈</h3>
      <div class="input-row"><input type="text" id="nicknameInput" placeholder="你的昵称" maxlength="12" value="房主"></div>
      <button class="btn btn-accent" style="width:100%" onclick="createRoom()">创建房间并等待玩家</button>
      <div id="roomInfo" style="margin-top:8px;font-size:12px;color:var(--gold);"></div>
    </div>
    <div class="panel">
      <h3>◈ 选择你的角色 ◈</h3>
      <div class="char-grid" id="charGrid"></div>
    </div>
    <div class="lobby-btns">
      <button class="btn btn-accent btn-lg" id="startBtn" onclick="startSingle()">开始单机对局</button>
    </div>
  </div>
  <div id="joinConfig" style="display:none;">
    <div class="panel">
      <h3>◈ 加入房间 ◈</h3>
      <div class="input-row"><input type="text" id="joinNick" placeholder="你的昵称" maxlength="12" value="玩家"></div>
      <div class="input-row"><input type="text" id="joinCode" placeholder="6 位房间号" maxlength="6"></div>
      <button class="btn btn-accent" style="width:100%" onclick="joinRoom()">加入房间</button>
      <div id="joinStatus" style="margin-top:8px;font-size:12px;color:var(--muted);"></div>
    </div>
  </div>
</div>

<div id="screenGame" class="screen">
  <div class="top-bar">
    <span>回合：<span class="turn-name" id="turnName">—</span></span>
    <span>阶段：<span id="phaseLabel">—</span></span>
    <span id="selfInfo" style="color:var(--muted)"></span>
    <span id="connInfo" style="color:var(--green);font-size:10px;"></span>
    <button class="btn btn-sm btn-rules" onclick="openRules()">📖 规则</button>
  </div>
  <div class="game-main">
    <div class="table-area" id="tableArea">
      <div class="seat-ring" id="seatRing"></div>
      <div class="table-center">
        <div class="pile">
          <div class="pile-label">牌堆</div>
          <div class="pile-stack"><div class="card-back-pile"></div><div class="card-back-pile"></div><div class="card-back-pile"></div></div>
          <div class="pile-count" id="deckCount">0</div>
        </div>
        <div class="play-zone" id="playZoneCards">
          <div class="play-zone-label">出 牌 区</div>
          <span class="play-zone-empty">— 牌桌中央 —</span>
        </div>
        <div class="pile">
          <div class="pile-label">弃牌</div>
          <div class="pile-stack"><div class="card-back-pile" style="filter:brightness(.6)"></div></div>
          <div class="pile-count" id="discardCount">0</div>
        </div>
      </div>
    </div>
    <div class="side-panel">
      <div class="play-log-panel">
        <div class="panel-title">战 报 · 出 牌 记 录 <span class="badge" id="playLogBadge">0</span></div>
        <div class="play-log-list" id="playLogList"></div>
      </div>
      <div class="chat-panel" id="chatPanel" style="display:none;">
        <div class="panel-title">聊 天 室 <span class="badge">💬</span></div>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="说点什么…" maxlength="40" onkeydown="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>
  </div>
  <div class="center-area">
    <div class="action-hint" id="actionHint"></div>
    <div class="action-btns" id="actionBtns"></div>
  </div>
  <div class="hand-row" id="handRow"></div>
  <div style="text-align:center;margin-top:5px;position:relative;z-index:2">
    <button class="btn btn-sm" onclick="location.reload()">退出重开</button>
  </div>
</div>

<div id="quizModal">
  <div class="quiz-box">
    <div class="quiz-header">
      <div class="quiz-icon" id="quizIcon">📖</div>
      <div class="quiz-meta">
        <div class="quiz-subject" id="quizSubject"></div>
        <div class="quiz-progress" id="quizProgress"></div>
      </div>
    </div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div id="quizOptions"></div>
    <div id="quizFeedback"></div>
  </div>
</div>

<div id="rulesModal" class="rules-modal">
  <div class="rules-box">
    <div class="rules-header">
      <span>📖 学堂杀规则说明</span>
      <button onclick="closeRules()" class="rules-close">✕</button>
    </div>
    <div class="rules-tabs">
      <button class="rule-tab active" data-tab="basic" onclick="switchRulesTab('basic')">基本规则</button>
      <button class="rule-tab" data-tab="cards" onclick="switchRulesTab('cards')">卡牌说明</button>
      <button class="rule-tab" data-tab="chars" onclick="switchRulesTab('chars')">角色技能</button>
    </div>
    <div class="rules-content" id="rulesContent"></div>
  </div>
</div>

<div class="fx-layer" id="fxLayer"></div>

<script>
/* ============================================================
   音效
   ============================================================ */
const Sound={ctx:null,enabled:true,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.enabled=false;return null}}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  noise(d){const c=this.ctx;const s=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,s,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<s;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/s,1.6);const src=c.createBufferSource();src.buffer=b;return src},
  play(t){if(!this.enabled)return;const c=this.init();if(!c)return;const n=c.currentTime;
    const tone=(f,d,tp='sine',v=0.1,st)=>{const o=c.createOscillator(),g=c.createGain();o.type=tp;o.frequency.setValueAtTime(f,n);if(st)o.frequency.exponentialRampToValueAtTime(st,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d)};
    switch(t){
      case 'click':tone(880,.06,'triangle',.06,440);break;
      case 'draw':tone(1200,.1,'sine',.07,700);break;
      case 'play':tone(520,.14,'triangle',.12,180);break;
      case 'sha':{tone(130,.32,'sine',.32,38);const nz=this.noise(.28);const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(2400,n);f.frequency.exponentialRampToValueAtTime(300,n+.26);const g=c.createGain();g.gain.setValueAtTime(.28,n);g.gain.exponentialRampToValueAtTime(.001,n+.28);nz.connect(f);f.connect(g);g.connect(c.destination);nz.start(n);break}
      case 'shan':[1500,2250,3000].forEach((f,i)=>tone(f,.4,'sine',.07-i*.015));break;
      case 'tao':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sine',.1),i*80));break;
      case 'jiu':tone(180,.38,'sawtooth',.11,420);break;
      case 'trick':tone(400,.32,'sine',.09,1600);break;
      case 'hit':tone(180,.28,'square',.2,50);break;
      case 'thunder':{const nz=this.noise(.5);const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=.7;f.frequency.setValueAtTime(3000,n);f.frequency.exponentialRampToValueAtTime(200,n+.5);const g=c.createGain();g.gain.setValueAtTime(.35,n);g.gain.exponentialRampToValueAtTime(.001,n+.5);nz.connect(f);f.connect(g);g.connect(c.destination);nz.start(n);tone(120,.55,'sawtooth',.28,30);break}
      case 'judge':tone(1760,.4,'sine',.09);break;
      case 'skill':tone(280,.45,'sawtooth',.09,1200);break;
      case 'death':tone(400,.9,'sawtooth',.18,60);break;
      case 'turn':[1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.7,'sine',.09),i*150));break;
      case 'correct':[659,880,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.08),i*70));break;
      case 'wrong':tone(200,.42,'square',.11,140);break;
      case 'win':[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.6,'triangle',.11),i*120));break;
      case 'chat':tone(660,.08,'sine',.04);break;
      case 'reward':[1046,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.1),i*60));break;
      case 'combo':[784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sine',.11),i*70));break;
    }}
};
function toggleSound(){Sound.enabled=!Sound.enabled;const b=document.getElementById('soundToggle');b.textContent=Sound.enabled?'🔊':'🔇';b.classList.toggle('muted',!Sound.enabled);if(Sound.enabled){Sound.init();Sound.play('click')}}

/* ============================================================
   特效
   ============================================================ */
const FX={
  anchor(idx){const s=document.querySelector(`.seat[data-idx="${idx}"] .p-card`);if(!s)return{x:window.innerWidth/2,y:window.innerHeight/2};const r=s.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}},
  attackLunge(idx){const e=document.querySelector(`.seat[data-idx="${idx}"] .p-card`);if(!e)return;e.classList.remove('attacking');void e.offsetWidth;e.classList.add('attacking');setTimeout(()=>e.classList.remove('attacking'),480)},
  hitShake(idx){const e=document.querySelector(`.seat[data-idx="${idx}"] .p-card`);if(!e)return;e.classList.remove('hit-shake');void e.offsetWidth;e.classList.add('hit-shake');setTimeout(()=>e.classList.remove('hit-shake'),520)},
  async flyCard(fromIdx,toIdx,text,type='basic',dur=520){const from=this.anchor(fromIdx),to=this.anchor(toIdx);const e=document.createElement('div');e.className='fly-card '+(type!=='basic'?type:'');e.textContent=text;e.style.left=(from.x-22)+'px';e.style.top=(from.y-31)+'px';document.getElementById('fxLayer').appendChild(e);const dx=to.x-from.x,dy=to.y-from.y;const a=e.animate([{transform:'translate(0,0) scale(.5) rotate(0)',opacity:0},{transform:'translate(0,0) scale(1.08) rotate(0)',opacity:1,offset:.14},{transform:`translate(${dx*.5}px,${dy*.5-55}px) scale(1.1) rotate(180deg)`,opacity:1,offset:.62},{transform:`translate(${dx}px,${dy}px) scale(.5) rotate(360deg)`,opacity:.15}],{duration:dur,easing:'cubic-bezier(.45,.05,.65,.95)',fill:'forwards'});return a.finished.then(()=>e.remove())},

let playLog=[];
function addLog(t,cls=''){playLog.push({action:'log',text:t,cls});if(playLog.length>100)playLog.shift();renderPlayLog()}
function addPlayLog(fromName,action,cardName,toName,cls=''){playLog.push({action,fromName,cardName,toName,cls});if(playLog.length>100)playLog.shift();renderPlayLog()}
function renderPlayLog(){
  const el=document.getElementById('playLogList');if(!el)return;
  el.innerHTML=playLog.slice(-60).map(l=>{
    if(l.action==='log')return `<div class="play-log-item ${l.cls||''}">${l.text}</div>`;
    if(l.action==='use')return `<div class="play-log-item ${l.cls||''}"><span class="pl-from">${l.fromName}</span> 使用 <span class="pl-card">【${l.cardName}】</span>${l.toName?' → <span class="pl-to">'+l.toName+'</span>':''}</div>`;
    if(l.action==='damage')return `<div class="play-log-item dmg"><span class="pl-to">${l.toName}</span> 受到 <span class="pl-card">${l.cardName}</span> 点伤害</div>`;
    if(l.action==='heal')return `<div class="play-log-item heal"><span class="pl-to">${l.toName}</span> 回复 <span class="pl-card">${l.cardName}</span> 点体力</div>`;
    if(l.action==='skill')return `<div class="play-log-item skill"><span class="pl-from">${l.fromName}</span> 发动 <span class="pl-card">【${l.cardName}】</span></div>`;
    if(l.action==='reward')return `<div class="play-log-item reward"><span class="pl-from">${l.fromName}</span> 获得 <span class="pl-card">${l.cardName}</span></div>`;

  }).join('');

}

let chatMessages=[];
function addChat(name,text,kind='ai'){chatMessages.push({name,text,kind});if(chatMessages.length>100)chatMessages.shift();renderChat();Sound.play('chat')}
function renderChat(){const el=document.getElementById('chatList');if(!el)return;el.innerHTML=chatMessages.map(m=>`<div class="chat-msg ${m.kind}"><span class="chat-name">${m.name}</span><span class="chat-text">${escapeHtml(m.text)}</span></div>`).join('');el.scrollTop=el.scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sendChat(){
  const input=document.getElementById('chatInput');const text=(input.value||'').trim();if(!text)return;
  const me=G.players[G.myPlayerIdx];if(!me)return;
  addChat(me.name,text,'self');input.value='';
  if(NET.isHost){NET.broadcast({type:'chat',name:me.name,text})}
  else if(NET.myConn){NET.myConn.send({type:'chat',name:me.name,text})}
  if(NET.mode==='single'||NET.mode==='host'){
    const others=G.players.filter((p,i)=>i!==G.myPlayerIdx&&p.alive&&p.isAI);
    if(others.length>0&&Math.random()<0.7){
      setTimeout(()=>{
        const r=others[Math.floor(Math.random()*others.length)];
        const reply=aiReply(r,text);addChat(r.name,reply,'ai');
        if(NET.isHost)NET.broadcast({type:'chat',name:r.name,text:reply});
      },800+Math.random()*1400);
    }
  }
}
function aiReply(p,u){const l=AI_LINES[p.charId]||AI_LINES.default;if(/杀|攻击|打/.test(u))return pickRand(l.attack);if(/桃|血|救/.test(u))return pickRand(l.heal);if(/技能|绝招/.test(u))return pickRand(l.skill);if(/你好|hi|hello/i.test(u))return pickRand(l.greet);return pickRand(l.idle)}
function pickRand(a){return a[Math.floor(Math.random()*a.length)]}
function aiSpeak(p,t){if(!p||!p.isAI)return;if(Math.random()>0.55)return;const l=AI_LINES[p.charId]||AI_LINES.default;const arr=l[t]||l.idle;if(!arr||arr.length===0)return;const text=pickRand(arr);addChat(p.name,text,'ai');if(NET.isHost)NET.broadcast({type:'chat',name:p.name,text})}

const SUITS=['♠','♥','♣','♦'];let cid=0;
function C(name,type,sub,suit,num,extra={}){return{id:++cid,name,type,sub,suit,num,...extra}}
function buildDeck(){
  const d=[];
  for(let i=0;i<30;i++)d.push(C('杀','basic','sha',SUITS[i%4],i%13+1));
  for(let i=0;i<15;i++)d.push(C('闪','basic','shan',SUITS[i%4],i%13+1));
  for(let i=0;i<8;i++)d.push(C('桃','basic','tao',SUITS[i%4],i%13+1));
  for(let i=0;i<5;i++)d.push(C('酒','basic','jiu',SUITS[i%4],i%13+1));
  const tr=[['无中生有','wuzhong',4],['过河拆桥','guohe',6],['顺手牵羊','shunshou',5],['决斗','juedou',3],['南蛮入侵','nanman',3],['万箭齐发','wanjian',1],['桃园结义','taoyuan',1],['无懈可击','wuxie',4],['乐不思蜀','lebu',3],['闪电','shandian',2]];
  tr.forEach(([n,s,c])=>{for(let i=0;i<c;i++)d.push(C(n,'trick',s,SUITS[i%4],i%13+1))});
  const eq=[['诸葛连弩','weapon',{range:1,skill:'liannu'},1],['青龙偃月刀','weapon',{range:3,skill:'qinglong'},1],['丈八蛇矛','weapon',{range:3,skill:'zhangba'},1],['八卦阵','armor',{skill:'bagua'},2],['仁王盾','armor',{skill:'renwang'},1],['+1马','horse+',{dist:1},3],['-1马','horse-',{dist:1},3]];
  eq.forEach(([n,s,e,c])=>{for(let i=0;i<c;i++)d.push(C(n,'equip',s,SUITS[i%4],i%13+1,e))});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

const G={players:[],deck:[],discard:[],current:0,started:false,log:[],grade:'初二',myPlayerIdx:0,
  pendingOptions:null,pendingType:'list',pendingResolve:null,pendingPlayer:null,gameOver:false,winnerText:'',playerCount:4,
  handClickable:false,targetSelectable:false};

function pickQ(p){const bank=QUESTION_BANK[G.grade]||QUESTION_BANK['初二'];if(p&&p.subject&&Math.random()<0.7){const sub=bank.filter(q=>q.s===p.subject);if(sub.length)return sub[Math.floor(Math.random()*sub.length)]}return bank[Math.floor(Math.random()*bank.length)]}
function hasSkill(p,id){return p.skills&&p.skills.some(s=>s.id===id)}
function seatDist(a,b){const n=G.players.length;return Math.min(Math.abs(a-b),n-Math.abs(a-b))}
function distBetween(fromIdx,toIdx){let d=seatDist(fromIdx,toIdx);const from=G.players[fromIdx],to=G.players[toIdx];if(to.equip.horsePlus)d+=1;if(from.equip.horseMinus)d-=1;if(hasSkill(from,'wanyou'))d-=1;return Math.max(1,d)}
function attackRange(p){return p.equip.weapon?(p.equip.weapon.range||1):1}
function inRange(fromIdx,toIdx){return distBetween(fromIdx,toIdx)<=attackRange(G.players[fromIdx])}
function drawCards(p,n){for(let i=0;i<n;i++){if(G.deck.length===0){if(G.discard.length===0)break;G.deck=G.discard;G.discard=[];shuffle(G.deck)}const c=G.deck.pop();if(c)p.hand.push(c)}if(n>0)Sound.play('draw')}
function discardCard(p,card,toDiscard=true){const i=p.hand.findIndex(c=>c.id===card.id);if(i>=0){p.hand.splice(i,1);if(toDiscard)G.discard.push(card)}}
function handLimit(p){let l=Math.max(p.hp,0);if(hasSkill(p,'zhuishu'))l+=2;if(hasSkill(p,'yuansu'))l+=1;return l}

const NET={peer:null,conns:[],myConn:null,isHost:false,mode:'single',roomCode:null,myPeerId:null,playerConns:{},pendingQuiz:null,
  async createRoom(code,hostName){return new Promise((resolve,reject)=>{this.roomCode=code;this.isHost=true;this.mode='host';this.peer=new Peer('xts-'+code,{debug:1});this.peer.on('open',id=>{this.myPeerId=id;resolve(id)});this.peer.on('error',e=>reject(e));this.peer.on('connection',conn=>{this.conns.push(conn);conn.on('open',()=>{this.playerConns[conn.peer]=conn;onPeerConnected(conn)});conn.on('data',d=>onPeerData(conn,d));conn.on('close',()=>{this.conns=this.conns.filter(c=>c!==conn);delete this.playerConns[conn.peer];const p=G.players.find(pl=>pl.peerId===conn.peer);if(p&&p.alive){addLog(`${p.name} 断线，转为 AI`);p.isAI=true;p.peerId=null;render()}})})})},
  async joinRoom(code,myName){return new Promise((resolve,reject)=>{this.roomCode=code;this.isHost=false;this.mode='join';this.peer=new Peer({debug:1});this.peer.on('open',id=>{this.myPeerId=id;const conn=this.peer.connect('xts-'+code,{metadata:{name:myName}});this.myConn=conn;this.conns=[conn];conn.on('open',()=>resolve(id));conn.on('data',d=>onClientData(d));conn.on('error',e=>reject(e))});this.peer.on('error',e=>reject(e))})},
  broadcast(msg){if(!this.isHost)return;this.conns.forEach(c=>{try{c.send(msg)}catch(e){}})},
  sendToHost(msg){if(this.isHost)return;if(this.myConn){try{this.myConn.send(msg)}catch(e){}}},
  sendToPlayer(pid,msg){if(!this.isHost)return;const c=this.playerConns[pid];if(c){try{c.send(msg)}catch(e){}}}
};
function onPeerConnected(conn){const name=conn.metadata?.name||'玩家';addChat('系统',`${name} 加入房间。`,'sys');NET.broadcast({type:'chat',name:'系统',text:`${name} 加入房间。`});updateConnectedList()}
function updateConnectedList(){const el=document.getElementById('connectedList');if(!el)return;const peers=Object.values(NET.playerConns).map(c=>c.metadata?.name||'玩家');el.innerHTML=`已连接玩家：${peers.length?peers.join('、'):'（暂无）'} · 目标：${SELECTED_COUNT} 人`}

function onPeerData(conn,data){
  if(!NET.isHost)return;
  if(data.type==='choose_response'){if(G.pendingPlayer!=null&&G.pendingResolve){const r=G.pendingResolve;G.pendingResolve=null;G.pendingOptions=null;G.pendingPlayer=null;r(data.value)}}
  else if(data.type==='quiz_response'){if(NET.pendingQuiz){const r=NET.pendingQuiz.resolve;NET.pendingQuiz=null;r(data.correct)}}
  else if(data.type==='chat'){addChat(data.name,data.text,'ai');NET.broadcast(data)}
}
function onClientData(data){
  if(data.type==='start_game'){G.players=data.players;G.myPlayerIdx=data.myPlayerIdx;G.grade=data.grade;G.playerCount=data.playerCount;G.started=true;G.deck=[];G.discard=[];document.getElementById('screenLobby').classList.remove('active');document.getElementById('screenGame').classList.add('active');clearPlayZone();render()}
  else if(data.type==='state_sync'){G.players=data.players;G.current=data.current;G.deck=data.deck;G.discard=data.discard;G.gameOver=data.gameOver;G.winnerText=data.winnerText;G.pendingOptions=data.pendingOptions;G.pendingPlayer=data.pendingPlayer;G.pendingType=data.pendingType||'list';render()}
  else if(data.type==='choose_request'){G.pendingOptions=data.options;G.pendingPlayer=data.myPlayerIdx;G.pendingType=data.choiceType||'list';render()}
  else if(data.type==='ask_quiz_request'){onAskQuizRequest(data.question,data.isSkill)}
  else if(data.type==='chat'){addChat(data.name,data.text,'ai')}
}
function syncStateToClients(){if(!NET.isHost)return;NET.broadcast({type:'state_sync',players:G.players,current:G.current,deck:G.deck,discard:G.discard,gameOver:G.gameOver,winnerText:G.winnerText,pendingOptions:G.pendingOptions,pendingType:G.pendingType,pendingPlayer:G.pendingPlayer})}
async function onAskQuizRequest(question,isSkill){
  const player=G.players[G.myPlayerIdx];
  const correct=await displayQuiz(question,player,isSkill);
  NET.sendToHost({type:'quiz_response',correct:correct});
}

/* ============================================================
   统一选择（支持 play/target/list 三种模式）
   ============================================================ */
function isLocalPlayer(idx){if(NET.mode==='single')return true;if(NET.mode==='host'){const p=G.players[idx];return !p.isAI&&p.peerId===NET.myPeerId}if(NET.mode==='join')return idx===G.myPlayerIdx;return false}
function waitChoice(playerIdx,options,type='list'){
  return new Promise(resolve=>{
    const p=G.players[playerIdx];if(!p){resolve(options[options.length-1].value);return}
    G.pendingOptions=options;G.pendingType=type;G.pendingPlayer=playerIdx;G.pendingResolve=resolve;
    if(isLocalPlayer(playerIdx)){render()}
    else if(NET.isHost){NET.sendToPlayer(p.peerId,{type:'choose_request',options,myPlayerIdx:G.players.indexOf(p),choiceType:type});render();syncStateToClients()}
    else{render()}
  });
}
function resolveChoice(v){Sound.play('click');if(!G.pendingResolve)return;const r=G.pendingResolve;G.pendingResolve=null;G.pendingOptions=null;G.pendingPlayer=null;r(v);if(NET.isHost)syncStateToClients();render()}
function clientResolveChoice(v){Sound.play('click');if(!G.pendingOptions)return;G.pendingOptions=null;G.pendingPlayer=null;NET.sendToHost({type:'choose_response',value:v});render()}
function handleLocalChoice(v){if(NET.mode==='join')clientResolveChoice(v);else resolveChoice(v)}
function clickHandCard(cardId){
  if(!G.pendingOptions||G.pendingType!=='play')return;
  const vals=[`sha_${cardId}`,`tao_${cardId}`,`jiu_${cardId}`,`trick_${cardId}`,`equip_${cardId}`];
  const opt=G.pendingOptions.find(o=>vals.includes(o.value));
  if(opt){Sound.play('click');handleLocalChoice(opt.value)}
}
function clickTargetSeat(idx){
  if(!G.pendingOptions||G.pendingType!=='target')return;
  const opt=G.pendingOptions.find(o=>o.value===idx);
  if(opt){Sound.play('click');handleLocalChoice(idx)}
}

function grantLearningReward(player,isSkillQuiz,question){
  if(!player)return [];
  const rewards=[];
  player.subjectMastery=player.subjectMastery||{};
  const sub=question?question.s:null;
  if(sub)player.subjectMastery[sub]=(player.subjectMastery[sub]||0)+1;
  player.combo=(player.combo||0)+1;
  if(player.combo>(player.maxCombo||0))player.maxCombo=player.combo;
  const roll=Math.random();
  if(roll<0.30){player.shield=(player.shield||0)+1;rewards.push('🛡️获得1层知识护盾')}
  else if(roll<0.55){drawCards(player,1);rewards.push('🎴摸1张牌')}
  else if(roll<0.72){if(player.hp<player.maxHp){player.hp++;rewards.push('💚回复1点体力')}else{drawCards(player,1);rewards.push('🎴满血改摸1张')}}
  else if(roll<0.88){player.flags.extraDamage=(player.flags.extraDamage||0)+1;rewards.push('⚔️下张杀伤害+1')}
  else{player.knowledge+=1;rewards.push('🔮额外+1学识')}
  if(isSkillQuiz){player.shield=(player.shield||0)+1;rewards.push('✨技能奖励：额外+1护盾')}
  if(player.combo===3){drawCards(player,1);rewards.push('🔥连击3：摸1张牌')}
  else if(player.combo===5){player.hp=Math.min(player.maxHp,player.hp+1);player.shield=(player.shield||0)+1;rewards.push('🔥连击5：回1血+1护盾')}
  else if(player.combo>=7){player.knowledge+=2;rewards.push('🔥连击'+player.combo+'：学识+2')}
  if(sub&&player.subjectMastery[sub]===5){player.flags.extraDamage=(player.flags.extraDamage||0)+1;rewards.push(`🎓【${sub}精通】下张杀伤害+1`)}
  if(rewards.length>0){rewards.forEach(r=>addPlayLog(player.name,'reward',r.replace(/^[^\s]+\s*/,''),'','reward'))}
  return rewards;
}

function displayQuiz(q,player,isSkill){
  return new Promise(resolve=>{
    quizResolve=resolve;
    document.getElementById('quizIcon').textContent=SUBJECT_ICON[q.s]||'📖';
    document.getElementById('quizSubject').textContent=q.s+(isSkill?' · 技能挑战':' · 知识挑战');
    document.getElementById('quizProgress').textContent=`已答 ${quizStats.total} 题 · 正确 ${quizStats.correct} 题`;
    document.getElementById('quizQuestion').textContent=q.q;
    const opts=document.getElementById('quizOptions');
    opts.innerHTML=q.o.map((o,i)=>`<button class="quiz-option" data-i="${i}"><span class="tag">${String.fromCharCode(65+i)}</span>${o}</button>`).join('');
    document.getElementById('quizFeedback').textContent='';
    opts.querySelectorAll('.quiz-option').forEach(btn=>{
      btn.onclick=()=>{
        const i=Number(btn.dataset.i);const correct=i===q.a;
        opts.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(Number(b.dataset.i)===q.a)b.classList.add('correct')});
        if(!correct)btn.classList.add('wrong');
        const fb=document.getElementById('quizFeedback');
        quizStats.total++;
        if(correct){
          quizStats.correct++;
          if(player)player.knowledge+=1;
          const rewards=grantLearningReward(player,isSkill,q);
          fb.innerHTML=`✓ 答对！学识 +1<br><span style="font-size:10.5px;color:#1e7a3a;">${rewards.join(' · ')}</span>`;
          fb.style.color='#1e7a3a';
          Sound.play('correct');
          if(player&&player.combo>=3)setTimeout(()=>Sound.play('combo'),400);
          if(rewards.length>0)setTimeout(()=>Sound.play('reward'),200);
        }else{
          if(player)player.combo=0;
          fb.textContent='✗ 正确答案是 '+String.fromCharCode(65+q.a);
          fb.style.color='#a02020';
          Sound.play('wrong');
        }
        setTimeout(()=>{document.getElementById('quizModal').classList.remove('show');if(quizResolve){const r=quizResolve;quizResolve=null;r(correct)}},1300);
      };
    });
    document.getElementById('quizModal').classList.add('show');
  });
}
function askQuiz(player,isSkill=false){const q=pickQ(player);return displayQuiz(q,player,isSkill)}
function aiQuiz(rate=0.6){return Math.random()<rate}
function askQuizRemote(player,isSkill){
  return new Promise(resolve=>{
    const conn=NET.playerConns[player.peerId];
    if(!conn){resolve(aiQuiz(0.6));return}
    const q=pickQ(player);
    NET.pendingQuiz={resolve,player,q};
    conn.send({type:'ask_quiz_request',question:q,isSkill});
    setTimeout(()=>{if(NET.pendingQuiz&&NET.pendingQuiz.player===player){NET.pendingQuiz=null;resolve(false)}},20000);
  });
}
async function askQuizForPlayer(idx,isSkill=false){
  const p=G.players[idx];if(!p)return false;
  if(p.isAI)return aiQuiz(isSkill?0.62:0.6);
  if(isLocalPlayer(idx))return await askQuiz(p,isSkill);
  if(NET.isHost&&p.peerId)return await askQuizRemote(p,isSkill);
  return await askQuiz(p,isSkill);
}

async function dealDamage(srcIdx,tgtIdx,amount,type='normal'){
  const tgt=G.players[tgtIdx];if(!tgt||!tgt.alive)return;
  let dmg=amount;
  if(hasSkill(tgt,'fuli')&&srcIdx>=0){const src=G.players[srcIdx];if(src.equip.weapon||src.equip.armor||src.equip.horsePlus||src.equip.horseMinus){dmg=Math.max(0,dmg-1);addLog(`【浮力】${tgt.name} 减免1点`,'heal')}}
  if(hasSkill(tgt,'gaosifenbu')&&srcIdx>=0){const src=G.players[srcIdx];if(src.hand.length>tgt.hand.length){dmg=Math.max(0,dmg-1);addLog(`【高斯分布】${tgt.name} 减免1点`,'heal')}}
  while(dmg>0&&(tgt.shield||0)>0){tgt.shield--;dmg--;addLog(`${tgt.name} 消耗 1 层知识护盾抵挡 1 点伤害`,'heal');floatTextFx(tgtIdx,'护盾','#4af')}
  while(dmg>0&&tgt.knowledge>=2){tgt.knowledge-=2;dmg--;addLog(`${tgt.name} 消耗 2 学识抵挡 1 点伤害`,'heal')}
  if(dmg>0){
    await FX.slash(tgtIdx);shakeScreen(Math.min(10,4+dmg*2));
    floatTextFx(tgtIdx,'-'+dmg,'#ff3b30');
    Sound.play('hit');
    tgt.hp-=dmg;
    addPlayLog('','damage',dmg,tgt.name,'dmg');
    aiSpeak(tgt,'hurt');
    render();
    if(tgt.alive){
      if(hasSkill(tgt,'hengmei')){drawCards(tgt,1);addLog(`【横眉】${tgt.name} 摸一张牌`,'hl')}
      if(hasSkill(tgt,'moxuyou')){drawCards(tgt,1);addLog(`【莫须有】${tgt.name} 摸一张牌`,'hl')}
      if(hasSkill(tgt,'hamuleite')&&srcIdx>=0){const src=G.players[srcIdx];if(src.hand.length>0){const c=src.hand[Math.floor(Math.random()*src.hand.length)];discardCard(src,c);addLog(`【哈姆雷特】${src.name} 弃一张牌`,'dmg')}}
    }
    if(tgt.hp<=0)await dyingPhase(tgtIdx,srcIdx);
  }
  render();checkWin();
}
async function dyingPhase(idx,srcIdx){
  const p=G.players[idx];if(!p.alive)return;
  while(p.hp<=0){
    if(p.isAI){
      const tao=p.hand.find(c=>c.sub==='tao');
      if(tao){discardCard(p,tao);p.hp++;addLog(`${p.name} 使用【桃】自救`,'heal');FX.healGlow(idx);Sound.play('tao');continue}
      let saved=false;
      for(let i=0;i<G.players.length;i++){const q=G.players[i];if(i===idx||!q.alive||!q.isAI)continue;if(shouldSave(q,p)){const t2=q.hand.find(c=>c.sub==='tao');if(t2){discardCard(q,t2);p.hp++;addLog(`${q.name} 使用【桃】救 ${p.name}`,'heal');FX.healGlow(idx);Sound.play('tao');saved=true;break}}}
      if(!saved){p.alive=false;p.roleRevealed=true;addLog(`${p.name} 阵亡，身份【${ROLES[p.role].name}】`,'dmg');await FX.death(idx);break}
    }else{
      const opts=[];
      p.hand.filter(c=>c.sub==='tao'||c.sub==='jiu').forEach(c=>opts.push({label:`使用【${c.name}】自救`,value:'card_'+c.id}));
      if(p.knowledge>=1)opts.push({label:'消耗 1 学识自救',value:'know'});
      if((p.shield||0)>=1)opts.push({label:'消耗 1 知识护盾自救',value:'shield'});
      opts.push({label:'放弃',value:'giveup'});
      const ch=await waitChoice(idx,opts,'list');
      if(ch==='giveup'){p.alive=false;p.roleRevealed=true;addLog(`${p.name} 阵亡，身份【${ROLES[p.role].name}】`,'dmg');await FX.death(idx);break}
      if(ch==='know'){p.knowledge--;p.hp++;addLog(`${p.name} 消耗学识自救`,'heal');FX.healGlow(idx);Sound.play('tao');continue}
      if(ch==='shield'){p.shield--;p.hp++;addLog(`${p.name} 消耗护盾自救`,'heal');FX.healGlow(idx);Sound.play('tao');continue}
      if(ch.startsWith('card_')){const id=Number(ch.slice(5));const c=p.hand.find(x=>x.id===id);if(c){discardCard(p,c);p.hp++;addLog(`${p.name} 使用【${c.name}】自救`,'heal');FX.healGlow(idx);Sound.play('tao');continue}}
    }
  }
  render();
}
function shouldSave(healer,target){const h=healer.role,t=target.role;if(h==='lord'||h==='loyal')return t==='lord'||t==='loyal';if(h==='rebel')return t==='rebel';return false}
function checkWin(){
  if(G.gameOver)return;
  const alive=G.players.filter(p=>p.alive);
  const lord=G.players.find(p=>p.role==='lord');
  const rebelsAlive=alive.some(p=>p.role==='rebel');
  const spiesAlive=alive.some(p=>p.role==='spy');
  if(!lord.alive){if(!rebelsAlive&&spiesAlive&&alive.length===1&&alive[0].role==='spy'){G.gameOver=true;G.winnerText='内奸获胜'}else{G.gameOver=true;G.winnerText='反贼获胜'}addLog('⚑ '+G.winnerText,'hl');Sound.play('win');return}
  if(!rebelsAlive&&!spiesAlive){G.gameOver=true;G.winnerText='主公与忠臣获胜';addLog('⚑ '+G.winnerText,'hl');Sound.play('win')}
}

async function requestShan(targetIdx,srcIdx){
  const t=G.players[targetIdx];
  if(srcIdx>=0&&hasSkill(G.players[srcIdx],'xiangduilun')){const src=G.players[srcIdx];if(src.hand.length!==t.hand.length){addLog(`【相对论】此杀不可闪避`,'hl');return false}}
  if(t.isAI){
    const shan=t.hand.find(c=>c.sub==='shan');
    if(shan){discardCard(t,shan);addLog(`${t.name} 打出【闪】`);await FX.shield(targetIdx);Sound.play('shan');if(hasSkill(t,'sandadinglv')){drawCards(t,1);addLog(`【三大定律】${t.name} 摸一张牌`,'hl')}return true}
    if(t.knowledge>=1&&aiQuiz()){t.knowledge--;addLog(`${t.name} 消耗学识当闪`);await FX.shield(targetIdx);Sound.play('shan');return true}
    return false;
  }
  const opts=[];
  t.hand.filter(c=>c.sub==='shan').forEach(c=>opts.push({label:`出【闪】(${c.suit}${c.num})`,value:'card_'+c.id}));
  if(t.knowledge>=1)opts.push({label:'消耗 1 学识当闪',value:'know'});
  if((t.shield||0)>=1)opts.push({label:'消耗 1 知识护盾当闪',value:'shield'});
  opts.push({label:'答题免伤',value:'quiz'});
  opts.push({label:'承受伤害',value:'none'});
  const ch=await waitChoice(targetIdx,opts,'list');
  if(ch==='none')return false;
  if(ch==='know'){t.knowledge--;addLog(`${t.name} 消耗学识当闪`);await FX.shield(targetIdx);Sound.play('shan');return true}
  if(ch==='shield'){t.shield--;addLog(`${t.name} 消耗护盾当闪`);await FX.shield(targetIdx);Sound.play('shan');return true}
  if(ch==='quiz'){
    let ok;
    if(t.isAI)ok=aiQuiz(0.6);
    else if(isLocalPlayer(targetIdx))ok=await askQuiz(t,false);
    else ok=aiQuiz(0.6);
    if(ok){addLog(`${t.name} 答对，视为闪`,'hl');await FX.shield(targetIdx);Sound.play('shan');return true}
    addLog(`${t.name} 答错`,'dmg');return false;
  }
  if(ch.startsWith('card_')){const id=Number(ch.slice(5));const c=t.hand.find(x=>x.id===id);if(c){discardCard(t,c);addLog(`${t.name} 打出【闪】`);await FX.shield(targetIdx);Sound.play('shan');return true}}
  return false;
}

async function useSha(attackerIdx,targetIdx){
  const a=G.players[attackerIdx],t=G.players[targetIdx];
  const hasLiannu=a.equip.weapon&&a.equip.weapon.skill==='liannu';
  if(!hasLiannu&&a.flags.shaUsed>=1){addLog('本回合已使用过【杀】');return}
  a.flags.shaUsed=(a.flags.shaUsed||0)+1;
  addPlayLog(a.name,'use','杀',t.name);
  aiSpeak(a,'attack');
  FX.attackLunge(attackerIdx);Sound.play('sha');
  showPlayCard({name:'杀',suit:'♠',num:'?',type:'basic'},a.name);
  await FX.flyCard(attackerIdx,targetIdx,'杀','basic');
  if(t.equip.armor&&t.equip.armor.skill==='renwang'&&Math.random()<0.5){addLog(`${t.name} 的【仁王盾】抵消`,'heal');await FX.shield(targetIdx);Sound.play('shan');return}
  if(t.equip.armor&&t.equip.armor.skill==='bagua'&&Math.random()<0.5){addLog(`${t.name} 的【八卦阵】视为出闪`,'heal');await FX.shield(targetIdx);Sound.play('shan');return}
  const dodged=await requestShan(targetIdx,attackerIdx);
  if(dodged)return;
  let dmg=1;
  if(hasSkill(a,'jingzhong'))dmg+=1;
  if(a.flags.extraDamage){dmg+=a.flags.extraDamage;a.flags.extraDamage=0}
  await dealDamage(attackerIdx,targetIdx,dmg);
  if(a.equip.weapon&&a.equip.weapon.skill==='qinglong'&&t.alive&&Math.random()<0.5){addLog(`【青龙偃月刀】触发`);const sha=a.hand.find(c=>c.sub==='sha');if(sha){discardCard(a,sha);await useSha(attackerIdx,targetIdx)}}
}

async function discardTargetCard(targetIdx,srcIdx,mode){
  const t=G.players[targetIdx];
  if(hasSkill(t,'fenshu')){addLog(`【焚书】${t.name} 免疫`);return}

  if(t.equip.weapon)opts.push({label:`武器：${t.equip.weapon.name}`,value:'weapon'});
  if(t.equip.armor)opts.push({label:`防具：${t.equip.armor.name}`,value:'armor'});
  if(t.equip.horsePlus)opts.push({label:'+1马',value:'horsePlus'});
  if(t.equip.horseMinus)opts.push({label:'-1马',value:'horseMinus'});
  if(opts.length===0)return;
  const src=G.players[srcIdx];
  let ch;
  if(src.isAI)ch=opts[Math.floor(Math.random()*opts.length)].value;
  else ch=await waitChoice(srcIdx,opts,'list');
  if(ch==='hand'){const c=t.hand[Math.floor(Math.random()*t.hand.length)];discardCard(t,c);addLog(`${src.name} ${mode}了 ${t.name} 一张手牌`);if(mode==='获得')src.hand.push(c)}
  else{const c=t.equip[ch];if(c){t.equip[ch]=null;G.discard.push(c);addLog(`${src.name} ${mode}了 ${t.name} 的【${c.name}】`)}}
  render();
}

/* ============================================================

async function useActiveSkill(idx,skillId){
  const p=G.players[idx];
  if(p.flags.skillUsed){addLog('本回合已使用过主动技能');return}

  if(!sk)return;
  addLog(`【${sk.name}】${p.name} 发起技能挑战，需答题通过…`,'hl');
  render();
  let quizOk;
  if(p.isAI){quizOk=aiQuiz(0.62)}
  else if(isLocalPlayer(idx)){quizOk=await askQuiz(p,true)}
  else{quizOk=aiQuiz(0.62)}
  if(!quizOk){addLog(`${p.name} 知识不足，【${sk.name}】发动失败`,'dmg');floatTextFx(idx,'技能失败','#8a8070');Sound.play('wrong');render();if(NET.isHost)syncStateToClients();return}
  addPlayLog(p.name,'skill',sk.name,'');
  aiSpeak(p,'skill');
  Sound.play('skill');
  FX.skillWave(idx);
  showPlayCard({name:sk.name,suit:'✦',num:'',type:'trick'},p.name);
  switch(skillId){
    case 'nah':{if(p.hand.length===0){addLog('无手牌');break}const c=p.hand[0];discardCard(p,c);const ts=G.players.map((q,i)=>({q,i})).filter(x=>x.q.alive&&x.i!==idx);if(ts.length===0)break;let ti;if(p.isAI)ti=ts[Math.floor(Math.random()*ts.length)].i;else{const o=ts.map(x=>({label:x.q.name,value:x.i}));o.push({label:'取消',value:-1});ti=await waitChoice(idx,o,'target');if(ti<0)break}const t=G.players[ti];if(t.hand.length>0){const tc=t.hand[Math.floor(Math.random()*t.hand.length)];discardCard(t,tc);addLog(`${t.name} 弃一张牌`)}else await dealDamage(-1,ti,1);break}

    case 'tongchou':{if(p.hand.length===0){addLog('无手牌');break}const c=p.hand[0];discardCard(p,c,false);const ts=G.players.map((q,i)=>({q,i})).filter(x=>x.q.alive&&x.i!==idx);let ti;if(p.isAI)ti=ts[0].i;else{const o=ts.map(x=>({label:x.q.name,value:x.i}));ti=await waitChoice(idx,o,'target')}const t=G.players[ti];t.hand.push(c);drawCards(p,1);addLog(`将一张手牌交给 ${t.name}，然后摸一张牌`);break}

  render();
  if(NET.isHost)syncStateToClients();
}

/* ============================================================
   回合流程
   ============================================================ */
async function runTurn(idx){
  const p=G.players[idx];if(!p.alive)return;
  p.flags.shaUsed=0;p.flags.skillUsed=false;p.flags.noSha=false;
  G.current=idx;
  addLog(`—— ${p.name} 的回合 ——`,'hl');
  Sound.play('turn');
  if(p.isAI)aiSpeak(p,'idle');
  render();
  await judgePhase(p);
  let drawN=2;
  if(hasSkill(p,'youxuan'))drawN+=1;
  drawCards(p,drawN);
  addLog(`${p.name} 摸 ${drawN} 张牌`);
  if(hasSkill(p,'youxuan')&&p.hand.length>0){const c=p.hand[0];discardCard(p,c);addLog(`【优选法】${p.name} 弃一张牌`)}
  render();
  if(p.isAI){
    if(aiQuiz()){drawCards(p,1);p.knowledge++;grantLearningReward(p,false,null);addLog(`${p.name} 参悟成功`,'hl')}
    else addLog(`${p.name} 参悟失败`);
  }else{
    const ch=await waitChoice(idx,[{label:'参悟答题（答对多摸1张+1学识+随机奖励）',value:'quiz'},{label:'跳过',value:'skip'}],'list');
    if(ch==='quiz'){const ok=await askQuiz(p,false);if(ok){drawCards(p,1);addLog('参悟成功！','hl')}else addLog('参悟失败','dmg')}
  }
  render();
  if(p.alive&&!p.flags.skipPlay)await playPhase(idx);
  if(p.alive)await discardPhase(p);
  render();
}
async function judgePhase(p){
  if(p.judge.length===0)return;
  for(let i=p.judge.length-1;i>=0;i--){
    const j=p.judge[i];if(!j.judgeType)continue;
    p.judge.splice(i,1);
    const card=G.deck.pop()||C('判定','basic','none','♠',1);
    addLog(`${p.name} 判定：${card.suit}${card.num}`,'hl');
    await FX.judge(G.players.indexOf(p),card);
    if(hasSkill(p,'kuangda')&&card.suit==='♥'){drawCards(p,1);addLog(`【旷达】摸一张牌`,'hl')}
    if(j.judgeType==='lebu'){if(card.suit!=='♥'){p.flags.skipPlay=true;addLog('【乐不思蜀】生效，跳过出牌','dmg')}else addLog('判定为红桃，乐不思蜀失效');G.discard.push(card)}
    else if(j.judgeType==='shandian'){if(card.suit==='♠'&&card.num>=2&&card.num<=9){addLog('【闪电】命中！','dmg');G.discard.push(card);await dealDamage(-1,G.players.indexOf(p),3,'thunder')}else{addLog('闪电未命中，移动到下家');const next=(G.players.indexOf(p)+1)%G.players.length;G.players[next].judge.push({...j});G.discard.push(card)}}
    if(!p.alive)break;
  }
  render();
}
async function playPhase(idx){
  const p=G.players[idx];
  if(p.isAI){await aiPlayPhase(idx);return}
  while(p.alive&&!G.gameOver){
    const opts=[];
    for(const c of p.hand){
      if(c.sub==='sha')opts.push({label:`【杀】${c.suit}${c.num}`,value:'sha_'+c.id});
      else if(c.sub==='tao'&&p.hp<p.maxHp)opts.push({label:`【桃】`,value:'tao_'+c.id});
      else if(c.sub==='jiu')opts.push({label:`【酒】`,value:'jiu_'+c.id});
      else if(c.type==='trick')opts.push({label:`【${c.name}】`,value:'trick_'+c.id});
      else if(c.type==='equip')opts.push({label:`【${c.name}】`,value:'equip_'+c.id});
    }
    if(!p.flags.skillUsed){p.skills.forEach(s=>{if(s.type==='active')opts.push({label:`▶${s.name}（需答题）`,value:'skill_'+s.id,skill:true})})}
    opts.push({label:'结束出牌',value:'end'});
    const ch=await waitChoice(idx,opts,'play');
    if(ch==='end'||!ch)break;
    if(!p.alive||G.gameOver)break;
    if(ch.startsWith('skill_')){await useActiveSkill(idx,ch.slice(6));continue}
    const [kind,idStr]=ch.split('_');const id=Number(idStr);
    const card=p.hand.find(c=>c.id===id);if(!card)continue;
    if(kind==='sha'){
      if(p.flags.noSha){addLog('本回合不能使用【杀】');continue}
      const targets=[];
      for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(inRange(idx,i))targets.push({label:`攻击 ${G.players[i].name}`,value:i})}
      if(targets.length===0){addLog('攻击范围内无目标');continue}
      targets.push({label:'取消',value:-1});
      const t=await waitChoice(idx,targets,'target');if(t<0)continue;
      discardCard(p,card);Sound.play('play');
      await useSha(idx,t);
    }else if(kind==='tao'){discardCard(p,card);Sound.play('play');await useTao(idx)}
    else if(kind==='jiu'){discardCard(p,card);Sound.play('play');await useJiu(idx)}
    else if(kind==='trick'){
      let tgt=null;
      if(['guohe','shunshou','juedou','lebu'].includes(card.sub)){
        const targets=[];
        for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(card.sub==='shunshou'&&distBetween(idx,i)>1)continue;if(hasSkill(G.players[i],'fenshu'))continue;targets.push({label:G.players[i].name,value:i})}
        if(targets.length===0){addLog('无合法目标');continue}
        targets.push({label:'取消',value:-1});
        const t=await waitChoice(idx,targets,'target');if(t<0)continue;tgt=t;
      }
      discardCard(p,card);Sound.play('play');await useTrick(idx,card,tgt);
    }else if(kind==='equip'){
      discardCard(p,card,false);Sound.play('play');
      showPlayCard(card,p.name);addPlayLog(p.name,'use',card.name,'');
      if(card.sub==='weapon'){if(p.equip.weapon)G.discard.push(p.equip.weapon);p.equip.weapon=card;addLog(`${p.name} 装备【${card.name}】`)}
      else if(card.sub==='armor'){if(p.equip.armor)G.discard.push(p.equip.armor);p.equip.armor=card;addLog(`${p.name} 装备【${card.name}】`)}
      else if(card.sub==='horse+'){if(p.equip.horsePlus)G.discard.push(p.equip.horsePlus);p.equip.horsePlus=card;addLog(`${p.name} 装备【${card.name}】`)}
      else if(card.sub==='horse-'){if(p.equip.horseMinus)G.discard.push(p.equip.horseMinus);p.equip.horseMinus=card;addLog(`${p.name} 装备【${card.name}】`)}
      render();
    }
    if(!p.alive||G.gameOver)break;
  }
}
async function discardPhase(p){
  const limit=handLimit(p);
  while(p.hand.length>limit&&p.hand.length>0){
    if(p.isAI){const c=p.hand.pop();G.discard.push(c)}
    else{
      const opts=p.hand.map(c=>({label:`弃置 ${c.name} ${c.suit}${c.num}`,value:c.id}));
      const ch=await waitChoice(G.players.indexOf(p),opts,'list');
      const c=p.hand.find(x=>x.id===ch);
      if(c){discardCard(p,c);addLog(`${p.name} 弃置【${c.name}】`)}
    }
  }
  render();
}

/* ============================================================
   AI
   ============================================================ */
async function aiPlayPhase(idx){
  const p=G.players[idx];
  if(!p.flags.skillUsed&&p.skills.some(s=>s.type==='active')&&Math.random()<0.5){
    const act=p.skills.find(s=>s.type==='active');
    await useActiveSkill(idx,act.id);
    await sleep(400);
  }
  for(const c of [...p.hand]){
    if(c.type==='equip'&&p.alive){
      discardCard(p,c,false);Sound.play('play');showPlayCard(c,p.name);addPlayLog(p.name,'use',c.name,'');
      if(c.sub==='weapon'){if(p.equip.weapon)G.discard.push(p.equip.weapon);p.equip.weapon=c}
      else if(c.sub==='armor'){if(p.equip.armor)G.discard.push(p.equip.armor);p.equip.armor=c}
      else if(c.sub==='horse+'){if(p.equip.horsePlus)G.discard.push(p.equip.horsePlus);p.equip.horsePlus=c}
      else if(c.sub==='horse-'){if(p.equip.horseMinus)G.discard.push(p.equip.horseMinus);p.equip.horseMinus=c}
      addLog(`${p.name} 装备【${c.name}】`);
      await sleep(300);
    }
  }
  while(p.hp<p.maxHp&&p.alive){const tao=p.hand.find(c=>c.sub==='tao');if(!tao)break;discardCard(p,tao);Sound.play('play');await useTao(idx);await sleep(300)}
  const wz=p.hand.find(c=>c.sub==='wuzhong');if(wz){discardCard(p,wz);Sound.play('play');await useTrick(idx,wz,null);await sleep(300)}
  if(p.alive&&!p.flags.noSha&&p.flags.shaUsed<1){
    const sha=p.hand.find(c=>c.sub==='sha');
    if(sha){const ts=[];for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(inRange(idx,i)&&isEnemy(p,G.players[i]))ts.push(i)}if(ts.length>0){discardCard(p,sha);Sound.play('play');await useSha(idx,ts[0]);await sleep(300)}}
  }
  if(p.alive){
    const tr=p.hand.find(c=>['guohe','shunshou','juedou','nanman','wanjian','taoyuan','lebu'].includes(c.sub));
    if(tr){let tgt=null;if(['guohe','shunshou','juedou','lebu'].includes(tr.sub)){const ts=[];for(let i=0;i<G.players.length;i++){if(i===idx||!G.players[i].alive)continue;if(tr.sub==='shunshou'&&distBetween(idx,i)>1)continue;if(hasSkill(G.players[i],'fenshu'))continue;if(isEnemy(p,G.players[i]))ts.push(i)}if(ts.length>0)tgt=ts[0]}if(tgt!=null||!['guohe','shunshou','juedou','lebu'].includes(tr.sub)){discardCard(p,tr);Sound.play('play');await useTrick(idx,tr,tgt);await sleep(300)}}
  }
  render();
}
function isEnemy(a,b){if(a.role==='lord'||a.role==='loyal')return b.role==='rebel'||b.role==='spy';if(a.role==='rebel')return b.role==='lord'||b.role==='loyal';if(a.role==='spy'){const rebelsAlive=G.players.filter(p=>p.alive&&p.role==='rebel').length;if(rebelsAlive>0)return b.role==='rebel';return b.role==='lord'||b.role==='loyal'}return false}

/* ============================================================
   主循环
   ============================================================ */
async function gameLoop(){
  while(!G.gameOver){
    const p=G.players[G.current];
    if(p.alive)await runTurn(G.current);
    if(G.gameOver)break;
    let next=G.current;
    for(let k=1;k<=G.players.length;k++){const idx=(G.current+k)%G.players.length;if(G.players[idx].alive){next=idx;break}}
    G.current=next;await sleep(200);
  }
  render();
}

/* ============================================================
   游戏启动
   ============================================================ */
function setupPlayers(playerCount,localChar,localName){
  const roleDeck=[...ROLE_CONFIG[playerCount]];
  const lordIdx=roleDeck.indexOf('lord');
  const others=roleDeck.filter((_,i)=>i!==lordIdx);
  shuffle(others);
  const finalRoles=[];let oi=0;
  for(let i=0;i<roleDeck.length;i++)finalRoles.push(i===lordIdx?'lord':others[oi++]);
  const myRole='lord';
  const otherRoles=finalRoles.filter(r=>r!=='lord');
  shuffle(otherRoles);
  const roles=[myRole,...otherRoles];
  const aiChars=CHARACTERS.filter(c=>c.id!==localChar.id);
  shuffle(aiChars);
  G.players=[];G.grade=SELECTED_GRADE;G.playerCount=playerCount;G.gameOver=false;G.current=0;G.winnerText='';
  G.deck=buildDeck();G.discard=[];
  quizStats={total:0,correct:0};playLog=[];chatMessages=[];
  const newPlayer=(id,name,char,role,isAI,peerId)=>({
    id,name,avatar:char.avatar,subject:char.subject,charId:char.id,
    role,roleRevealed:role==='lord',hp:role==='lord'?char.hp+1:char.hp,maxHp:role==='lord'?char.hp+1:char.hp,
    hand:[],equip:{weapon:null,armor:null,horsePlus:null,horseMinus:null},judge:[],
    knowledge:0,shield:0,combo:0,maxCombo:0,subjectMastery:{},
    alive:true,isAI,skills:char.skills,peerId:peerId||null,
    flags:{shaUsed:0,skillUsed:false,extraDamage:0,skipPlay:false,noSha:false}
  });
  G.players.push(newPlayer(0,localName,localChar,roles[0],false,NET.isHost?NET.myPeerId:null));
  const remotePeerIds=NET.isHost?Object.keys(NET.playerConns):[];
  for(let i=1;i<playerCount;i++){
    let name,char,isAI,peerId;
    if(i-1<remotePeerIds.length){const conn=NET.playerConns[remotePeerIds[i-1]];name=conn?.metadata?.name||'玩家'+i;peerId=remotePeerIds[i-1];char=aiChars[(i-1)%aiChars.length];isAI=false}
    else{name='AI·'+aiChars[(i-1)%aiChars.length].name;char=aiChars[(i-1)%aiChars.length];isAI=true;peerId=null}
    G.players.push(newPlayer(i,name,char,roles[i],isAI,peerId));
  }
  G.players.forEach(p=>drawCards(p,4));
  G.current=0;G.myPlayerIdx=0;G.started=true;
}
