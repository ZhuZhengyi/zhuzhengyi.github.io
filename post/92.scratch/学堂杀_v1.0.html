  remotePlayers.forEach(p=>{
    const idx=G.players.indexOf(p);
    NET.sendToPlayer(p.peerId,{type:'start_game',players:G.players.map(pl=>({...pl,hand:pl.isAI?pl.hand:[]})),myPlayerIdx:idx,grade:G.grade,playerCount:SELECTED_COUNT});
  });
  document.getElementById('screenLobby').classList.remove('active');
  document.getElementById('screenGame').classList.add('active');
  clearPlayZone();
  addLog('游戏开始。你是主公，身份已公开。','hl');
  addChat('系统','欢迎来到学堂杀联机房！','sys');
  render();
  if(G.players[1])setTimeout(()=>aiSpeak(G.players[1],'greet'),1500);
  gameLoop();
}
async function joinRoom(){
  const nick=(document.getElementById('joinNick').value||'玩家').trim().slice(0,12);
  const code=(document.getElementById('joinCode').value||'').trim();
  if(!/^\d{6}$/.test(code)){alert('请输入6位数字房间号');return}
  document.getElementById('joinStatus').textContent='正在连接房间…';
  try{
    await NET.joinRoom(code,nick);
    document.getElementById('joinStatus').innerHTML='<span style="color:#27ae60;">已连接房主，等待开始…</span>';
  }catch(e){document.getElementById('joinStatus').innerHTML='<span style="color:#e74c3c;">连接失败：'+e.type+'</span>'}
}

/* ============================================================
   大厅 UI
   ============================================================ */
let SELECTED_GRADE='初二';let SELECTED_COUNT=4;let SELECTED_CHAR=CHARACTERS[0];let SELECTED_MODE='single';

document.getElementById('gradePicker').addEventListener('click',e=>{const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');document.querySelectorAll('#gradePicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');SELECTED_GRADE=b.dataset.grade});
document.getElementById('playerCountPicker').addEventListener('click',e=>{const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');document.querySelectorAll('#playerCountPicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');SELECTED_COUNT=Number(b.dataset.count);updateAIHint()});
document.getElementById('modePicker').addEventListener('click',e=>{const b=e.target.closest('.opt-btn');if(!b)return;Sound.play('click');document.querySelectorAll('#modePicker .opt-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');SELECTED_MODE=b.dataset.mode;updateLobbyMode()});

function updateLobbyMode(){
  const hc=document.getElementById('hostConfig');const jc=document.getElementById('joinConfig');
  const sb=document.getElementById('startBtn');const rc=document.getElementById('roomConfig');
  if(SELECTED_MODE==='single'){hc.style.display='block';jc.style.display='none';if(rc)rc.style.display='none';sb.textContent='开始单机对局';sb.onclick=startSingle;sb.style.display='block'}
  else if(SELECTED_MODE==='host'){hc.style.display='block';jc.style.display='none';if(rc)rc.style.display='block';sb.style.display='none'}
  else{hc.style.display='none';jc.style.display='block';sb.style.display='none'}
}
function updateAIHint(){const h=document.getElementById('aiCountHint');if(h)h.textContent=`将补充 ${SELECTED_COUNT-1} 名 AI（房主模式下空位由AI补齐）`}
function renderCharPicker(){
  const grid=document.getElementById('charGrid');
  grid.innerHTML=CHARACTERS.map(c=>`
    <div class="char-card ${c.id===SELECTED_CHAR.id?'selected':''}" data-id="${c.id}" onclick="selectChar('${c.id}')">
      <div class="ctop"><span class="cavatar">${c.avatar}</span><div><div class="cname">${c.name}</div><div class="ctitle">${c.title}</div></div></div>
      <div class="csubject">${SUBJECT_ICON[c.subject]||''} ${c.subject} · 体力${c.hp}</div>
      <div class="cskill">${c.skills.map(s=>`<b>${s.name}</b>：${s.desc}`).join('<br>')}</div>
    </div>
  `).join('');
}
function selectChar(id){Sound.play('click');SELECTED_CHAR=CHARACTERS.find(c=>c.id===id);renderCharPicker()}

/* ============================================================
   渲染
   ============================================================ */
const EQUIP_ICON={weapon:'⚔️',armor:'🛡️',horsePlus:'🐎',horseMinus:'🐎'};
const EQUIP_LABEL={weapon:'武器',armor:'防具',horsePlus:'+1马',horseMinus:'-1马'};
const JUDGE_ICON={lebu:'🎋',shandian:'⚡'};

function buildPlayerCard(p,i){
  const isTurn=i===G.current;
  const roleColor=p.roleRevealed?ROLES[p.role].color:'#5a4a3a';
  const hpGems=Array.from({length:p.maxHp},(_,k)=>{const f=k<p.hp;const low=p.hp<=1&&f;return `<span class="hp-gem ${f?'':'empty'} ${low?'low':''}"></span>`}).join('');
  const equipSlots=['weapon','armor','horsePlus','horseMinus'].map(k=>{const eq=p.equip[k];const f=!!eq;const tip=f?eq.name:EQUIP_LABEL[k]+'（空）';return `<div class="equip-slot ${f?'filled':''}" data-tip="${tip}"><span class="eq-icon">${EQUIP_ICON[k]}</span></div>`}).join('');
  const handCount=p.hand.length;
  const dispCount=Math.min(handCount,4);
  const miniCards=Array.from({length:dispCount},()=>'<div class="mini-card"></div>').join('');
  const judgeTags=p.judge.map(j=>`<span class="judge-tag">${JUDGE_ICON[j.judgeType]||'❓'}${j.name}</span>`).join('');
  const isSelf=(i===G.myPlayerIdx);
  const aiTag=p.isAI?'<span style="font-size:8px;color:#8a8070;">[AI]</span>':'';
  let badges='';
  if((p.shield||0)>0)badges+=`<span class="badge badge-shield">🛡️${p.shield}</span>`;
  if((p.combo||0)>=2)badges+=`<span class="badge badge-combo">⚡${p.combo}</span>`;
  const masteredSubjects=Object.entries(p.subjectMastery||{}).filter(([s,n])=>n>=3).map(([s])=>s);
  if(masteredSubjects.length>0)badges+=`<span class="badge badge-master">🎓${masteredSubjects.length}</span>`;
  return `<div class="p-card ${!p.alive?'dead':''} ${isTurn?'turn':''} ${isSelf?'is-self':''}">
    <div class="pheader"><div class="pavatar">${p.avatar}</div><div class="pname-block"><div class="pname">${p.name} ${aiTag}</div><div class="prole" style="color:${roleColor}">${p.roleRevealed?'【'+ROLES[p.role].name+'】':'身份未知'}</div></div></div>
    <div class="pknow">🔮${p.knowledge}</div>
    <div class="php-bar">${hpGems}</div>
    <div class="pequip-slots">${equipSlots}</div>
    <div class="pfooter"><div class="hand-pile">${miniCards}<span class="hand-count">${handCount}</span></div></div>
    <div class="p-badges">${badges}</div>
    ${judgeTags?`<div class="pjudge-row">${judgeTags}</div>`:''}
  </div>`;
}
function seatPos(rel,total){const angle=90-(rel*360/total);const rad=angle*Math.PI/180;const rx=38,ry=36;return{x:50+rx*Math.cos(rad),y:50+ry*Math.sin(rad)}}
function renderSeats(){
  const ring=document.getElementById('seatRing');if(!ring)return;
  const total=G.players.length;
  const targetValues=new Set();
  if(G.targetSelectable&&G.pendingOptions){G.pendingOptions.forEach(o=>{if(typeof o.value==='number'&&o.value>=0&&o.value<total)targetValues.add(o.value)})}
  let html='';
  G.players.forEach((p,i)=>{
    const rel=(i-G.myPlayerIdx+total)%total;
    const pos=seatPos(rel,total);
    const isTarget=targetValues.has(i);
    const clickAttr=isTarget?`onclick="clickTargetSeat(${i})"`:'';
    const cls=isTarget?'seat-targetable':'';
    html+=`<div class="seat ${cls}" data-idx="${i}" ${clickAttr} style="left:${pos.x}%;top:${pos.y}%;">${buildPlayerCard(p,i)}</div>`;
  });
  ring.innerHTML=html;
}
function render(){
  if(!G.started)return;
  const me=G.players[G.myPlayerIdx];if(!me)return;
  
  // 1. 计算交互状态
  G.handClickable=false;G.targetSelectable=false;
  let hintText='';let btnHtml='';let hintClass='';
  if(G.gameOver){
    hintText=`<span style="color:var(--gold);font-size:15px">${G.winnerText}</span>`;
  }else if(G.pendingOptions&&G.pendingPlayer===G.myPlayerIdx){
    if(G.pendingType==='play'){
      hintText='💡 点击手牌出牌 · 点击技能发动（需答题） · 或结束出牌';
      hintClass='hint-play';
      const skillBtns=G.pendingOptions.filter(o=>typeof o.value==='string'&&o.value.startsWith('skill_'));
      skillBtns.forEach(o=>{btnHtml+=`<button class="btn btn-sm btn-skill" onclick="handleLocalChoice('${o.value}')">${o.label}</button>`});
      if(G.pendingOptions.some(o=>o.value==='end'))btnHtml+=`<button class="btn btn-sm" onclick="handleLocalChoice('end')">结束出牌</button>`;
      G.handClickable=true;
    }else if(G.pendingType==='target'){
      hintText='🎯 点击座位卡选择目标';
      hintClass='hint-target';
      if(G.pendingOptions.some(o=>o.value===-1))btnHtml+=`<button class="btn btn-sm" onclick="handleLocalChoice(-1)">取消</button>`;
      G.targetSelectable=true;
    }else{
      hintText='请选择：';
      btnHtml=G.pendingOptions.map(o=>`<button class="btn btn-sm ${o.skill?'btn-skill':''}" onclick="handleLocalChoice('${o.value}')">${o.label}</button>`).join('');
    }
  }else if(G.pendingOptions&&G.pendingPlayer!==G.myPlayerIdx){
    const other=G.players[G.pendingPlayer];
    hintText=`等待 ${other?.name||'?'} 选择中…`;
  }else if(G.players[G.current]&&G.players[G.current].isAI){
    hintText=`等待 ${G.players[G.current].name} 行动…`;
  }else if(G.players[G.current]===me){
    hintText='请稍候…';
  }else{
    hintText=`等待 ${G.players[G.current].name} 行动…`;
  }
  
  // 2. Top bar
  document.getElementById('turnName').textContent=G.players[G.current]?.name||'—';
  document.getElementById('phaseLabel').textContent=G.gameOver?'游戏结束':'出牌阶段';
  const rate=quizStats.total>0?Math.round(quizStats.correct/quizStats.total*100):0;
  document.getElementById('selfInfo').textContent=`${me.name} · ${ROLES[me.role].name} · ${G.grade} · 正确率 ${rate}%`;
  const connEl=document.getElementById('connInfo');
  if(NET.mode==='host')connEl.textContent=`房间 ${NET.roomCode} · ${Object.keys(NET.playerConns).length+1}人`;
  else if(NET.mode==='join')connEl.textContent='已连接房主';
  else connEl.textContent='';
  
  // 3. 座位
  renderSeats();
  
  // 4. 手牌
  const hand=document.getElementById('handRow');
  hand.innerHTML=me.hand.map(c=>{
    const color=(c.suit==='♥'||c.suit==='♦')?'red':'black';
    let cardCls='';let onclick='';
    if(G.handClickable){
      const hasOpt=G.pendingOptions.some(o=>o.value===`sha_${c.id}`||o.value===`tao_${c.id}`||o.value===`jiu_${c.id}`||o.value===`trick_${c.id}`||o.value===`equip_${c.id}`);
      if(hasOpt){cardCls='clickable';onclick=`onclick="clickHandCard(${c.id})"`}
      else{cardCls='disabled'}
    }
    return `<div class="card ${color} ${cardCls}" ${onclick}><span class="suit">${c.suit}</span><span class="num">${c.num}</span><span class="cname">${c.name}</span><span class="ctype">${c.type==='basic'?'基本':c.type==='trick'?'锦囊':'装备'}</span></div>`;
  }).join('')||'<div style="color:var(--muted);font-size:12px;padding:20px">无手牌</div>';
  
  // 5. 操作区
  const hintEl=document.getElementById('actionHint');
  hintEl.innerHTML=hintText;
  hintEl.className='action-hint '+(hintClass||'');
  document.getElementById('actionBtns').innerHTML=btnHtml;
  
  // 6. 牌堆
  document.getElementById('deckCount').textContent=G.deck.length;
  document.getElementById('discardCount').textContent=G.discard.length;
  
  // 7. 聊天面板显隐（仅多人）
  const chatPanel=document.getElementById('chatPanel');
  if(chatPanel)chatPanel.style.display=(NET.mode==='single')?'none':'flex';
}
renderCharPicker();
updateAIHint();
updateLobbyMode();
window.addEventListener('error',e=>{console.error('全局错误:',e.error||e.message)});
</script>
