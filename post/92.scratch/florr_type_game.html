// ===== 音效系统（Web Audio API） =====
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, duration, type = 'sine', volume = 0.3) {
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) { /* ignore */ }
}

function playCorrectSound() {
    playTone(880, 0.15, 'sine', 0.3);
    setTimeout(() => playTone(1100, 0.15, 'sine', 0.25), 150);
}

function playWrongSound() {
    playTone(330, 0.3, 'sawtooth', 0.2);
}

function playStartSound() {
    playTone(523, 0.1, 'sine', 0.2);
    setTimeout(() => playTone(659, 0.1, 'sine', 0.2), 120);
    setTimeout(() => playTone(784, 0.15, 'sine', 0.25), 240);
}

function playMemoryStartSound() {
    playTone(440, 0.2, 'sine', 0.2);
    setTimeout(() => playTone(554, 0.2, 'sine', 0.2), 200);
    setTimeout(() => playTone(659, 0.3, 'sine', 0.25), 400);
}

// ===== 语音拼读 =====
function speakWordWithSpelling(word, callback) {
    if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
    }
    // 先朗读单词
    const utter1 = new SpeechSynthesisUtterance(word);
    utter1.lang = 'en-US';
    utter1.rate = 0.9;
    utter1.onend = function() {
        // 然后逐个字母拼读（间隔0.3秒）
        const letters = word.split('');
        let idx = 0;
        function speakNext() {
            if (idx >= letters.length) {
                if (callback) callback();
                return;
            }
            const utter = new SpeechSynthesisUtterance(letters[idx]);
            utter.lang = 'en-US';
            utter.rate = 0.7;
            utter.pitch = 1.1;
            utter.onend = function() {
                idx++;
                setTimeout(speakNext, 200);
            };
            speechSynthesis.speak(utter);
        }
        setTimeout(speakNext, 300);
    };
    speechSynthesis.cancel();
    speechSynthesis.speak(utter1);
}

// ===== 游戏核心 =====
const STORAGE_KEY = 'wordGameData';
let gameData = {
    vocab: [],
    userWords: [],
    level: 1,
    xp: 0,
    stars: 0,
    achievements: [],
    statistics: { correct: 0, wrong: 0, gamesPlayed: 0 },
    settings: { reviewMode: true, gradeFilter: 'all' }
};
let currentGame = {
    mode: 'memory',
    isRunning: false,
    isMultiplayer: false,
    currentWord: null,
    currentWordIdx: -1,
    score: 0,
    correctCount: 0,
    wrongCount: 0,
    combo: 0,
    maxCombo: 0,
    timer: null,
    timeLeft: 60,
    players: [{ correct:0, wrong:0, score:0 }, { correct:0, wrong:0, score:0 }],
    currentPlayer: 0,
    turn: 0,
    totalTurns: 10,
    wordQueue: [],
    usedIndices: [],
    memoryPhase: 'show',
    memoryTimer: null,
    memoryCountdown: 3,
    _translateDir: 'en2zh'
};

const $ = id => document.getElementById(id);
const els = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];

// 数据持久化
function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            gameData = Object.assign({}, gameData, parsed);
            if (!gameData.vocab || gameData.vocab.length === 0) {
                gameData.vocab = BASE_VOCAB.map(w => ({ ...w, reviewCount: 0, nextReview: 0, lastSeen: 0 }));
            }
            if (!gameData.userWords) gameData.userWords = [];
            if (!gameData.achievements) gameData.achievements = [];
            if (!gameData.statistics) gameData.statistics = { correct:0, wrong:0, gamesPlayed:0 };
            if (!gameData.settings) gameData.settings = { reviewMode: true, gradeFilter: 'all' };
            gameData.userWords = gameData.userWords.filter(idx => idx < gameData.vocab.length);
        } else {
            gameData.vocab = BASE_VOCAB.map(w => ({ ...w, reviewCount: 0, nextReview: 0, lastSeen: 0 }));
            gameData.userWords = [];
            gameData.achievements = [];
            gameData.statistics = { correct:0, wrong:0, gamesPlayed:0 };
            gameData.settings = { reviewMode: true, gradeFilter: 'all' };
            saveData();
        }
    } catch(e) {
        console.warn('Load error', e);
        gameData.vocab = BASE_VOCAB.map(w => ({ ...w, reviewCount: 0, nextReview: 0, lastSeen: 0 }));
        gameData.userWords = [];
        gameData.achievements = [];
        gameData.statistics = { correct:0, wrong:0, gamesPlayed:0 };
        gameData.settings = { reviewMode: true, gradeFilter: 'all' };
        saveData();
    }
    if (gameData.vocab.length === 0) {
        alert('词汇加载失败，请刷新页面');
    }
}
function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(gameData)); } catch(e) {}
}
function shuffleArray(arr) {
    for (let i=arr.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function getGradeLabel(g) {
    const map = {7:'初一',8:'初二',9:'初三',10:'高一',11:'高二',12:'高三'};
    return map[g] || g;
}
function getFilteredVocab() {
    const grade = gameData.settings.gradeFilter;
    let list = gameData.vocab;
    if (grade !== 'all') {
        const g = parseInt(grade);
        list = list.filter(w => w.grade === g);
    }
    return list;
}
function addWord(en, zh, grade) {
    if (gameData.vocab.some(w => w.en.toLowerCase() === en.toLowerCase())) return false;
    const newWord = { en, zh, grade: parseInt(grade), reviewCount:0, nextReview:0, lastSeen:0, example: '' };
    gameData.vocab.push(newWord);
    gameData.userWords.push(gameData.vocab.length-1);
    saveData();
    renderWordList();
    return true;
}
function removeWord(index) {
    if (gameData.userWords.includes(index)) {
        gameData.userWords = gameData.userWords.filter(i => i !== index);
        gameData.vocab.splice(index, 1);
        gameData.userWords = gameData.userWords.map(i => i > index ? i-1 : i);
        saveData();
        renderWordList();
        return true;
    }
    return false;
}

// 成就系统
const ACHIEVEMENTS = [
    { id:'first_win', name:'首战告捷', check:() => gameData.statistics.gamesPlayed>=1 },
    { id:'ten_correct', name:'小试牛刀', check:() => gameData.statistics.correct>=10 },
    { id:'hundred_correct', name:'百词斩', check:() => gameData.statistics.correct>=100 },
    { id:'combo_5', name:'连击大师', check:() => currentGame.maxCombo>=5 },
    { id:'combo_10', name:'十连绝世', check:() => currentGame.maxCombo>=10 },
    { id:'level_5', name:'进阶学者', check:() => gameData.level>=5 },
    { id:'level_10', name:'词汇大师', check:() => gameData.level>=10 },
    { id:'star_collector', name:'星光璀璨', check:() => gameData.stars>=50 },
];
function checkAchievements() {
    let unlocked = [];
    ACHIEVEMENTS.forEach(a => {
        if (!gameData.achievements.includes(a.id) && a.check()) {
            gameData.achievements.push(a.id);
            unlocked.push(a.name);
        }
    });
    if (unlocked.length) {
        saveData();
        showFeedback('🏆 解锁成就: ' + unlocked.join('、'), 'correct');
    }
}
function addXP(amount) {
    gameData.xp += amount;
    while (gameData.xp >= gameData.level * 100) {
        gameData.xp -= gameData.level * 100;
        gameData.level++;
        showFeedback('🎉 升级！等级 ' + gameData.level, 'correct');
        checkAchievements();
    }
    updateStatus();
    saveData();
}
function updateStatus() {
    $('levelDisplay').textContent = gameData.level;
    $('xpDisplay').textContent = gameData.xp;
    $('starDisplay').textContent = gameData.stars;
    $('correctDisplay').textContent = currentGame.correctCount || gameData.statistics.correct;
    $('wrongDisplay').textContent = currentGame.wrongCount || gameData.statistics.wrong;
    $('timerValue').textContent = currentGame.timeLeft;
}
function showFeedback(msg, type='info') {
    const fb = $('feedback');
    fb.textContent = msg;
    fb.className = 'feedback ' + (type === 'correct' ? 'correct' : type === 'wrong' ? 'wrong' : '');
}
function updateProgress(pct) {
    $('progressFill').style.width = Math.min(100, pct) + '%';
}
function renderWordList() {
    const container = $('wordList');
    container.innerHTML = '';
    gameData.vocab.forEach((w, idx) => {
        const div = document.createElement('div');
        div.className = 'word-item';
        const isCustom = gameData.userWords.includes(idx);
        div.innerHTML = `<span>${w.en} - ${w.zh} (${getGradeLabel(w.grade)}) ${isCustom ? '📝' : ''}</span>`;
        if (isCustom) {
            const del = document.createElement('span');
            del.className = 'del';
            del.textContent = '✕';
            del.dataset.idx = idx;
            del.onclick = () => { if(confirm('删除该词？')) removeWord(idx); };
            div.appendChild(del);
        }
        container.appendChild(div);
    });
}

function getRandomFlower() {
    const flowers = ['🌸','🌺','🌻','🌹','🌷','🌼','🌸','🌺','🌻'];
    return flowers[Math.floor(Math.random()*flowers.length)];
}

// ===== 开始游戏 =====
function startGame(mode) {
    console.log('startGame', mode);
    if (currentGame.timer) clearInterval(currentGame.timer);
    if (currentGame.memoryTimer) clearInterval(currentGame.memoryTimer);
    currentGame.mode = mode;
    currentGame.isRunning = true;
    currentGame.isMultiplayer = (mode === 'multiplayer');
    currentGame.correctCount = 0;
    currentGame.wrongCount = 0;
    currentGame.combo = 0;
    currentGame.maxCombo = 0;
    currentGame.score = 0;
    currentGame.timeLeft = (mode === 'multiplayer' || mode === 'memory') ? 999 : 60;
    currentGame.turn = 0;
    currentGame.currentPlayer = 0;
    currentGame.players = [{ correct:0, wrong:0, score:0 }, { correct:0, wrong:0, score:0 }];
    currentGame.memoryPhase = 'show';
    currentGame.memoryCountdown = 3;

    const filtered = getFilteredVocab();
    if (filtered.length === 0) {
        showFeedback('⚠️ 当前无词汇，请调整筛选', 'wrong');
        currentGame.isRunning = false;
        $('startBtn').classList.remove('hidden');
        alert('词汇为空，请修改年级筛选或添加词汇。');
        return;
    }
    let totalQuestions = (mode === 'multiplayer') ? currentGame.totalTurns * 2 : 15;
    let pool = filtered.slice();
    shuffleArray(pool);
    if (pool.length > totalQuestions) pool = pool.slice(0, totalQuestions);
    currentGame.wordQueue = pool.map(w => gameData.vocab.indexOf(w));
    currentGame.usedIndices = [];

    $('startBtn').classList.add('hidden');
    $('wordInput').disabled = false;
    $('submitBtn').disabled = false;
    $('wordInput').value = '';
    $('wordInput').focus();
    showFeedback('', '');

    if (mode === 'multiplayer') {
        $('multiplayerArea').style.display = 'grid';
        updateMultiplayerUI();
        $('p1Panel').classList.remove('active-turn');
        $('p2Panel').classList.remove('active-turn');
        currentGame.currentPlayer = 0;
        $('p1Panel').classList.add('active-turn');
        $('p1TurnIndicator').textContent = '🎯 正在答题';
        $('p2TurnIndicator').textContent = '等待中...';
    } else {
        $('multiplayerArea').style.display = 'none';
    }

    if (mode !== 'multiplayer') {
        $('timerDisplay').style.display = 'flex';
        currentGame.timer = setInterval(() => {
            if (mode === 'memory') return;
            currentGame.timeLeft--;
            $('timerValue').textContent = currentGame.timeLeft;
            if (currentGame.timeLeft <= 0) endGame();
        }, 1000);
    } else {
        $('timerDisplay').style.display = 'none';
    }

    // 播放开始音效
    playStartSound();
    updateStatus();
    nextWord();
}

// ===== 下一题 =====
function nextWord() {
    if (!currentGame.isRunning) return;
    if (currentGame.mode === 'multiplayer') {
        if (currentGame.turn >= currentGame.totalTurns * 2) { endGame(); return; }
    } else {
        if (currentGame.usedIndices.length >= currentGame.wordQueue.length) { endGame(); return; }
    }

    let idx;
    if (currentGame.mode === 'multiplayer') {
        const pos = currentGame.turn % currentGame.wordQueue.length;
        idx = currentGame.wordQueue[pos];
        currentGame.turn++;
    } else {
        const available = currentGame.wordQueue.filter((_, i) => !currentGame.usedIndices.includes(i));
        if (available.length === 0) { endGame(); return; }
        const rand = Math.floor(Math.random() * available.length);
        const original = currentGame.wordQueue.indexOf(available[rand]);
        idx = available[rand];
        currentGame.usedIndices.push(original);
    }

    const word = gameData.vocab[idx];
    if (!word) { endGame(); return; }
    currentGame.currentWord = word;
    currentGame.currentWordIdx = idx;

    const mode = currentGame.mode;
    let displayText = '', hintText = '';
    const flower = getRandomFlower();

    if (mode === 'spelling') {
        displayText = word.zh;
        hintText = '请输入对应英文';
    } else if (mode === 'translate') {
        const dir = Math.random() < 0.5 ? 'en2zh' : 'zh2en';
        currentGame._translateDir = dir;
        if (dir === 'en2zh') {
            displayText = word.en;
            hintText = '请输入中文释义';
        } else {
            displayText = word.zh;
            hintText = '请输入英文单词';
        }
    } else if (mode === 'dictation') {
        displayText = '🎧 请听发音';
        hintText = '点击听发音并拼写';
        speakWord(word.en);
    } else if (mode === 'memory') {
        // 记忆模式：展示 + 语音拼读
        currentGame.memoryPhase = 'show';
        currentGame.memoryCountdown = 3;
        const example = word.example || '（暂无例句）';
        displayText = `<span class="flower">${flower}</span> ${word.en} <span style="font-size:1.2rem;opacity:0.8;">${word.zh}</span>`;
        hintText = `💡 ${example}  ⏳ ${currentGame.memoryCountdown}s`;
        $('wordInput').disabled = true;
        $('submitBtn').disabled = true;
        // 播放语音拼读
        speakWordWithSpelling(word.en);
        // 播放记忆开始提示音
        playMemoryStartSound();

        if (currentGame.memoryTimer) clearInterval(currentGame.memoryTimer);
        currentGame.memoryTimer = setInterval(() => {
            currentGame.memoryCountdown--;
            if (currentGame.memoryCountdown > 0) {
                $('hintDisplay').textContent = `💡 ${example}  ⏳ ${currentGame.memoryCountdown}s`;
                $('chineseDisplay').innerHTML = `<span class="flower">${flower}</span> ${word.en} <span style="font-size:1.2rem;opacity:0.8;">${word.zh}</span>`;
            } else {
                clearInterval(currentGame.memoryTimer);
                currentGame.memoryPhase = 'recall';
                $('chineseDisplay').innerHTML = `<span class="flower">${flower}</span> ${word.zh}`;
                $('hintDisplay').textContent = '✍️ 回忆并输入英文单词';
                $('wordInput').disabled = false;
                $('submitBtn').disabled = false;
                $('wordInput').value = '';
                $('wordInput').focus();
                updateProgress((currentGame.usedIndices.length / currentGame.wordQueue.length) * 100);
            }
        }, 1000);
        $('chineseDisplay').innerHTML = displayText;
        $('hintDisplay').textContent = hintText;
        $('wordInput').value = '';
        return;
    } else if (mode === 'multiplayer') {
        displayText = word.zh;
        hintText = '玩家' + (currentGame.currentPlayer+1) + '，输入英文';
    }

    $('chineseDisplay').innerHTML = displayText;
    $('hintDisplay').textContent = hintText;
    $('wordInput').value = '';
    $('wordInput').focus();
    updateProgress((currentGame.usedIndices.length / currentGame.wordQueue.length) * 100);
}

function speakWord(word) {
    if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.9;
        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
    } else {
        showFeedback('⚠️ 浏览器不支持语音', 'wrong');
    }
}

// ===== 提交答案 =====
function submitAnswer() {
    if (!currentGame.isRunning || !currentGame.currentWord) return;
    if (currentGame.mode === 'memory' && currentGame.memoryPhase === 'show') {
        showFeedback('⏳ 请等待记忆结束', 'info');
        return;
    }
    const input = $('wordInput').value.trim();
    if (!input) { showFeedback('请输入答案', 'wrong'); return; }
    const word = currentGame.currentWord;
    let isCorrect = false;
    const mode = currentGame.mode;

    if (mode === 'spelling' || mode === 'multiplayer') {
        const norm = input.toLowerCase().replace(/\s+/g, ' ');
        const target = word.en.toLowerCase().replace(/\s+/g, ' ');
        isCorrect = (norm === target);
    } else if (mode === 'translate') {
        const dir = currentGame._translateDir;
        if (dir === 'en2zh') {
            isCorrect = (input.trim() === word.zh);
        } else {
            const norm = input.toLowerCase().replace(/\s+/g, ' ');
            const target = word.en.toLowerCase().replace(/\s+/g, ' ');
            isCorrect = (norm === target);
        }
    } else if (mode === 'dictation' || mode === 'memory') {
        const norm = input.toLowerCase().replace(/\s+/g, ' ');
        const target = word.en.toLowerCase().replace(/\s+/g, ' ');
        isCorrect = (norm === target);
    }

    // 更新复习数据
    const idx = gameData.vocab.indexOf(word);
    if (idx !== -1) {
        const w = gameData.vocab[idx];
        w.lastSeen = Date.now();
        if (isCorrect) {
            w.reviewCount++;
            w.nextReview = Date.now() + (w.reviewCount * 24 + 24) * 60 * 60 * 1000;
        } else {
            w.nextReview = Date.now() + 2 * 60 * 60 * 1000;
        }
        saveData();
    }

    if (isCorrect) {
        currentGame.correctCount++;
        currentGame.combo++;
        if (currentGame.combo > currentGame.maxCombo) currentGame.maxCombo = currentGame.combo;
        let bonus = 0;
        if (currentGame.combo >= 10) bonus = 10;
        else if (currentGame.combo >= 5) bonus = 5;
        else if (currentGame.combo >= 3) bonus = 2;
        const baseScore = 10 + bonus;
        const timeBonus = Math.floor(currentGame.timeLeft / 10);
        const totalScore = baseScore + timeBonus;
        currentGame.score += totalScore;
        gameData.stars++;
        addXP(15 + bonus * 2);
        if (currentGame.isMultiplayer) {
            currentGame.players[currentGame.currentPlayer].correct++;
            currentGame.players[currentGame.currentPlayer].score += totalScore;
        }
        showFeedback(`✅ 正确！+${totalScore}分 ${currentGame.combo>=3 ? '🔥连击x'+currentGame.combo : ''}`, 'correct');
        playCorrectSound();
        checkAchievements();
        gameData.statistics.correct++;
        saveData();
    } else {
        currentGame.wrongCount++;
        currentGame.combo = 0;
        if (currentGame.isMultiplayer) {
            currentGame.players[currentGame.currentPlayer].wrong++;
        }
        showFeedback(`❌ 错误，正确答案: ${word.en}`, 'wrong');
        playWrongSound();
        gameData.statistics.wrong++;
        saveData();
    }

    if (currentGame.isMultiplayer) {
        const next = 1 - currentGame.currentPlayer;
        currentGame.currentPlayer = next;
        updateMultiplayerUI();
        $('p1Panel').classList.toggle('active-turn', next === 0);
        $('p2Panel').classList.toggle('active-turn', next === 1);
        $('p1TurnIndicator').textContent = next === 0 ? '🎯 正在答题' : '等待中...';
        $('p2TurnIndicator').textContent = next === 1 ? '🎯 正在答题' : '等待中...';
    }

    updateStatus();
    setTimeout(() => {
        if (currentGame.isRunning) nextWord();
    }, isCorrect ? 400 : 1000);
}

function endGame() {
    if (!currentGame.isRunning) return;
    currentGame.isRunning = false;
    if (currentGame.timer) clearInterval(currentGame.timer);
    if (currentGame.memoryTimer) clearInterval(currentGame.memoryTimer);
    $('wordInput').disabled = true;
    $('submitBtn').disabled = true;
    $('startBtn').classList.remove('hidden');

    const overlay = $('resultOverlay');
    const title = $('resultTitle');
    const stats = $('resultStats');
    let msg = '';

    if (currentGame.isMultiplayer) {
        const p1 = currentGame.players[0];
        const p2 = currentGame.players[1];
        const winner = p1.correct > p2.correct ? '玩家1' : (p2.correct > p1.correct ? '玩家2' : '平局');
        msg = `<div>👤 玩家1: ✅ ${p1.correct} ❌ ${p1.wrong} 🏆 ${p1.score}分</div><div>👤 玩家2: ✅ ${p2.correct} ❌ ${p2.wrong} 🏆 ${p2.score}分</div><div style="font-size:1.4rem;margin-top:10px;">🏅 ${winner === '平局' ? '🤝 平局' : winner + ' 获胜！'}</div>`;
        if (winner !== '平局') {
            const ach = ACHIEVEMENTS.find(a => a.id === 'multiplayer_win');
            if (ach && !gameData.achievements.includes(ach.id)) {
                gameData.achievements.push(ach.id);
                saveData();
                msg += '<div>🏆 解锁成就：对战之王</div>';
            }
        }
        title.textContent = '🏁 对战结束';
    } else {
        const correct = currentGame.correctCount;
        const wrong = currentGame.wrongCount;
        const total = correct + wrong;
        const acc = total > 0 ? Math.round((correct/total)*100) : 0;
        let grade = acc >= 90 ? '🌟 太棒了！' : (acc >= 70 ? '👍 继续加油！' : '📖 多多练习！');
        msg = `<div>✅ 正确: ${correct}</div><div>❌ 错误: ${wrong}</div><div>🎯 正确率: ${acc}%</div><div>🔥 最高连击: ${currentGame.maxCombo}</div><div>⭐ 获得星星: ${correct} 颗</div><div>🏆 总分: ${currentGame.score}</div><div style="font-size:1.2rem;margin-top:8px;">${grade}</div>`;
        title.textContent = '📊 游戏结束';
        gameData.statistics.gamesPlayed++;
        saveData();
        checkAchievements();
        playStartSound(); // 结束播放提示音
    }
    stats.innerHTML = msg;
    overlay.style.display = 'flex';
    updateStatus();
}

function updateMultiplayerUI() {
    const p1 = currentGame.players[0];
    const p2 = currentGame.players[1];
    $('p1Score').textContent = p1.score;
    $('p1Correct').textContent = p1.correct;
    $('p1Wrong').textContent = p1.wrong;
    $('p2Score').textContent = p2.score;
    $('p2Correct').textContent = p2.correct;
    $('p2Wrong').textContent = p2.wrong;
}

// ===== 初始化 =====
function init() {
    console.log('Init...');
    loadData();
    renderWordList();
    updateStatus();

    // 花瓣生成
    const petalContainer = document.getElementById('petals');
    for (let i=0; i<20; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (8 + Math.random() * 12) + 's';
        petal.style.animationDelay = Math.random() * 10 + 's';
        petal.style.width = (15 + Math.random() * 20) + 'px';
        petal.style.height = (15 + Math.random() * 20) + 'px';
        petalContainer.appendChild(petal);
    }

    // 模式切换
    const modeBtns = els('.mode-btn');
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mode = btn.dataset.mode;
            if (mode === 'multiplayer') {
                $('multiplayerArea').style.display = 'grid';
                $('timerDisplay').style.display = 'none';
            } else {
                $('multiplayerArea').style.display = 'none';
                $('timerDisplay').style.display = 'flex';
            }
            $('startBtn').classList.remove('hidden');
            $('wordInput').disabled = true;
            $('submitBtn').disabled = true;
            $('chineseDisplay').innerHTML = '🌸 准备开始';
            $('hintDisplay').textContent = '选择模式，点击下方开始';
            showFeedback('', '');
            if (currentGame.timer) clearInterval(currentGame.timer);
            if (currentGame.memoryTimer) clearInterval(currentGame.memoryTimer);
            currentGame.isRunning = false;
        });
    });

    document.querySelector('.mode-btn[data-mode="memory"]')?.classList.add('active');

    $('startBtn').addEventListener('click', function() {
        console.log('Start clicked');
        const active = document.querySelector('.mode-btn.active');
        const mode = active ? active.dataset.mode : 'memory';
        startGame(mode);
    });

    $('submitBtn').addEventListener('click', submitAnswer);
    $('wordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            submitAnswer();
        }
    });

    $('resultRestartBtn').addEventListener('click', () => {
        $('resultOverlay').style.display = 'none';
        const active = document.querySelector('.mode-btn.active');
        if (active) startGame(active.dataset.mode);
    });
    $('resultCloseBtn').addEventListener('click', () => {
        $('resultOverlay').style.display = 'none';
        $('startBtn').classList.remove('hidden');
        $('wordInput').disabled = true;
        $('submitBtn').disabled = true;
    });

    $('addWordBtn').addEventListener('click', () => {
        const en = $('newWordEn').value.trim();
        const zh = $('newWordZh').value.trim();
        const grade = parseInt($('newWordGrade').value);
        if (!en || !zh) { alert('请填写完整'); return; }
        if (addWord(en, zh, grade)) {
            $('newWordEn').value = '';
            $('newWordZh').value = '';
            alert('添加成功！');
        } else {
            alert('单词已存在');
        }
    });

    $('reviewMode').addEventListener('change', (e) => {
        gameData.settings.reviewMode = e.target.checked;
        saveData();
    });
    $('gradeFilter').addEventListener('change', (e) => {
        gameData.settings.gradeFilter = e.target.value;
        saveData();
    });
    $('reviewMode').checked = gameData.settings.reviewMode;
    $('gradeFilter').value = gameData.settings.gradeFilter;

    $('wordInput').disabled = true;
    $('submitBtn').disabled = true;
    $('timerDisplay').style.display = 'flex';
    $('multiplayerArea').style.display = 'none';
    showFeedback('💡 选择模式，点击开始', '');
    console.log('Init done. Vocab size:', gameData.vocab.length);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
