<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 房屋 - 卫生间北移门版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #555; font-family: sans-serif; }
        
        #ui-container {
            position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.9); color: #333; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s; font-size: 14px;
        }
        .btn:hover { background: #fff; transform: translateY(-2px); }
        .btn.active { background: #2980b9; color: white; }
        .btn-measure { background: #ea4335; color: white; }
        .btn-measure:hover { background: #d33b2c; color: white; }

        #info {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            color: #fff; pointer-events: none; font-size: 15px; font-weight: bold;
            text-shadow: 1px 1px 3px #000; letter-spacing: 1px;
        }

        #floorplan-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #f4f6f8; display: none; z-index: 50;
            cursor: default;
        }
        
        #measure-tip {
            position: absolute; top: 60px; left: 15px; color: #ea4335; font-weight: bold;
            display: none; z-index: 100; text-shadow: 1px 1px 0 #fff;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-container">
        <button id="btn-tps" class="btn active">上帝视角</button>
        <button id="btn-fps" class="btn">第一人称漫游</button>
        <button id="btn-2d" class="btn">2D 平面尺寸图</button>
        <button id="btn-add-dim" class="btn btn-measure" style="display:none;">+ 添加标注</button>
    </div>
    <div id="measure-tip">请在画布上点击两个点进行测量...</div>
    <div id="info">WASD移动 | 拖拽鼠标看四周 | 点击门窗开关 | 滚轮缩放(上帝视角)</div>
    
    <canvas id="floorplan-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // ==========================================
        // 1. 场景与渲染器
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x444444); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.NoToneMapping; 
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // ==========================================
        // 2. 视角模式管理 (TPS / FPS / 2D)
        // ==========================================
        const viewState = {
            mode: 'tps', 
            tpsPos: new THREE.Vector3(12, 14, 15),
            tpsTarget: new THREE.Vector3(0, 1, 0),
            fpsPos: new THREE.Vector3(-1.0, 1.6, 2.0), 
            fpsYaw: 0,
            fpsPitch: 0
        };

        camera.position.copy(viewState.tpsPos);
        controls.target.copy(viewState.tpsTarget);
        controls.update();

        // ==========================================
        // 3. 交互系统
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactables = []; 

        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (viewState.mode !== 'fps') return;
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.key === 'ArrowUp') keys.up = true;
            if (e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === 'ArrowUp') keys.up = false;
            if (e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };
        let mouseMovedDist = 0;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (viewState.mode === '2d') return;
            isDragging = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
            mouseMovedDist = 0;
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (viewState.mode === '2d' || !isDragging) return;

            const deltaX = e.clientX - prevMousePos.x;
            const deltaY = e.clientY - prevMousePos.y;
            mouseMovedDist += Math.abs(deltaX) + Math.abs(deltaY);

            if (viewState.mode === 'fps') {
                const rotationSpeed = 0.003;
                viewState.fpsYaw -= deltaX * rotationSpeed;
                viewState.fpsPitch -= deltaY * rotationSpeed;
                viewState.fpsPitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, viewState.fpsPitch));

                const euler = new THREE.Euler(viewState.fpsPitch, viewState.fpsYaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
            }
            
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (viewState.mode === '2d') return;
            isDragging = false;

            if (mouseMovedDist < 5) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactables, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj && !obj.userData.isInteractive) {
                        obj = obj.parent;
                    }
                    if (obj) {
                        obj.userData.isOpen = !obj.userData.isOpen;
                    }
                }
            }
        });

        // ==========================================
        // 4. 光影系统
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); 
        dirLight.position.set(10, 20, 15); 
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005; 
        dirLight.shadow.normalBias = 0.02; 
        scene.add(dirLight);

        // ==========================================
        // 5. 材质与贴图
        // ==========================================
        function createTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e8e8e8'; ctx.fillRect(0, 0, 512, 512);
            const tileSize = 512 / 4; 
            ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 4;
            for(let i=0; i<=4; i++) {
                ctx.beginPath(); ctx.moveTo(i*tileSize, 0); ctx.lineTo(i*tileSize, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*tileSize); ctx.lineTo(512, i*tileSize); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 3); tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const matWall = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 }); 
        const matFloorTile = new THREE.MeshStandardMaterial({ map: createTileTexture(), roughness: 0.4, metalness: 0.1 }); 
        const matStair = matFloorTile; 
        const matRailing = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.4, metalness: 0.6 }); 
        
        const matCol = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 }); 
        const matCopper = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.4, metalness: 0.6 }); 
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.35, metalness: 0.6, roughness: 0.1 });

        // ==========================================
        // 6. 尺寸与构建函数
        // ==========================================
        const W = 9.24, D = 10.24, H = 3.5;
        const tExt = 0.24, tInt = 0.24; 
        const doorH = 2.4; 

        function box(w, h, d, x, y, z, mat, cast = true, rec = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z); 
            mesh.castShadow = cast; mesh.receiveShadow = rec;
            scene.add(mesh); return mesh;
        }

        function createInteractiveMainDoor(x, y, z) {
            const doorW = 2.4; 
            const halfW = doorW / 2; 
            const doorT = 0.1;
            
            const leftDoorGrp = new THREE.Group();
            leftDoorGrp.position.set(-halfW, 0, 0); 
            const leftDoorMesh = new THREE.Mesh(new THREE.BoxGeometry(halfW - 0.005, doorH, doorT), matCopper);
            leftDoorMesh.position.set((halfW - 0.005)/2, doorH/2, 0); 
            leftDoorGrp.add(leftDoorMesh);
            
            const rightDoorGrp = new THREE.Group();
            rightDoorGrp.position.set(halfW, 0, 0); 
            const rightDoorMesh = new THREE.Mesh(new THREE.BoxGeometry(halfW - 0.005, doorH, doorT), matCopper);
            rightDoorMesh.position.set(-(halfW - 0.005)/2, doorH/2, 0); 
            rightDoorGrp.add(rightDoorMesh);
            
            leftDoorGrp.userData = { isInteractive: true, type: 'door', isOpen: false, targetAngle: 0, openAngle: -Math.PI/2 * 0.9 };
            rightDoorGrp.userData = { isInteractive: true, type: 'door', isOpen: false, targetAngle: 0, openAngle: Math.PI/2 * 0.9 };
            
            interactables.push(leftDoorGrp, rightDoorGrp);

            const container = new THREE.Group();
            container.add(leftDoorGrp, rightDoorGrp);
            container.position.set(x, y, z);
            scene.add(container);
        }

        function createInteractiveWindow(w, h, x, y, z, rotY = 0) {
            const container = new THREE.Group();
            const frameT = 0.15; 
            let m = new THREE.Mesh(new THREE.BoxGeometry(w, frameT, 0.15), matCopper); m.position.y = h/2 - frameT/2; container.add(m);
            m = new THREE.Mesh(new THREE.BoxGeometry(w, frameT, 0.15), matCopper); m.position.y = -h/2 + frameT/2; container.add(m);
            m = new THREE.Mesh(new THREE.BoxGeometry(frameT, h, 0.15), matCopper); m.position.x = -w/2 + frameT/2; container.add(m);
            m = new THREE.Mesh(new THREE.BoxGeometry(frameT, h, 0.15), matCopper); m.position.x = w/2 - frameT/2; container.add(m);

            const windowSash = new THREE.Group();
            windowSash.position.set(-w/2 + frameT, 0, 0); 
            
            const innerW = w - frameT * 2;
            const innerH = h - frameT * 2;
            const vT = 0.08, hT = 0.1;
            const sideW = 0.4, centerW = 0.54;
            
            let v = new THREE.Mesh(new THREE.BoxGeometry(vT, h, 0.15), matCopper); v.position.x = sideW + vT/2; windowSash.add(v);
            v = new THREE.Mesh(new THREE.BoxGeometry(vT, h, 0.15), matCopper); v.position.x = sideW + vT + centerW + vT/2; windowSash.add(v);
            
            let hBar = new THREE.Mesh(new THREE.BoxGeometry(sideW, hT, 0.15), matCopper); hBar.position.set(sideW/2, 0.3, 0); windowSash.add(hBar);
            hBar = new THREE.Mesh(new THREE.BoxGeometry(sideW, hT, 0.15), matCopper); hBar.position.set(sideW + vT + centerW + vT + sideW/2, 0.3, 0); windowSash.add(hBar);

            const gGlass = new THREE.Mesh(new THREE.BoxGeometry(innerW, innerH, 0.02), matGlass); gGlass.position.set(innerW/2, 0, 0); windowSash.add(gGlass);

            const openDir = (Math.abs(rotY) < 0.1) ? Math.PI/2 * 0.9 : -Math.PI/2 * 0.9;
            windowSash.userData = { isInteractive: true, type: 'window', isOpen: false, targetAngle: 0, openAngle: openDir };
            interactables.push(windowSash);
            
            container.add(windowSash);
            container.position.set(x, y, z);
            container.rotation.y = rotY;
            scene.add(container);
        }

        // ==========================================
        // 7. 构建场景
        // ==========================================
        box(2.30, 0.05, 9.80, -3.25, 0.02, 0, matFloorTile); 
        box(2.80, 0.05, 2.04, -0.5, 0.02, -3.88, matFloorTile); 
        box(3.30, 0.05, 3.30, 2.75, 0.02, -3.25, matFloorTile); 
        box(1.30, 0.05, 1.80, 1.75, 0.02, -0.5, matFloorTile); 
        box(1.80, 0.05, 1.80, 3.50, 0.02, -0.5, matFloorTile); 
        box(2.80, 0.05, 3.30, -0.5, 0.02, -1.01, matFloorTile); 
        box(5.30, 0.05, 4.54, -1.75, 0.02, 2.63, matFloorTile); 
        box(3.30, 0.05, 4.30, 2.75, 0.02, 2.75, matFloorTile); 

        box(tExt, H, D, -4.5, H/2, 0, matWall); 
        box(tExt, H, D, 4.5, H/2, 0, matWall);  
        
        box(1.45, H, tExt, -3.895, H/2, -5.0, matWall); 
        box(1.0, H - 2.0, tExt, -2.67, 2.0 + (H-2.0)/2, -5.0, matWall); 
        box(1.0, 2.0, 0.1, -2.67, 1.0, -5.0, matCopper); 
        box(0.77, H, tExt, -1.785, H/2, -5.0, matWall); 
        box(1.8, 0.9, tExt, -0.5, 0.45, -5.0, matWall); 
        box(1.8, H - 2.7, tExt, -0.5, 2.7 + (H-2.7)/2, -5.0, matWall); 
        createInteractiveWindow(1.8, 1.8, -0.5, 1.8, -5.0, Math.PI); 
        box(1.45, H, tExt, 1.125, H/2, -5.0, matWall);
        box(1.8, 0.9, tExt, 2.75, 0.45, -5.0, matWall); 
        box(1.8, H - 2.7, tExt, 2.75, 2.7 + (H-2.7)/2, -5.0, matWall); 
        createInteractiveWindow(1.8, 1.8, 2.75, 1.8, -5.0, Math.PI); 
        box(0.97, H, tExt, 4.135, H/2, -5.0, matWall);

        box(0.73, H, tExt, -4.015, H/2, 5.0, matWall); 
        box(1.8, 0.9, tExt, -2.75, 0.45, 5.0, matWall); 
        box(1.8, H - 2.7, tExt, -2.75, 2.7 + (H-2.7)/2, 5.0, matWall); 
        createInteractiveWindow(1.8, 1.8, -2.75, 1.8, 5.0, 0); 
        box(0.45, H, tExt, -1.625, H/2, 5.0, matWall); 
        box(2.4, H - doorH, tExt, -0.2, doorH + (H-doorH)/2, 5.0, matWall); 
        createInteractiveMainDoor(-0.2, 0, 5.0); 
        box(0.85, H, tExt, 1.425, H/2, 5.0, matWall); 
        box(1.8, 0.9, tExt, 2.75, 0.45, 5.0, matWall); 
        box(1.8, H - 2.7, tExt, 2.75, 2.7 + (H-2.7)/2, 5.0, matWall); 
        createInteractiveWindow(1.8, 1.8, 2.75, 1.8, 5.0, 0); 
        box(0.73, H, tExt, 4.015, H/2, 5.0, matWall);

        box(tInt, H, 1.18, -2.00, H/2, -4.29, matWall); 
        box(tInt, H-2.1, 0.8, -2.00, 2.1 + (H-2.1)/2, -3.3, matWall); 
        box(tInt, H, 0.94, -2.00, H/2, -2.17, matWall); 

        box(tInt, H, 3.26, 1.00, H/2, -3.25, matWall); 
        box(tInt, H, 0.37, 1.00, H/2, 0.565, matWall); 
        box(tInt, H, 3.23, 1.00, H/2, 3.265, matWall); 
        box(tInt, H-2.1, 0.9, 1.00, 2.1 + (H-2.1)/2, 1.2, matWall); 

        // 【修改点】卫生间门往北移
        // 北段 0.23m (中心 -1.265)
        box(tInt, H, 0.23, 2.50, H/2, -1.265, matWall); 
        // 南段 0.83m (中心 -0.035)
        box(tInt, H, 0.83, 2.50, H/2, -0.035, matWall); 
        // 门头 0.7m (中心 -0.8)
        box(tInt, H-2.1, 0.7, 2.50, 2.1 + (H-2.1)/2, -0.8, matWall); 

        box(3.24, H, tInt, -0.5, H/2, -2.76, matWall); 
        box(0.32, H, tInt, 1.04, H/2, -1.50, matWall); 
        box(2.38, H, tInt, 3.19, H/2, -1.50, matWall); 
        box(0.8, H-2.1, tInt, 1.6, 2.1 + (H-2.1)/2, -1.50, matWall); 
        box(3.50, H, tInt, 2.63, H/2, 0.50, matWall); 

        // ==========================================
        // 8. 承重柱与楼梯
        // ==========================================
        box(0.4, H, 0.4, -2.00, H/2, 0.50, matCol);
        box(0.4, H, 0.4, -2.00, H/2, -1.50, matCol);

        const platformH = 2.2; 
        const platformDepth = 1.2; 
        const backWallInner = -D/2 + tExt; 
        const platformFrontZ = backWallInner + platformDepth; 
        
        const stepH1 = platformH / 14;
        const stepD1 = 4.4 / 14; 
        const run1StartZ = platformFrontZ + 4.4; 

        const railH = 0.9; 
        const railT = 0.06;
        
        for(let i=1; i<=14; i++) {
            const zCenter = run1StartZ - (i - 0.5) * stepD1; 
            box(1.1, 0.15, stepD1, -3.83, stepH1*i - 0.075, zCenter, matStair);
            
            if (i % 2 === 1) {
                box(0.04, railH, 0.04, -3.28, stepH1*i + railH/2, zCenter, matRailing);
            }
        }

        const run1RailLength = Math.sqrt(4.4*4.4 + platformH*platformH);
        const run1Angle = Math.atan2(platformH, 4.4);
        const rail1 = new THREE.Mesh(new THREE.BoxGeometry(railT, railT, run1RailLength), matRailing);
        rail1.position.set(-3.28, platformH / 2 + railH, (run1StartZ + platformFrontZ) / 2);
        rail1.rotation.x = run1Angle;
        rail1.castShadow = true;
        scene.add(rail1);

        box(0.04, railH, 0.04, -3.28, platformH + railH/2, platformFrontZ, matRailing);

        box(2.26, 0.15, platformDepth, -3.25, platformH - 0.075, -4.28, matStair);

        const stepH2 = (H - platformH) / 9;
        const stepD2 = 2.4 / 9; 

        box(0.04, railH, 0.04, -3.22, platformH + railH/2, platformFrontZ, matRailing);

        for(let i=1; i<=9; i++) {
            const zCenter = platformFrontZ + (i - 0.5) * stepD2;
            box(1.1, 0.15, stepD2, -2.67, platformH + stepH2*i - 0.075, zCenter, matStair);
            
            if (i % 2 === 1 || i === 9) {
                box(0.04, railH, 0.04, -3.22, platformH + stepH2*i + railH/2, zCenter, matRailing);
            }
        }

        const run2RailLength = Math.sqrt(2.4*2.4 + (H - platformH)*(H - platformH));
        const run2Angle = Math.atan2(H - platformH, 2.4);
        const rail2 = new THREE.Mesh(new THREE.BoxGeometry(railT, railT, run2RailLength), matRailing);
        rail2.position.set(-3.22, platformH + (H - platformH) / 2 + railH, platformFrontZ + 1.2);
        rail2.rotation.x = -run2Angle;
        rail2.castShadow = true;
        scene.add(rail2);

        // ==========================================
        // 9. 2D 交互式平面图
        // ==========================================
        const canvas2D = document.getElementById('floorplan-canvas');
        const ctx = canvas2D.getContext('2d');
        let scale = 50; 
        let offsetX = 0;
        let offsetY = 0;
        let dimensions = [
            { id: 1, x1: -4.62, z1: -5.12, x2: 4.62, z2: -5.12, offset: -1.2, text: '9.24m' },
            { id: 2, x1: -4.62, z1: -5.12, x2: -4.62, z2: 5.12, offset: 1.2, text: '10.24m' },
            { id: 3, x1: -4.38, z1: -4.88, x2: -2.12, z2: -4.88, offset: -0.6, text: '2.26m' },
            { id: 4, x1: -1.88, z1: -4.88, x2: 0.88, z2: -4.88, offset: -0.6, text: '2.76m' },
            { id: 5, x1: 1.12, z1: -4.88, x2: 4.38, z2: -4.88, offset: -0.6, text: '3.26m' },
            { id: 6, x1: 4.38, z1: -4.88, x2: 4.38, z2: -1.62, offset: 0.6, text: '3.26m' },
            { id: 7, x1: 4.38, z1: -1.62, x2: 4.38, z2: 0.14, offset: 0.6, text: '1.76m' },
            { id: 8, x1: 2.62, z1: -1.38, x2: 4.38, z2: -1.38, offset: -0.6, text: '1.76m' },
            { id: 9, x1: 1.12, z1: -1.38, x2: 2.38, z2: -1.38, offset: -0.6, text: '1.26m' },
            { id: 10, x1: -1.88, z1: -4.88, x2: -1.88, z2: -2.88, offset: -0.6, text: '2.00m' },
            { id: 11, x1: 4.38, z1: 0.62, x2: 4.38, z2: 4.88, offset: 0.6, text: '4.26m' },
            { id: 12, x1: -4.38, z1: 4.88, x2: 0.88, z2: 4.88, offset: 0.8, text: '5.26m' },
            { id: 13, x1: 1.12, z1: 4.88, x2: 4.38, z2: 4.88, offset: 0.8, text: '3.26m' },
            { id: 14, x1: -2.2, z1: -1.50, x2: -2.2, z2: 0.50, offset: -0.6, text: '2.00m' }, 
            { id: 15, x1: 5.12, z1: 0.50, x2: 5.12, z2: 4.88, offset: 1.2, text: '4.38m' }, 
            { id: 16, x1: -3.65, z1: 5.12, x2: -1.85, z2: 5.12, offset: 0.6, text: '1.8m' },
            { id: 17, x1: 1.85, z1: 5.12, x2: 3.65, z2: 5.12, offset: 0.6, text: '1.8m' },
            { id: 18, x1: -3.17, z1: -5.12, x2: -2.17, z2: -5.12, offset: -0.6, text: '1.0m' },
            { id: 19, x1: -1.4, z1: -5.12, x2: 0.4, z2: -5.12, offset: -0.6, text: '1.8m' }, 
            { id: 20, x1: 1.85, z1: -5.12, x2: 3.65, z2: -5.12, offset: -0.6, text: '1.8m' }, 
            { id: 21, x1: -4.38, z1: run1StartZ, x2: -4.38, z2: platformFrontZ, offset: -0.8, text: '4.4m' }, 
            { id: 22, x1: -2.12, z1: platformFrontZ, x2: -2.12, z2: (platformFrontZ + 2.4), offset: 0.8, text: '2.4m' }, 
            { id: 23, x1: -2.12, z1: backWallInner, x2: -2.12, z2: platformFrontZ, offset: 0.8, text: '1.2m 平台' } 
        ];
        let isMeasuring = false, measureStart = null, draggingDim = null, lastMouse = { x: 0, y: 0 };

        const getX = (x) => offsetX + x * scale;
        const getY = (z) => offsetY + z * scale;
        const screenToWorld = (sx, sy) => { return { x: (sx - offsetX) / scale, z: (sy - offsetY) / scale }; };

        function draw2DPlan() {
            canvas2D.width = window.innerWidth;
            canvas2D.height = window.innerHeight;
            scale = Math.min(window.innerWidth / 15, window.innerHeight / 13); 
            offsetX = canvas2D.width / 2; offsetY = canvas2D.height / 2;
            ctx.clearRect(0, 0, canvas2D.width, canvas2D.height);

            const drawRect = (w, d, x, z, color) => { ctx.fillStyle = color; ctx.fillRect(getX(x - w/2), getY(z - d/2), w * scale, d * scale); };
            drawRect(2.26, 9.76, -3.25, 0, '#e8f0fe'); drawRect(2.76, 2.00, -0.5, -3.88, '#e6f4ea'); drawRect(3.26, 3.26, 2.75, -3.25, '#fef7e0'); 
            drawRect(1.26, 1.76, 1.75, -0.5, '#f1f3f4'); drawRect(1.76, 1.76, 3.50, -0.5, '#fce8e6'); drawRect(2.76, 3.26, -0.5, -1.01, '#f1f3f4'); 
            drawRect(5.26, 4.50, -1.75, 2.63, '#ffffff'); drawRect(3.26, 4.26, 2.75, 2.75, '#fdf6e3'); 

            const drawWallBox = (w, d, x, z, color='#333') => { ctx.fillStyle = color; ctx.fillRect(getX(x - w/2), getY(z - d/2), w * scale, d * scale); };

            drawWallBox(tExt, D, -4.5, 0); drawWallBox(tExt, D, 4.5, 0);  
            drawWallBox(1.45, tExt, -3.895, -5.0); drawWallBox(1.0, tExt, -2.67, -5.0, '#555'); drawWallBox(0.77, tExt, -1.785, -5.0); 
            drawWallBox(1.8, tExt, -0.5, -5.0, '#88ccff'); drawWallBox(1.45, tExt, 1.125, -5.0); drawWallBox(1.8, tExt, 2.75, -5.0, '#88ccff'); drawWallBox(0.97, tExt, 4.135, -5.0); 
            drawWallBox(0.73, tExt, -4.015, 5.0); drawWallBox(1.8, tExt, -2.75, 5.0, '#88ccff'); drawWallBox(0.45, tExt, -1.625, 5.0); drawWallBox(2.4, tExt, -0.2, 5.0, '#555'); 
            ctx.strokeStyle = '#555'; ctx.beginPath(); ctx.arc(getX(-0.2 - 1.2), getY(5.0), 1.2 * scale, 0, Math.PI/2); ctx.stroke();
            drawWallBox(0.85, tExt, 1.425, 5.0); drawWallBox(1.8, tExt, 2.75, 5.0, '#88ccff'); drawWallBox(0.73, tExt, 4.015, 5.0); 

            drawWallBox(tInt, 1.18, -2.00, -4.29); drawWallBox(tInt, 0.94, -2.00, -2.17); 
            drawWallBox(tInt, 3.26, 1.00, -3.25); drawWallBox(tInt, 0.37, 1.00, 0.565); drawWallBox(tInt, 3.23, 1.00, 3.265); 
            
            // 【修改点】2D 中同步更新卫生间门的分段
            drawWallBox(tInt, 0.23, 2.50, -1.265); // 后段
            drawWallBox(tInt, 0.83, 2.50, -0.035); // 前段
            
            drawWallBox(3.24, tInt, -0.5, -2.76); drawWallBox(0.32, tInt, 1.04, -1.50); drawWallBox(2.38, tInt, 3.19, -1.50); drawWallBox(3.50, tInt, 2.63, 0.50); 
            drawWallBox(0.4, 0.4, -2.00, 0.50, '#666'); drawWallBox(0.4, 0.4, -2.00, -1.50, '#666'); 

            ctx.fillStyle = '#8ab4f8';
            for(let i=1; i<=14; i++) { const zCenter = run1StartZ - (i - 0.5) * stepD1; ctx.fillRect(getX(-3.83 - 0.55), getY(zCenter - stepD1/2), 1.1*scale, stepD1*scale); }
            ctx.fillRect(getX(-3.25 - 1.13), getY(-4.28 - 0.6), 2.26*scale, 1.2*scale); 
            for(let i=1; i<=9; i++) { const zCenter = platformFrontZ + (i - 0.5) * stepD2; ctx.fillRect(getX(-2.67 - 0.55), getY(zCenter - stepD2/2), 1.1*scale, stepD2*scale); }

            ctx.fillStyle = '#1a73e8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('楼梯间', getX(-3.25), getY(-1.0)); ctx.fillText('厨房', getX(-0.5), getY(-3.88)); ctx.fillText('杂物间', getX(2.75), getY(-3.25));
            ctx.fillText('洗漱过道', getX(1.75), getY(-0.5)); ctx.fillText('卫生间', getX(3.50), getY(-0.5)); ctx.fillText('餐厅', getX(-0.5), getY(-1.01));
            ctx.fillText('客厅', getX(-1.75), getY(2.63)); ctx.fillText('卧室1', getX(2.75), getY(2.75));

            dimensions.forEach(dim => {
                const dx = dim.x2 - dim.x1, dz = dim.z2 - dim.z1; const len = Math.sqrt(dx*dx + dz*dz); if(len === 0) return;
                const nx = -dz / len, nz = dx / len; const px1 = dim.x1 + nx * dim.offset, pz1 = dim.z1 + nz * dim.offset; const px2 = dim.x2 + nx * dim.offset, pz2 = dim.z2 + nz * dim.offset;
                ctx.strokeStyle = '#ea4335'; ctx.lineWidth = 1; ctx.beginPath(); const ext = 0.15;
                ctx.moveTo(getX(dim.x1 + nx*ext), getY(dim.z1 + nz*ext)); ctx.lineTo(getX(px1 - nx*ext), getY(pz1 - nz*ext));
                ctx.moveTo(getX(dim.x2 + nx*ext), getY(dim.z2 + nz*ext)); ctx.lineTo(getX(px2 - nx*ext), getY(pz2 - nz*ext)); ctx.stroke();
                ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(getX(px1), getY(pz1)); ctx.lineTo(getX(px2), getY(pz2)); ctx.stroke();
                const tick = 0.15; ctx.beginPath();
                ctx.moveTo(getX(px1 - nx*tick - dx/len*tick), getY(pz1 - nz*tick - dz/len*tick)); ctx.lineTo(getX(px1 + nx*tick + dx/len*tick), getY(pz1 + nz*tick + dz/len*tick));
                ctx.moveTo(getX(px2 - nx*tick - dx/len*tick), getY(pz2 - nz*tick - dz/len*tick)); ctx.lineTo(getX(px2 + nx*tick + dx/len*tick), getY(pz2 + nz*tick + dz/len*tick)); ctx.stroke();
                ctx.fillStyle = '#ea4335'; ctx.font = 'bold 12px sans-serif'; const midX = (px1 + px2) / 2; const midZ = (pz1 + pz2) / 2; const textWidth = ctx.measureText(dim.text).width;
                ctx.fillStyle = 'rgba(244, 246, 248, 0.9)'; ctx.fillRect(getX(midX) - textWidth/2 - 4, getY(midZ) - 8, textWidth + 8, 16);
                ctx.fillStyle = '#ea4335'; ctx.fillText(dim.text, getX(midX), getY(midZ));
            });

            if (isMeasuring && measureStart) {
                ctx.strokeStyle = '#2980b9'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath();
                ctx.moveTo(getX(measureStart.x), getY(measureStart.z)); ctx.lineTo(lastMouse.x, lastMouse.y); ctx.stroke(); ctx.setLineDash([]);
            }
        }

        canvas2D.addEventListener('mousedown', (e) => {
            if (viewState.mode !== '2d') return;
            const rect = canvas2D.getBoundingClientRect(); const sx = e.clientX - rect.left; const sy = e.clientY - rect.top; const world = screenToWorld(sx, sy);
            if (isMeasuring) {
                if (!measureStart) { measureStart = world; } else {
                    const dx = world.x - measureStart.x; const dz = world.z - measureStart.z; const dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist > 0.1) { dimensions.push({ id: Date.now(), x1: measureStart.x, z1: measureStart.z, x2: world.x, z2: world.z, offset: 0.5, text: dist.toFixed(2) + 'm' }); }
                    measureStart = null; isMeasuring = false; btnAddDim.textContent = '+ 添加标注'; btnAddDim.classList.remove('active');
                    document.getElementById('measure-tip').style.display = 'none'; canvas2D.style.cursor = 'default'; draw2DPlan();
                }
            } else {
                for (let i = dimensions.length - 1; i >= 0; i--) {
                    const dim = dimensions[i]; const dx = dim.x2 - dim.x1, dz = dim.z2 - dim.z1; const len = Math.sqrt(dx*dx + dz*dz); const nx = -dz / len, nz = dx / len;
                    const px1 = dim.x1 + nx * dim.offset, pz1 = dim.z1 + nz * dim.offset; const px2 = dim.x2 + nx * dim.offset, pz2 = dim.z2 + nz * dim.offset;
                    const lineScreenX1 = getX(px1), lineScreenY1 = getY(pz1); const lineScreenX2 = getX(px2), lineScreenY2 = getY(pz2);
                    const d = Math.abs((lineScreenY2 - lineScreenY1) * sx - (lineScreenX2 - lineScreenX1) * sy + lineScreenX2 * lineScreenY1 - lineScreenY2 * lineScreenX1) / Math.sqrt(Math.pow(lineScreenY2 - lineScreenY1, 2) + Math.pow(lineScreenX2 - lineScreenX1, 2));
                    if (d < 10) { draggingDim = dim; break; }
                }
            }
        });

        canvas2D.addEventListener('mousemove', (e) => {
            if (viewState.mode !== '2d') return;
            const rect = canvas2D.getBoundingClientRect(); const sx = e.clientX - rect.left; const sy = e.clientY - rect.top; lastMouse = { x: sx, y: sy };
            if (draggingDim) {
                const world = screenToWorld(sx, sy); const dx = draggingDim.x2 - draggingDim.x1, dz = draggingDim.z2 - draggingDim.z1; const len = Math.sqrt(dx*dx + dz*dz); const nx = -dz / len, nz = dx / len;
                const midX = (draggingDim.x1 + draggingDim.x2) / 2; const midZ = (draggingDim.z1 + draggingDim.z2) / 2; draggingDim.offset = (world.x - midX) * nx + (world.z - midZ) * nz; draw2DPlan();
            } else if (isMeasuring) {
                draw2DPlan();
                if (measureStart) {
                    ctx.strokeStyle = '#2980b9'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath();
                    ctx.moveTo(getX(measureStart.x), getY(measureStart.z)); ctx.lineTo(lastMouse.x, lastMouse.y); ctx.stroke(); ctx.setLineDash([]);
                }
            } else {
                let hovering = false;
                for (let i = 0; i < dimensions.length; i++) {
                    const dim = dimensions[i]; const dx = dim.x2 - dim.x1, dz = dim.z2 - dim.z1; const len = Math.sqrt(dx*dx + dz*dz); const nx = -dz / len, nz = dx / len;
                    const px1 = dim.x1 + nx * dim.offset, pz1 = dim.z1 + nz * dim.offset; const px2 = dim.x2 + nx * dim.offset, pz2 = dim.z2 + nz * dim.offset;
                    const lineScreenX1 = getX(px1), lineScreenY1 = getY(pz1); const lineScreenX2 = getX(px2), lineScreenY2 = getY(pz2);
                    const d = Math.abs((lineScreenY2 - lineScreenY1) * sx - (lineScreenX2 - lineScreenX1) * sy + lineScreenX2 * lineScreenY1 - lineScreenY2 * lineScreenX1) / Math.sqrt(Math.pow(lineScreenY2 - lineScreenY1, 2) + Math.pow(lineScreenX2 - lineScreenX1, 2));
                    if (d < 10) { hovering = true; break; }
                }
                canvas2D.style.cursor = hovering ? 'pointer' : 'default';
            }
        });

        canvas2D.addEventListener('mouseup', () => { draggingDim = null; });

        // ==========================================
        // 10. UI 逻辑 (视角切换)
        // ==========================================
        const btnTPS = document.getElementById('btn-tps');
        const btnFPS = document.getElementById('btn-fps');
        const btn2D = document.getElementById('btn-2d');
        const btnAddDim = document.getElementById('btn-add-dim');

        function switchMode(mode) {
            viewState.mode = mode;
            btnTPS.classList.remove('active');
            btnFPS.classList.remove('active');
            btn2D.classList.remove('active');
            btnAddDim.style.display = 'none';
            document.getElementById('measure-tip').style.display = 'none';

            if (mode === 'tps') {
                btnTPS.classList.add('active');
                controls.enabled = true;
                canvas2D.style.display = 'none';
                renderer.domElement.style.display = 'block';
                camera.position.copy(viewState.tpsPos);
                controls.target.copy(viewState.tpsTarget);
                controls.update();
            } else if (mode === 'fps') {
                btnFPS.classList.add('active');
                controls.enabled = false;
                canvas2D.style.display = 'none';
                renderer.domElement.style.display = 'block';
                camera.position.copy(viewState.fpsPos);
                viewState.fpsYaw = 0;
                viewState.fpsPitch = 0;
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
            } else if (mode === '2d') {
                btn2D.classList.add('active');
                controls.enabled = false;
                canvas2D.style.display = 'block';
                renderer.domElement.style.display = 'none';
                btnAddDim.style.display = 'block';
                draw2DPlan();
            }
        }

        btnTPS.addEventListener('click', () => switchMode('tps'));
        btnFPS.addEventListener('click', () => switchMode('fps'));
        btn2D.addEventListener('click', () => switchMode('2d'));

        btnAddDim.addEventListener('click', () => {
            isMeasuring = !isMeasuring; measureStart = null;
            if (isMeasuring) {
                btnAddDim.classList.add('active'); document.getElementById('measure-tip').style.display = 'block'; canvas2D.style.cursor = 'crosshair';
            } else {
                btnAddDim.classList.remove('active'); document.getElementById('measure-tip').style.display = 'none'; canvas2D.style.cursor = 'default';
            }
            draw2DPlan();
        });

        // ==========================================
        // 11. 渲染循环 (包含门窗动画与 FPS 移动)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            
            if (viewState.mode === 'tps') {
                controls.update();
            } else if (viewState.mode === 'fps') {
                const speed = 0.08;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();

                if (keys.w || keys.up) camera.position.addScaledVector(forward, speed);
                if (keys.s || keys.down) camera.position.addScaledVector(forward, -speed);
                if (keys.a || keys.left) camera.position.addScaledVector(right, -speed);
                if (keys.d || keys.right) camera.position.addScaledVector(right, speed);

                camera.position.x = Math.max(-4.3, Math.min(4.3, camera.position.x));
                camera.position.z = Math.max(-4.8, Math.min(4.8, camera.position.z));
                camera.position.y = 1.6;
            }

            if (viewState.mode !== '2d') {
                interactables.forEach(obj => {
                    if (obj.userData.isInteractive) {
                        const targetRot = obj.userData.isOpen ? obj.userData.openAngle : obj.userData.targetAngle;
                        obj.rotation.y = THREE.MathUtils.lerp(obj.rotation.y, targetRot, 0.15);
                    }
                });
                renderer.render(scene, camera);
            }
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (viewState.mode === '2d') draw2DPlan(); 
        });
        
        animate();
    </script>
</body>
